<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A6B;--gold:#C4932A;--gold2:#E8B84B;
  --bg:#EDE0C4;--bg2:#F7F0E0;--bg3:#FBF7EE;--ink:#1A0E07;
  --muted:#7A6248;--border:#C8B480;--shadow:rgba(27,58,107,0.10);
  --serif:'Cormorant Garamond',Georgia,serif;--body:'Crimson Pro',Georgia,serif;
}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;
  background-image:linear-gradient(rgba(27,58,107,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,58,107,0.04) 1px,transparent 1px);
  background-size:64px 64px}
.notice{background:var(--navy);color:rgba(255,255,255,0.9);text-align:center;
  padding:0.6rem 1.5rem;font-family:var(--serif);font-size:0.95rem;
  letter-spacing:0.22em;text-transform:uppercase}
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;
  justify-content:space-between;padding:0 2.5rem;height:70px;
  background:rgba(237,224,196,0.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:0.6rem;cursor:pointer}
.logo img{height:42px;width:auto;object-fit:contain}
.logo-name{font-family:var(--serif);font-size:1.4rem;font-weight:600;
  letter-spacing:0.14em;color:var(--ink);text-transform:uppercase}
nav{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.nl{font-family:var(--body);font-size:0.9rem;color:var(--muted);cursor:pointer;
  border:none;background:none;transition:color .2s;padding:0.2rem 0;
  border-bottom:1.5px solid transparent}
.nl:hover,.nl.on{color:var(--ink);border-bottom-color:var(--gold)}
.lang-tog{display:flex;border:1px solid var(--border);border-radius:2px;overflow:hidden}
.lang-btn{font-family:var(--body);font-size:0.76rem;padding:0.28rem 0.55rem;
  background:transparent;color:var(--muted);border:none;cursor:pointer;transition:background .15s,color .15s}
.lang-btn.on{background:var(--navy);color:#fff}
.btn-pri{font-family:var(--body);font-size:0.86rem;letter-spacing:0.05em;
  padding:0.48rem 1.1rem;color:#fff;border:none;cursor:pointer;border-radius:2px;transition:background .2s}
.btn-navy{background:var(--navy)}.btn-navy:hover{background:var(--gold)}
.btn-gold-c{background:var(--gold)}.btn-gold-c:hover{background:#9a7219}
.hero{min-height:78vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:4rem 2rem 3.5rem}
.hero-logo{width:min(320px,68vw);height:auto;margin-bottom:1.5rem;
  filter:drop-shadow(0 4px 16px rgba(27,58,107,0.12))}
.hero-slogan{font-family:var(--serif);font-size:clamp(1rem,2.4vw,1.45rem);
  font-weight:400;font-style:italic;color:var(--navy);margin-bottom:1.4rem;letter-spacing:0.05em}
.hero-sub{font-family:var(--body);font-size:1.08rem;font-weight:300;
  color:var(--muted);max-width:420px;line-height:1.75;margin:0 auto 2.4rem}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-gold{font-family:var(--body);font-size:1rem;letter-spacing:0.06em;
  padding:0.75rem 2rem;background:var(--gold);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:background .2s,transform .15s}
.btn-gold:hover{background:#9a7219;transform:translateY(-1px)}
.btn-out{font-family:var(--body);font-size:1rem;letter-spacing:0.06em;
  padding:0.75rem 2rem;background:transparent;color:var(--ink);
  border:1.5px solid var(--border);cursor:pointer;border-radius:2px;
  transition:border-color .2s,color .2s,transform .15s}
.btn-out:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.btn-navy-fill{font-family:var(--body);font-size:1rem;letter-spacing:0.06em;
  padding:0.75rem 2rem;background:var(--navy);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:background .2s,transform .15s}
.btn-navy-fill:hover{background:var(--gold);transform:translateY(-1px)}
.stats{display:flex;gap:2.5rem;justify-content:center;padding:2.2rem 0;
  flex-wrap:wrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  margin-bottom:3rem}
.stat-n{font-family:var(--serif);font-size:2.2rem;font-weight:300;color:var(--navy);display:block}
.stat-l{font-family:var(--body);font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold)}
.sec{padding:3.5rem 2.5rem;max-width:1240px;margin:0 auto}
.sec-lbl{font-family:var(--body);font-size:0.68rem;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem}
.sec-h{font-family:var(--serif);font-size:2rem;font-weight:400;color:var(--ink);
  margin-bottom:2.2rem;border-bottom:1px solid var(--border);padding-bottom:0.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.4rem}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;
  padding:1.4rem;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px var(--shadow)}
.card-founder{border:2px solid var(--gold)}
.founder-ribbon{position:absolute;top:-1px;right:-1px;background:var(--gold);color:var(--bg3);
  font-family:var(--body);font-size:0.6rem;letter-spacing:0.08em;padding:3px 10px;
  border-radius:0 11px 0 8px}
.c-num{font-family:var(--serif);font-size:0.7rem;letter-spacing:0.14em;color:var(--gold);
  margin-bottom:0.5rem}
.card-cover{width:100%;height:140px;object-fit:cover;border-radius:2px;
  margin-bottom:0.8rem;border:1px solid var(--border)}
.c-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem}
.c-orig{font-family:var(--body);font-size:0.74rem;color:var(--muted)}
.c-name{font-family:var(--serif);font-size:1.35rem;font-weight:500;color:var(--ink);
  margin-bottom:0.3rem;line-height:1.2}
.c-year{font-family:var(--body);font-size:0.78rem;color:var(--gold);margin-bottom:0.8rem}
.c-prev{font-family:var(--body);font-size:0.96rem;line-height:1.62;color:var(--muted);flex:1;font-style:italic}
.c-foot{margin-top:1.1rem;padding-top:0.75rem;border-top:1px solid var(--border)}
.tags{display:flex;gap:0.38rem;flex-wrap:wrap}
.tag{font-size:0.64rem;letter-spacing:0.08em;text-transform:lowercase;
  background:var(--bg);border:1px solid var(--border);color:var(--muted);

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Get logos from pre-rendered img tags (avoids Babel parsing huge strings)
const LOGO_SMALL = document.getElementById('logo-small').src;
const LOGO_FIG   = document.getElementById('logo-fig').src;
const LOGO_FIG_NEG = document.getElementById('logo-fig-neg').src;

const LANGS_UI = [
  {code:"ES",label:"Español"},{code:"EN",label:"English"},{code:"FR",label:"Français"},
  {code:"DE",label:"Deutsch"},{code:"IT",label:"Italiano"},{code:"PT",label:"Português"},
  {code:"ZH",label:"中文"},{code:"AR",label:"العربية"},{code:"JA",label:"日本語"},
  {code:"RU",label:"Русский"},{code:"HI",label:"हिन्दी"},{code:"GL",label:"Galego"},{code:"CA",label:"Català"},
];

// ---- Autenticación simulada (Fase A, sin coste) ----------------------------
// Todo esto vive en localStorage, en el propio navegador. No es seguridad real:
// es una simulación de la forma y la lógica de las pantallas, lista para
// sustituirse por Supabase Auth en la Fase B (ver LOCUS_MUNDI_HOJA_DE_RUTA.md,
// Fase B, punto 4, y LOCUS_MUNDI_ESCRIBE_TU_HISTORIA_v2_1.md, sección 1).
const AUTH_KEY = "lm_authors";
const SESSION_KEY = "lm_session";
const loadAuthors = () => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; } catch (e) { return {}; } };
const saveAuthors = (authors) => localStorage.setItem(AUTH_KEY, JSON.stringify(authors));
const getSession = () => localStorage.getItem(SESSION_KEY) || null;
const setSession = (email) => email ? localStorage.setItem(SESSION_KEY, email) : localStorage.removeItem(SESSION_KEY);
const bookKey = (email) => "lm_book_" + email.toLowerCase().trim();
const loadBook = (email) => { try { return JSON.parse(localStorage.getItem(bookKey(email))); } catch (e) { return null; } };
const saveBook = (email, book) => localStorage.setItem(bookKey(email), JSON.stringify(book));
const AUTHOR_SEQ_KEY = "lm_author_seq";
const assignAuthorNumber = () => {
  const n = (parseInt(localStorage.getItem(AUTHOR_SEQ_KEY)) || 0) + 1;
  localStorage.setItem(AUTHOR_SEQ_KEY, String(n));
  return n;
};

const SECQ = {
  ES: ["¿Nombre de tu primera mascota?","¿Ciudad donde naciste?","¿Nombre de tu mejor amigo/a de la infancia?","¿Cuál fue tu primer trabajo?"],

suarios información sobre estos servicios, así como acceso a las historias publicadas por otros autores."}, {"t": "h2", "x": "3. PRIVACIDAD Y TRATAMIENTO DE DATOS"}, {"t": "p", "x": "Cuando para el acceso a determinados contenidos o servicios sea necesario facilitar datos de carácter personal, los usuarios garantizarán su veracidad, exactitud, autenticidad y vigencia. El RESPONSABLE dará a dichos datos el tratamiento que corresponda en función de su naturaleza o finalidad, en los términos indicados en la Política de Privacidad."}, {"t": "h2", "x": "4. PROPIEDAD INDUSTRIAL E INTELECTUAL"}, {"t": "p", "x": "El diseño, la marca «Locus Mundi», el logotipo, los textos propios del sitio, el software y la estructura de la plataforma están protegidos por derechos de propiedad intelectual e industrial del RESPONSABLE. Su reproducción, distribución o uso no autorizado sin consentimiento expreso está prohibida."}, {"t": "p", "x": "Las historias, textos y fotografías publicados por cada Autor siguen siendo propiedad de su Autor. Locus Mundi no reclama titularidad sobre el contenido autobiográfico publicado por los usuarios; su relación con dicho contenido y las condiciones específicas de publicación, conservación y borrado se rigen por las Condiciones de Publicación para Autores, documento independiente que todo Autor acepta expresamente al publicar."}, {"t": "h2", "x": "5. OBLIGACIONES Y RESPONSABILIDADES DEL USUARIO"}, {"t": "p", "x": "El usuario se compromete a:"}, {"t": "ul", "x": ["Hacer un uso adecuado y lícito del sitio web y de sus contenidos.", "No utilizar el sitio web con fines fraudulentos, ilícitos o lesivos para los derechos de terceros.", "No introducir ni difundir virus informáticos u otros sistemas susceptibles de provocar daños en el sitio web o en sus usuarios.", "No publicar, en caso de ser Autor, información privada de terceros sin su consentimiento, ni cualquier información o imagen de menores de edad sin el consentimiento de quien ejerza su patria potestad o tutela. Requiere especial cautela la publicación de categorías especiales de datos (salud, origen étnico, orientación sexual, creencias religiosas u otra información sensible conforme al art. 9 del RGPD), que en ningún caso debe publicarse sin el consentimiento explícito de la persona afectada."]}, {"t": "p", "x": "El RESPONSABLE no será responsable de las actuaciones realizadas por los usuarios que incumplan estas condiciones."}, {"t": "h2", "x": "6. RESPONSABILIDADES"}, {"t": "p", "x": "El RESPONSABLE no garantiza el acceso ininterrumpido al sitio web, ni la ausencia de errores. Asimismo, no se hace responsable de los daños derivados del uso indebido del sitio web o de fallos técnicos en la red."}, {"t": "p", "x": "El RESPONSABLE se reserva el derecho de modificar o suspender temporalmente el acceso al sitio web sin previo aviso, por motivos de mantenimiento, seguridad o mejoras en los servicios. Esta reserva no afecta a la permanencia de las historias ya publicadas, cuya conservación se rige por las Condiciones de Publicación para Autores."}, {"t": "h2", "x": "7. ENLACES A TERCEROS"}, {"t": "p", "x": "El sitio web puede incluir enlaces a páginas web de terceros. El RESPONSABLE no se hace responsable del contenido, políticas de privacidad o prácticas de estos sitios externos."}, {"t": "h2", "x": "8. PROTECCIÓN DE DATOS"}, {"t": "p", "x": "El tratamiento de datos personales se rige por la normativa vigente en materia de protección de datos. Para más información, consulte la Política de Privacidad."}, {"t": "h2", "x": "9. COOKIES"}, {"t": "p", "x": "Este sitio web utiliza cookies para su correcto funcionamiento. Para más información, consulte la Política de Cookies."}, {"t": "h2", "x": "10. LEGISLACIÓN Y JURISDICCIÓN APLICABLE"}, {"t": "p", "x": "Las presentes condiciones se regirán por la legislación española. Cualquier controversia se someterá a los Juzgados y Tribunales del domicilio del RESPONSABLE, sin perjuicio de los derechos que asistan al consumidor conforme a la normativa de protección de consumidores y usuarios, en su caso."}, {"t": "p", "x": "En caso de que alguna de las disposiciones de este aviso legal sea declarada nula o inaplicable, las demás disposiciones permanecerán en vigor."}]}, "privacidad": {"title": "Política de Privacidad", "blocks": [{"t": "meta", "x": "Última actualización: 3 de agosto de 2026"}, {"t": "h2", "x": "INFORMACIÓN AL USUARIO"}, {"t": "p", "x": "Javier Batlle Vilaseca, como Responsable del Tratamiento, informa que, según lo dispuesto en el Reglamento (UE) 2016/679, de 27 de abril (RGPD), y en la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos y Garantía de los Derechos Digitales (LOPDGDD), tratará sus datos tal y como se refleja en la presente Política de Privacidad."}, {"t": "p", "x": "Esta Política se aplica al tratamiento de datos personales recogidos por Javier Batlle Vilaseca a través de la plataforma Locus Mundi."}, {"t": "h2", "x": "CONTACTO"}, {"t": "ul", "x": ["Titular: Javier Batlle Vilaseca", "NIF: 46117172X", "Correo electrónico: contactlocusmundi@gmail.com", "Domicilio a efectos de notificación: C/ dels Safareigs 7, 08003 Barcelona"]}, {"t": "h2", "x": "PRINCIPIOS APLICADOS AL TRATAMIENTO DE DATOS"}, {"t": "ul", "x": ["Legalidad: solo recopilamos datos personales para fines específicos, explícitos y legítimos.", "Minimización de datos: limitamos la recogida a lo estrictamente necesario para prestar el servicio.", "Limitación de la finalidad: solo tratamos los datos para los fines declarados.", "Precisión: mantenemos los datos exactos y actualizados.", "Seguridad: aplicamos medidas técnicas y organizativas razonables para proteger los datos.", "Acceso y rectificación: el usuario puede acceder o rectificar sus datos en cualquier momento.", "Conservación: los datos se conservan solo mientras sea necesario para los fines para los que se recogieron, salvo las historias autobiográficas publicadas, cuya conservación permanente se rige por las Condiciones de Publicación para Autores.", "Transferencias internacionales: ver apartado específico más abajo."]}, {"t": "h2", "x": "QUÉ DATOS RECOGEMOS"}, {"t": "ul", "x": ["Datos identificativos: nombre, correo electrónico, país, y los datos que el Autor decida incluir voluntariamente en su historia (fecha de nacimiento, lugar de origen, etc.).", "Contenido autobiográfico: el texto, título, subtítulo y fotografías que el Autor decide publicar.", "Datos de navegación: los descritos en la Política de Cookies.", "Datos de pago: gestionados directamente por la pasarela de pago (Stripe), sin que Locus Mundi almacene datos de tarjetas."]}, {"t": "h2", "x": "CON QUÉ FINALIDAD TRATAMOS SUS DATOS"}, {"t": "ul", "x": ["Permitir la creación, publicación y conservación de historias autobiográficas en la plataforma.", "Prestar el servicio de asistencia editorial mediante inteligencia artificial, cuando el usuario active esta función.", "Gestionar el contacto y responder a solicitudes.", "Gestionar los pagos correspondientes a las opciones de pago de la plataforma."]}, {"t": "p", "x": "No utilizamos sus datos para elaborar perfiles ni para fines publicitarios no solicitados."}, {"t": "h2", "x": "TRANSFERENCIAS INTERNACIONALES Y TERCEROS"}, {"t": "p", "x": "Para prestar el servicio, Locus Mundi puede compartir datos con los siguientes encargados del tratamiento:"}, {"t": "ul", "x": ["Vercel Inc. (alojamiento web de la plataforma)", "Supabase (base de datos)", "Anthropic PBC (proveedor de la inteligencia artificial que presta el servicio de asistencia editorial, cuando el Autor activa esta función). Este proveedor tiene su sede en Estados Unidos, por lo que el texto enviado a la IA supone una transferencia internacional de datos. Locus Mundi solo envía a este servicio el texto que el Autor decide someter voluntariamente a revisión o mejora editorial, nunca de forma automática ni sin acción expresa del usuario.", "Stripe (procesador de pagos)"]}, {"t": "p", "x": "No se realizan cesiones de datos a terceros distintas de las aquí descritas, salvo obligación legal."}, {"t": "h2", "x": "LEGITIMACIÓN DEL TRATAMIENTO"}, {"t": "ul", "x": ["Consentimiento del usuario, que puede retirarse en cualquier momento.", "Ejecución de una relación contractual (prestación del servicio de publicación).", "Cumplimiento de una obligación legal."]}, {"t": "h2", "x": "SUS DERECHOS"}, {"t": "p", "x": "Puede ejercer los siguientes derechos en relación con el tratamiento de sus datos personales:"}, {"t": "ul", "x": ["Acceso: obtener confirmación sobre si tratamos sus datos y acceder a ellos.", "Rectificación: corregir datos inexactos o incompletos.", "Supresión: solicitar la eliminación de sus datos cuando ya no sean necesarios para los fines recogidos. *(Para las historias publicadas por Autores, este derecho se ejerce conforme a lo dispuesto en las Condiciones de Publicación para Autores, dado el carácter permanente de la publicación aceptado expresamente al publicar.)*", "Limitación del tratamiento.", "Portabilidad: recibir sus datos en un formato estructurado.", "Oposición."]}, {"t": "p", "x": "Puede ejercer estos derechos escribiendo a contactlocusmundi@gmail.com. También tiene derecho a presentar una reclamación ante la Agencia Española de Protección de Datos (www.aepd.es) si considera que el tratamiento no se ajusta a la normativa vigente."}, {"t": "h2", "x": "MENORES DE EDAD"}, {"t": "p", "x": "Locus Mundi no está dirigido a menores de 14 años. Si un Autor incluye en su historia información o imágenes de menores de edad (por ejemplo, familiares), es responsabilidad del Autor contar con el consentimiento necesario para ello, conforme a lo dispuesto en las Condiciones de Publicación para Autores."}, {"t": "h2", "x": "INFORMACIÓN LEGAL"}, {"t": "p", "x": "Los requisitos de esta Política complementan y no reemplazan cualquier otro requisito existente bajo la legislación de protección de datos aplicable. Esta Política puede ser revisada periódicamente; cualquier cambio relevante se notificará a través del sitio web."}]}, "cookies": {"title": "Política de Cookies", "blocks": [{"t": "meta", "x": "Última actualización: 3 de agosto de 2026"}, {"t": "h2", "x": "DEFINICIÓN DE COOKIE"}, {"t": "p", "x": "Una «cookie» es un pequeño fragmento de texto que los sitios web envían al navegador y que se almacena en el terminal del usuario (ordenador o dispositivo móvil). Permite almacenar y recuperar información sobre la navegación del usuario con el objetivo de mejorar su experiencia en el sitio web."}, {"t": "h2", "x": "COOKIES QUE UTILIZA ACTUALMENTE LOCUS MUNDI"}, {"t": "p", "x": "En este momento, Locus Mundi utiliza únicamente cookies propias de carácter técnico, estrictamente necesarias para el funcionamiento del sitio web (por ejemplo, para recordar que ha aceptado este aviso de cookies). Estas cookies no requieren consentimiento previo conforme a la normativa vigente, al ser imprescindibles para la prestación del servicio."}, {"t": "p", "x": "Locus Mundi no utiliza cookies de terceros con fines publicitarios ni de seguimiento comercial. Si en el futuro se incorpora alguna herramienta de análisis de terceros (por ejemplo, Google Analytics), esta Política se actualizará antes de su activación y se solicitará el consentimiento correspondiente al usuario, tal como exige la normativa."}, {"t": "p", "x": "Estadísticas internas de la plataforma: Locus Mundi podrá mostrar información agregada de interés general, como el número de historias publicadas o su distribución geográfica (por ejemplo, en forma de mapa). Cuando esta información se obtiene mediante contadores agregados y anónimos gestionados directamente en el servidor de Locus Mundi —sin compartirse con terceros ni utilizarse para elaborar perfiles individuales—, puede acogerse a la excepción de informar sin necesidad de solicitar consentimiento previo, conforme a la guía de cookies de la Agencia Española de Protección de Datos (AEPD). Si en algún momento este tipo de estadística se implementa mediante cookies propias con esta finalidad exclusivamente interna, se informará de ello en esta Política."}, {"t": "h2", "x": "CONSENTIMIENTO Y GESTIÓN DE COOKIES"}, {"t": "p", "x": "Al navegar y continuar en el sitio web, el usuario acepta el uso de las cookies técnicas descritas en esta Política."}, {"t": "p", "x": "El usuario puede eliminar las cookies almacenadas en su dispositivo en cualquier momento a través de la configuración de su navegador. Puede consultar cómo hacerlo en los siguientes enlaces:"}, {"t": "ul", "x": ["Chrome: https://support.google.com/chrome/answer/95647?hl=es", "Firefox: https://support.mozilla.org/es/kb/clear-cookies-and-site-data-firefox", "Safari (Mac): https://support.apple.com/es-es/guide/safari/manage-cookies-and-website-data-sfri11471/mac", "Safari (iPhone/iPad): https://support.apple.com/es-es/HT201265", "Edge: https://support.microsoft.com/es-es/help/4468242/microsoft-edge-browsing-data-and-privacy-microsoft-privacy"]}, {"t": "h2", "x": "ACTUALIZACIÓN DE ESTA POLÍTICA"}, {"t": "p", "x": "Javier Batlle Vilaseca se reserva el derecho de modificar esta Política de Cookies para adaptarla a novedades legislativas o a cambios en el funcionamiento del sitio web. Se recomienda revisarla periódicamente."}, {"t": "h2", "x": "CONTACTO"}, {"t": "p", "x": "contactlocusmundi@gmail.com"}]}, "condiciones": {"title": "Condiciones de Publicación para Autores", "blocks": [{"t": "meta", "x": "Última actualización: 3 de agosto de 2026"}, {"t": "p", "x": "Este documento se aplica específicamente a quienes publican una historia autobiográfica en Locus Mundi (en adelante, el «Autor»), y complementa —sin sustituir— el Aviso Legal y la Política de Privacidad generales del sitio. Al abrir un nuevo archivo en la sección \"Escribe tu historia\", el Autor deberá aceptar expresamente estas condiciones antes de poder redactar o publicar contenido, mediante un paso explícito de aceptación (no basta con la navegación general por el sitio, a diferencia del aviso de cookies)."}, {"t": "h2", "x": "1. QUÉ ES LOCUS MUNDI"}, {"t": "p", "x": "Locus Mundi es, básicamente, una plataforma de generación, preservación y publicación de la memoria generacional a nivel global, abierta a las principales lenguas del mundo. A diferencia de una red social o un blog convencional, su propósito no es la publicación temporal o efímera, sino la preservación permanente de las historias familiares y personales que sus Autores decidan confiar a la plataforma."}, {"t": "h2", "x": "2. PERMANENCIA DE LAS HISTORIAS PUBLICADAS"}, {"t": "p", "x": "Toda historia publicada en Locus Mundi permanece publicada de forma permanente por defecto, siendo legible de forma gratuita por cualquier usuario del sitio web. Esta permanencia es un principio central de la plataforma, no una característica accesoria."}, {"t": "p", "x": "Solo el Autor puede contratar, como extra opcional, un archivo debidamente formateado para poder imprimir su autobiografía (DIN A4 o A5), conforme a las condiciones económicas vigentes. Esta posibilidad de impresión no altera en ningún caso la disponibilidad gratuita y permanente de la historia en el sitio web."}, {"t": "ul", "x": ["Solo el Autor, debidamente autenticado con su contraseña (y, en su caso, refuerzo mediante pregunta de seguridad), puede solicitar la eliminación de su propia historia.", "Ni los herederos del Autor ni Locus Mundi pueden eliminar una historia por defecto. Esta restricción se ampara en el artículo 96 de la Ley Orgánica 3/2018 (LOPDGDD), que reconoce el derecho de toda persona a dejar instrucciones expresas, en vida, sobre el destino de su contenido digital, restringiendo el acceso o las facultades que de otro modo corresponderían a sus herederos. Al publicar, el Autor deja constancia expresa de su voluntad de que su historia permanezca disponible de forma permanente salvo que él mismo decida lo contrario.", "Excepcionalmente, Locus Mundi podrá retirar contenido sin solicitud del Autor únicamente por causa legal grave y documentada (por ejemplo, contenido ilegal o resolución judicial firme que lo ordene)."]}, {"t": "h2", "x": "3. PROPIEDAD DEL CONTENIDO"}, {"t": "p", "x": "El Autor conserva en todo momento la propiedad intelectual de su historia, textos y fotografías. Al publicar, el Autor concede a Locus Mundi una licencia no exclusiva para alojar, mostrar y conservar dicho contenido en la plataforma, con la finalidad de cumplir el propósito de conservación descrito en este documento. Esta licencia no transfiere la propiedad del contenido a Locus Mundi."}, {"t": "h2", "x": "4. RESPONSABILIDAD SOBRE EL CONTENIDO Y TERCEROS MENCIONADOS"}, {"t": "p", "x": "El Autor es responsable del contenido que publica, y en particular se compromete a:"}, {"t": "ul", "x": ["No publicar información privada de terceros (incluidos familiares vivos) sin su consentimiento.", "Prestar especial atención cuando la historia mencione o incluya cualquier información o imagen de menores de edad, sea o no de naturaleza privada. El Autor declara contar con el consentimiento necesario de quien ejerza la patria potestad o tutela en esos casos.", "Extremar la cautela con las categorías especiales de datos (salud, origen étnico, orientación sexual, creencias religiosas u otra información sensible conforme al art. 9 del RGPD) de cualquier tercero mencionado, que en ningún caso deben publicarse sin el consentimiento explícito de la persona afectada.", "No publicar contenido difamatorio, ilegal o que vulnere derechos de terceros."]}, {"t": "p", "x": "Locus Mundi podrá revisar el contenido antes o después de su publicación para verificar el cumplimiento de estas condiciones, y podrá contactar al Autor si detecta un posible incumplimiento."}, {"t": "h2", "x": "5. CUENTA, AUTENTICACIÓN Y BORRADO"}, {"t": "ul", "x": ["El acceso para redactar, modificar o eliminar una historia se realiza mediante la contraseña personal del Autor, con refuerzo opcional de pregunta de seguridad.", "El Autor es responsable de custodiar sus credenciales de acceso. Locus Mundi dispondrá de un procedimiento de recuperación de acceso para casos de pérdida de contraseña, verificando razonablemente la identidad del solicitante.", "El borrado de una historia por parte del Autor es una acción irreversible."]}, {"t": "h2", "x": "6. NIVELES DE SERVICIO Y ASISTENCIA IA"}, {"t": "ul", "x": ["El Autor puede publicar de forma gratuita (nivel Base) o contratar extras opcionales de pago (fotos adicionales, archivo imprimible en PDF, Asistente Editorial). Las condiciones económicas específicas de cada extra se detallarán en el momento de su contratación.", "Si el Autor activa el Asistente Editorial (IA), acepta que el texto que someta voluntariamente a esa función se envíe a un proveedor externo de procesamiento de lenguaje (ver Política de Privacidad), únicamente con la finalidad de recibir sugerencias de mejora, estructura o corrección. El Autor mantiene en todo momento el control final sobre su texto."]}, {"t": "h2", "x": "7. LEGADO DIGITAL"}, {"t": "p", "x": "Locus Mundi reconoce que la naturaleza de este servicio implica pensar en el largo plazo. Mientras el Autor viva, es la única persona con capacidad de modificar o eliminar su historia. Tras su fallecimiento, la historia permanece publicada conforme al principio de permanencia descrito en el apartado 2, salvo que el propio Autor haya dejado instrucciones distintas por escrito y comunicadas a Locus Mundi con anterioridad."}, {"t": "h2", "x": "8. MODIFICACIÓN DE ESTAS CONDICIONES"}, {"t": "p", "x": "Locus Mundi podrá actualizar estas condiciones para adaptarlas a cambios normativos o del propio servicio. Los cambios que afecten a la esencia del principio de permanencia (apartado 2) no se aplicarán retroactivamente a las historias ya publicadas sin el consentimiento expreso del Autor afectado."}, {"t": "h2", "x": "CONTACTO"}, {"t": "p", "x": "contactlocusmundi@gmail.com"}]}};
const LEGAL_EN = {"aviso":{"title":"Legal Notice","blocks":[{"t":"meta","x":"Last updated: August 3, 2026"},{"t":"h2","x":"INFORMATION SOCIETY SERVICES ACT (LSSI)"},{"t":"p","x":"Javier Batlle Vilaseca, with Tax ID (NIF) 46117172X and contact email contactlocusmundi@gmail.com, hereinafter «the CONTROLLER», makes this document available to users in order to comply with the obligations set out in Spanish Law 34/2002, of July 11, on Information Society Services and Electronic Commerce (LSSICE), and to inform all website users of the applicable terms of use."},{"t":"p","x":"Any person who accesses this website assumes the role of User, and undertakes to observe and strictly comply with the provisions set out herein, as well as any other applicable legal provision."},{"t":"p","x":"The CONTROLLER reserves the right to modify any information that may appear on the website, without any obligation to give prior notice or otherwise inform users of such modifications, publication on the website being deemed sufficient."},{"t":"h2","x":"1. IDENTIFYING INFORMATION"},{"t":"ul","x":["Owner: Javier Batlle Vilaseca","Tax ID (NIF): 46117172X","Email: contactlocusmundi@gmail.com","Address for notification purposes: C/ dels Safareigs 7, 08003 Barcelona, Spain"]},{"t":"h2","x":"2. PURPOSE"},{"t":"p","x":"Locus Mundi is, essentially, a platform for generating, preserving and publishing generational memory on a global scale, open to the world's major languages. It allows anyone to write, publish and permanently preserve their own autobiography or that of a family member, with the option of adding photographs and AI-assisted editorial support. Through this website, users are offered information about these services, as well as access to the stories published by other authors."},{"t":"h2","x":"3. PRIVACY AND DATA PROCESSING"},{"t":"p","x":"When access to certain content or services requires providing personal data, users guarantee that such data is truthful, accurate, authentic and up to da nterrupted access to the website, nor the absence of errors. Likewise, it is not liable for damages arising from improper use of the website or from technical failures on the network."},{"t":"p","x":"The CONTROLLER reserves the right to modify or temporarily suspend access to the website without prior notice, for reasons of maintenance, security or service improvements. This reservation does not affect the permanence of stories already published, whose preservation is governed by the Publication Terms for Authors."},{"t":"h2","x":"7. THIRD-PARTY LINKS"},{"t":"p","x":"The website may include links to third-party websites. The CONTROLLER is not responsible for the content, privacy policies or practices of these external sites."},{"t":"h2","x":"8. DATA PROTECTION"},{"t":"p","x":"The processing of personal data is governed by current data protection regulations. For more information, please see the Privacy Policy."},{"t":"h2","x":"9. COOKIES"},{"t":"p","x":"This website uses cookies to function correctly. For more information, please see the Cookie Policy."},{"t":"h2","x":"10. APPLICABLE LAW AND JURISDICTION"},{"t":"p","x":"These terms are governed by Spanish law. Any dispute will be submitted to the Courts and Tribunals of the CONTROLLER's domicile, without prejudice to any rights the consumer may have under applicable consumer protection regulations, where relevant."},{"t":"p","x":"Should any provision of this legal notice be declared null or unenforceable, the remaining provisions will remain in force."}]},"privacidad":{"title":"Privacy Policy","blocks":[{"t":"meta","x":"Last updated: August 3, 2026"},{"t":"h2","x":"INFORMATION FOR THE USER"},{"t":"p","x":"Javier Batlle Vilaseca, as Data Controller, informs users that, pursuant to Regulation (EU) 2016/679, of April 27 (GDPR), and Spanish Organic Law 3/2018, of December 5, on Data Protection and Guarantee of Digital Rights (LOPDGDD), their data will be processed as set out in this Privacy Policy."},{"t":"p","x":"This Policy applies to the processing of personal data collected by Javier Batlle Vilaseca through the Locus Mundi platform."},{"t":"h2","x":"CONTACT"},{"t":"ul","x":["Owner: Javier Batlle Vilaseca","Tax ID (NIF): 46117172X","Email: contactlocusmundi@gmail.com","Address for notification purposes: C/ dels Safareigs 7, 08003 Barcelona, Spain"]},{"t":"h2","x":"PRINCIPLES APPLIED TO DATA PROCESSING"},{"t":"ul","x":["Lawfulness: we only collect personal data for specific, explicit and legitimate purposes.","Data minimization: we limit collection to what is strictly necessary to provide the service.","Purpose limitation: we only process data for the stated purposes.","Accuracy: we keep data accurate and up to date.","Security: we apply reasonable technical and organizational measures to protect data.","Access and rectification: the user may access or rectify their data at any time.","Retention: data is kept only for as long as necessary for the purposes for which it was collected, except for published autobiographical stories, whose permanent preservation is governed by the Publication Terms for Authors.","International transfers: see the specific section below."]},{"t":"h2","x":"WHAT DATA WE COLLECT"},{"t":"ul","x":["Identifying data: name, email address, country, and any data the Author voluntarily chooses to include in their story (date of birth, place of origin, etc.).","Autobiographical content: the text, title, subtitle and photographs the Author chooses to publish.","Browsing data: as described in the Cookie Policy.","Payment data: handled directly by the payment gateway (Stripe); Locus Mundi does not store card data."]},{"t":"h2","x":"WHAT WE USE YOUR DATA FOR"},{"t":"ul","x":["Enabling the creation, publication and preservation of autobiographical stories on the platform.","Providing the AI-assisted editorial support service, when the user activates this feature.","Managing contact requests and responding to inquiries.","Managing payments corresponding to the platform's paid options."]},{"t":"p","x":"We do not use your data to build profiles or for unsolicited advertising purposes."},{"t":"h2","x":"INTERNATIONAL TRANSFERS AND THIRD PARTIES"},{"t":"p","x":"To provide the service, Locus Mundi may share data with the following data processors:"},{"t":"ul","x":["Vercel Inc. (web hosting for the platform)","Supabase (database)","Anthropic PBC (provider of the artificial intelligence powering the editorial assistance service, when the Author activates this feature). This provider is based in the United States, so text sent to the AI involves an international data transfer. Locus Mundi only sends this service the text that the Author voluntarily chooses to submit for editorial review or improvement, never automatically or without the user's explicit action.","Stripe (payment processor)"]},{"t":"p","x":"No data is shared with third parties other than those described here, except where legally required."},{"t":"h2","x":"LEGAL BASIS FOR PROCESSING"},{"t":"ul","x":["User consent, which may be withdrawn at any time.","Performance of a contractual relationship (provision of the publishing service).","Compliance with a legal obligation."]},{"t":"h2","x":"YOUR RIGHTS"},{"t":"p","x":"You may exercise the following rights in relation to the processing of your personal data:"},{"t":"ul","x":["Access: obtain confirmation as to whether we process your data, and access it.","Rectification: correct inaccurate or incomplete data.","Erasure: request deletion of your data when it is no longer necessary for the purposes it was collected for. *(For stories published by Authors, this right is exercised in accordance with the Publication Terms for Authors, given the permanent nature of publication expressly accepted upon publishing.)*","Restriction of processing.","Portability: receive your data in a structured format.","Objection."]},{"t":"p","x":"You may exercise these rights by writing to contactlocusmundi@gmail.com. You also have the right to file a complaint with the Spanish Data Protection Agency (www.aepd.es) if you believe the processing does not comply with applicable regulations."},{"t":"h2","x":"MINORS"},{"t":"p","x":"Locus Mundi is not directed at minors under 14 years of age. If an Author includes information or images of minors in their story (for example, family members), it is the Author's responsibility to have obtained the necessary consent to do so, in accordance with the Publication Terms for Authors."},{"t":"h2","x":"LEGAL INFORMATION"},{"t":"p","x":"The requirements of this Policy complement, and do not replace, any other requirement under applicable data protection law. This Policy may be reviewed periodically; any relevant change will be notified through the website."}]},"cookies":{"title":"Cookie Policy","blocks":[{"t":"meta","x":"Last updated: August 3, 2026"},{"t":"h2","x":"WHAT IS A COOKIE"},{"t":"p","x":"A «cookie» is a small piece of text that websites send to the browser and that is stored on the user's device (computer or mobile device). It allows information about the user's browsing to be stored and retrieved in order to improve their experience on the website."},{"t":"h2","x":"COOKIES CURRENTLY USED BY LOCUS MUNDI"},{"t":"p","x":"At this time, Locus Mundi uses only its own strictly technical cookies, necessary for the website to function (for example, to remember that you have accepted this cookie notice). These cookies do not require prior consent under applicable regulations, as they are essential to providing the service."},{"t":"p","x":"Locus Mundi does not use third-party cookies for advertising or commercial tracking purposes. If a third-party analytics tool (for example, Google Analytics) is added in the future, this Policy will be updated before it is activated, and the user's corresponding consent will be requested, as required by law."},{"t":"p","x":"Internal platform statistics: Locus Mundi may display aggregated information of general interest, such as the number of stories published or their geographic distribution (for example, in map form). When this information is obtained through anonymous, aggregated counters managed directly on Locus Mundi's own server — without being shared with third parties or used to build individual profiles — it may fall under the exception that allows informing users without requiring prior consent, in accordance with the cookie guidance issued by the Spanish Data Protection Agency (AEPD). If this type of statistic is ever implemented through the platform's own cookies for this exclusively internal purpose, it will be disclosed in this Policy."},{"t":"h2","x":"CONSENT AND COOKIE MANAGEMENT"},{"t":"p","x":"By browsing and continuing to use the website, the user accepts the use of the technical cookies described in this Policy."},{"t":"p","x":"Users may delete cookies stored on their device at any time through their browser settings. You can find out how to do so at the following links:"},{"t":"ul","x":["Chrome: https://support.google.com/chrome/answer/95647","Firefox: https://support.mozilla.org/kb/clear-cookies-and-site-data-firefox","Safari (Mac): https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac","Safari (iPhone/iPad): https://support.apple.com/HT201265","Edge: https://support.microsoft.com/help/4468242/microsoft-edge-browsing-data-and-privacy-microsoft-privacy"]},{"t":"h2","x":"UPDATES TO THIS POLICY"},{"t":"p","x":"Javier Batlle Vilaseca reserves the right to modify this Cookie Policy to adapt it to legislative developments or changes in how the website operates. Users are advised to review it periodically."},{"t":"h2","x":"CONTACT"},{"t":"p","x":"contactlocusmundi@gmail.com"}]},"condiciones":{"title":"Publication Terms for Authors","blocks":[{"t":"meta","x":"Last updated: August 3, 2026"},{"t":"p","x":"This document applies specifically to those who publish an autobiographical story on Locus Mundi (hereinafter, the «Author»), and complements — without replacing — the site's general Legal Notice and Privacy Policy. When opening a new file in the \"Write your story\" section, the Author must expressly accept these terms before being able to draft or publish content, through an explicit acceptance step (general browsing of the site is not sufficient, unlike the cookie notice)."},{"t":"h2","x":"1. WHAT LOCUS MUNDI IS"},{"t":"p","x":"Locus Mundi is, essentially, a platform for generating, preserving and publishing generational memory on a global scale, open to the world's major languages. Unlike a social network or a conventional blog, its purpose is not temporary or ephemeral publication, but the permanent preservation of the family and personal stories that its Authors choose to entrust to the platform."},{"t":"h2","x":"2. PERMANENCE OF PUBLISHED STORIES"},{"t":"p","x":"Every story published on Locus Mundi remains published permanently by default, and can be read free of charge by any website user. This permanence is a core principle of the platform, not an incidental feature."},{"t":"p","x":"Only the Author may contract, as an optional extra, a properly formatted file for printing their autobiography (DIN A4 or A5), subject to the pricing terms in effect. This printing option does not in any way alter the free, permanent availability of the story on the website."},{"t":"ul","x":["Only the Author, duly authenticated with their password (and, where applicable, reinforced by a security question), may request the deletion of their own story.","Neither the Author's heirs nor Locus Mundi may delete a story by default. This restriction is grounded in Article 96 of Organic Law 3/2018 (LOPDGDD), which recognizes every person's right to leave express instructions, during their lifetime, regarding the fate of their digital content, restricting the access or powers that would otherwise pass to their heirs. By publishing, the Author expressly records their wish that their story remain permanently available unless they themselves decide otherwise.","Exceptionally, Locus Mundi may remove content without the Author's request only for a serious and documented legal reason (for example, unlawful content or a final court order requiring it)."]},{"t":"h2","x":"3. OWNERSHIP OF CONTENT"},{"t":"p","x":"The Author retains the intellectual property rights to their story, texts and photographs at all times. By publishing, the Author grants Locus Mundi a non-exclusive license to host, display and preserve that content on the platform, for the purpose of fulfilling the preservation purpose described in this document. This license does not transfer ownership of the content to Locus Mundi."},{"t":"h2","x":"4. RESPONSIBILITY FOR CONTENT AND THIRD PARTIES MENTIONED"},{"t":"p","x":"The Author is responsible for the content they publish, and specifically agrees to:"},{"t":"ul","x":["Not publish private information about third parties (including living family members) without their consent.","Take special care when the story mentions or includes any information or images of minors, whether or not of a private nature. The Author declares that they hold the necessary consent from whoever holds parental authority or guardianship in such cases.","Exercise particular caution with special categories of data (health, ethnic origin, sexual orientation, religious beliefs or other sensitive information under Article 9 of the GDPR) concerning any third party mentioned, which must never be published without the explicit consent of the person concerned.","Not publish defamatory or unlawful content, or content that infringes the rights of third parties."]},{"t":"p","x":"Locus Mundi may review content before or after publication to verify compliance with these terms, and may contact the Author if it detects a possible breach."},{"t":"h2","x":"5. ACCOUNT, AUTHENTICATION AND DELETION"},{"t":"ul","x":["Access to write, edit or delete a story is done using the Author's personal password, with an optional security-question reinforcement.","The Author is responsible for safeguarding their access credentials. Locus Mundi will provide an access recovery procedure for cases of lost passwords, reasonably verifying the identity of the person requesting it.","Deletion of a story by the Author is an irreversible action."]},{"t":"h2","x":"6. SERVICE TIERS AND AI ASSISTANCE"},{"t":"ul","x":["The Author may publish free of charge (Base tier) or contract optional paid extras (additional photos, a printable PDF file, the Editorial Assistant). The specific pricing terms for each extra will be detailed at the time of purchase.","If the Author activates the Editorial Assistant (AI), they agree that any text they voluntarily submit to that feature will be sent to an external language-processing provider (see Privacy Policy), solely for the purpose of receiving suggestions for improvement, structure or correction. The Author retains final control over their text at all times."]},{"t":"h2","x":"7. DIGITAL LEGACY"},{"t":"p","x":"Locus Mundi recognizes that the nature of this service calls for a long-term perspective. While the Author is alive, they are the only person able to modify or delete their story. After their death, the story remains published in accordance with the permanence principle described in section 2, unless the Author has left different instructions in writing and communicated them to Locus Mundi beforehand."},{"t":"h2","x":"8. CHANGES TO THESE TERMS"},{"t":"p","x":"Locus Mundi may update these terms to adapt them to regulatory or service changes. Changes affecting the essence of the permanence principle (section 2) will not be applied retroactively to stories already published without the express consent of the affected Author."},{"t":"h2","x":"CONTACT"},{"t":"p","x":"contactlocusmundi@gmail.com"}]}};


const FAQ_ES = [{"q": "¿Qué es Locus Mundi?", "a": "Locus Mundi es una plataforma creada por y para todas aquellas personas que deseen escribir, publicar, preservar y compartir gratuitamente sus autobiografías e historias de vida, con el objeto de transmitir su testimonio a otros miembros de su generación o a las generaciones futuras."}, {"q": "¿Quién puede publicar su autobiografía?", "a": "Cualquier persona, sin importar su edad, nacionalidad o idioma. No hace falta ser escritor ni tener experiencia previa. Solo tener una vida que contar."}, {"q": "¿La publicación es gratuita?", "a": "Sí, siempre. La opción básica permite publicar texto ilimitado, una fotografía de portada y alojar la autobiografía en el archivo permanente de Locus Mundi. También existen servicios de pago solo para Autores, como añadir fotografías, solicitar la versión imprimible en PDF o contratar al asistente editorial de IA de la plataforma."}, {"q": "¿Qué tipo de historias pueden publicarse?", "a": "Locus Mundi publica exclusivamente autobiografías, memorias familiares e historias de vida reales. No es una plataforma de ficción, aunque cada Autor puede utilizar distintos recursos y géneros literarios para contar su historia. No están permitidos los textos o enunciados ofensivos, discriminatorios o manifiestamente falsos."}, {"q": "¿Puede traducir Locus Mundi mi autobiografía a otros idiomas?", "a": "Sí, empleando la IA, la plataforma podrá traducir tu historia a otros idiomas para que pueda ser leída por personas de otros países, sin sustituir nunca el texto original. Como lector, tú podrás traducir a tu lengua de preferencia cualquier biografía que desees leer."}, {"q": "¿Puedo publicar mi autobiografía aunque todavía no esté acabada?", "a": "Puedes publicarla capítulo a capítulo o cuando esté terminada, según prefieras. Además, podrás modificarla en todo momento. La vida es cambiante, afortunadamente, porque solo tenemos una. Razón por la cual Locus Mundi solo publica una obra por Autor."}, {"q": "¿Puedo modificar mi autobiografía después de publicarla?", "a": "Sí, siempre que quieras, usando tu contraseña de Autor. Solo tú puedes editarla o eliminarla."}, {"q": "¿Puedo añadir fotografías, vídeos o documentos?", "a": "Por ahora, Locus Mundi solo permite incluir fotografías editables. En el futuro está previsto poder añadir también vídeos u otros documentos."}, {"q": "¿Puedo imprimir mi autobiografía?", "a": "Solo los Autores podrán solicitar, como opción de pago, un archivo PDF imprimible para imprimir su obra en los formatos DIN A4 o DIN A5."}, {"q": "¿Cómo protege Locus Mundi mis datos personales?", "a": "Locus Mundi no vende ni comercia con tus datos, en cumplimiento del RGPD europeo. Solo recoge los datos necesarios para prestar sus servicios, y permite ejercer los derechos de acceso, rectificación, oposición o supresión conforme a la normativa. Más detalles en nuestra Política de Privacidad."}];
const FAQ_EN = [{"q": "What is Locus Mundi?", "a": "Locus Mundi is a platform created to write, publish and preserve autobiographies and life stories, with the purpose of keeping the memory of our generation alive and making it accessible to future generations."}, {"q": "Who can publish their autobiography?", "a": "Anyone, regardless of age, nationality or language. You don't need to be a writer or have previous experience. Just a life worth telling."}, {"q": "Is publishing free?", "a": "Yes, always. The Base level lets you publish unlimited text, one cover photo, and keep your autobiography in Locus Mundi's permanent archive. There are also optional paid extras, such as additional photos, a printable PDF file, or the AI editorial assistant."}, {"q": "What kind of stories can be published?", "a": "Locus Mundi publishes exclusively autobiographies, family memoirs and real life stories. It is not a fiction platform, although each Author may use different literary resources and genres to tell their story. Fragments containing offensive, discriminatory or clearly false content will be censored and removed."}, {"q": "Can Locus Mundi translate my autobiography into other languages?", "a": "Yes, using AI, the platform can translate your story into other languages so it can be read by people from other countries, without ever replacing the original text. As a reader, you can also translate any biography you wish to read into your preferred language."}, {"q": "Can I publish even if my autobiography isn't finished?", "a": "Yes. You can choose to publish it once you consider it complete, or publish it chapter by chapter, whichever you prefer. Keep in mind that only one autobiography can be published per Author."}, {"q": "Can I edit my autobiography after publishing it?", "a": "Yes, whenever you want, using your Author password. Only you can edit or delete it."}, {"q": "Can I add photos, videos or documents?", "a": "For now, Locus Mundi only allows editable photos. Adding videos or other documents is planned for the future."}, {"q": "Can I print my autobiography?", "a": "Only Authors can request, as a paid option, a printable PDF file to print their work in DIN A4 or DIN A5 format."}, {"q": "How does Locus Mundi protect my personal data?", "a": "Locus Mundi does not sell or trade your data, in compliance with European GDPR. It only collects the data necessary to provide the service, and allows you to exercise your rights of access, rectification, objection or erasure under the regulation. More details in our Privacy Policy."}];

const SAMPLE = [
  { id:1, name:"Irene Vilaseca Fructuoso", title:"Recuerdos de mi familia", born:1932, country:"España", flag:"🇪🇸", lang:"ES", profession:"ama de casa", founder:false,
    preview:"Hoy he dormido en Sant Feliu de Codines porque quería celebrar mis 70 años aquí...",
    text:"ÍNDICE:\nI: Unas cuantas bombas para romper el hielo\nII: Comienza la historia familiar\nIII: Joan Vilaseca y los diarios de la familia\nIV: Los Segalés, otra familia que viene de antiguo\nV: Mis abuelos\nVI: Hacia Santa Coloma\nVII: Recuerdos del tío José\nVIII: Continúa el avi el relato de su vida\nIX: La salud de mi padre y otras batallas\nX: La nueva familia se abre camino\nXI: Los últimos años\nXII: La familia de mi madre: los Fructuoso\napendice: ¿Y qué fue de la vida de Irene?\n\n— — —\n\nHoy he dormido en Sant Feliu de Codines porque quería celebrar mis 70 años aquí. En la mañana del 25 de octubre, mi aniversario, me he asomado al balcón de casa para disfrutar una vez más del espléndido paisaje que se aprecia desde esta altura. Hay un extenso valle por el que serpentea un riachuelo junto a una montaña basáltica a la que llamamos «la roca pelada». Se puede divisar abajo y tranquilo el pueblo de Riells del Fai. Y al otro lado del valle, frente a mí, hay una antigua masía llamada El Villar. No muy lejos de allí se encuentra una pequeña ermita en cuyo altar la Virgen amamanta al niño, por eso se la llama «La Virgen de la Leche».\n\nA esta roca había ido de niña muchas veces de excursión, y de mayor, con grupos de amigos, en noches de luna llena, íbamos a comer allí sandías. Este es el paisaje que me ha acompañado en los largos veranos de tres meses a lo largo de mi vida.\n\nMuchos recuerdos afloran en mi mente. Parece que fue ayer cuando un día, al volver del colegio, le dije a mi madre que estaba harta de hacer cada día lo mismo. Debía yo tener entonces unos 14 años. Mi madre me miró sonriente y me contestó, sin inmutarse, que la niñez también pasa y cuando fuera mayor y tuviera mi propia familia, me daría cuenta de la velocidad con la que pasan los años.\n\nSi la tuviese ahora delante, le diría cuánta razón tenía; que, sin darme cuenta, apenas un respiro, he llegado a este punto, algo que entonces me parecía inimaginable. Es tiempo pues de poner en claro los recuerdos y contaros mi historia. Bueno, nuestra historia: la historia de la familia.", fullUrl:"irene-vilaseca.html", tags:["Barcelona","historia familiar","memoria"] },
  { id:2, name:"Olegario Sotelo Blanco", title:"O neno pastor que venceu o lobo", born:1938, country:"España", flag:"🇪🇸", lang:"GL", profession:"editor", founder:true,
    preview:"Érguete, neno. Xa fun á fonte por un cántaro de auga...",
    text:"ÍNDICE:\ncap-I: Un pastor de Quintela\ncap-II: Primeiros traballos en Barcelona e o servizo militar\ncap-III: Regreso a Barcelona\ncap-IV: Unha afronta xudicial\ncap-V: Sotelo Blanco Edicións\ncap-VI: O cancro\ncap-VII: Escritos\ncap-VIII: Tempo de lecer e viaxar\ncap-IX: O Centro Galego de Barcelona\ncap-X: Outros emprendementos\ncap-XI: «Amigos, coñecidos e saudados»\ncap-XII: Diario de pandemia\ncap-XIII: Álbum de familia\ncap-XIV: Co país ao lombo\ncap-XV: Unha vida na maleta\n\n— — —\n\n–Érguete, neno. Xa fun á fonte por un cántaro de auga. Hoxe hai que lavarse porque vai ser o teu primeiro día de escola e a señorita mestra dixo que tiñas que ir ben limpo –dime a miña nai ben cedo un día de outono.\n\nA auga na cunca estaba fría, pero o aseo facíao só porque xa tiña cinco anos, así que me lavei ben rápido. Cun pantalón curto, a camisa de estrea que me fixera a costureira Jovita e unhas galochas novas que me mordían os dedos dos pés, corrín cara á cociña para almorzar.\n\nToño, que era un ano máis vello e xa ía á escola, explicoume que debía poñer na galocha dereita tres cravos na punta. Así, se algún rapaz se metía comigo, podía bourarlle na canela con esa galocha.\n\n–Por que teño que ir á escola? Non me sorprendeu ver a Jovita sentada á mesa. De cando en vez viña coa súa máquina de coser ao lombo e pasaba unsdías na casa remendando e facendo roupa para a familia. As teas xa as mercara a miña nai no comercio do Xosé María no Castro, que lle fiaba porque se coñecían dende nenos.\n\nJovita dicíame que os nenos debían de ir á escola para aprender moitas cousas e facer amigos. E faloume de rapaces que xa coñecía da misa. Lembrei cando ás noites, a carón do lume da lareira, os pais falaban dos veciños das cinco aldeas da parroquia: cantos fillos tiña cada matrimonio, se eran ricos ou pobres… E despois de facer os meus primeiros cálculos, malia non saber aritmética, decidín poñer catro cravos na miña galocha.\n\nA miña nai levoume ese primeiro día á escola e presentoume á señorita mestra, que só falaba castelán. Sentín moita estrañeza, porque eu unicamente coñecía a lingua dos meus pais. De que xeito podería aprender «moitas cousas» se non entendía o que falaban?", fullUrl:"olegario-sotelo.html", tags:["Galicia","emigración","memoria"] },
  { id:3, name:"Pablo Cava Domínguez", title:"Historia de mi vida", born:1944, country:"España", flag:"🇪🇸", lang:"ES", profession:"empresario", founder:true,
    preview:"Antes de empezar a contar mi vida, quiero decir algo con sinceridad...",
    text:"ÍNDICE:\nIntroducción: El porqué de estas páginas\nCapítulo 1: Nacimiento de Pablito\nCapítulo 2: Un pínfano llamado Pablo Cava Domínguez\nCapítulo 3: Mi padre Jacinto\nCapítulo 4: La familia de mi padre\nCapítulo 5: Navidades de 1951\nCapítulo 6: Segovia: 1954\nCapítulo 7: Años 1954–1955\nCapítulo 8: Hemos llegado a Murcia: 1955\nCapítulo 9: Manuel Cava, mi tutor: 1962\nCapítulo 10: Verano de 1964\nCapítulo 11: Años 1960–1962\nCapítulo 12: La muerte de mi madre\nCapítulo 13: Campeonato Nacional de Atletismo (1958)\nCapítulo 14: El destino (1959)\nCapítulo 15: Navidades de 1963\nCapítulo 16: Los señores Remigio (1963–1964)\nCapítulo 17: Visita a mi tía Rosa en Barcelona (1964)\nCapítulo 18: Alsasua, Navarra (1964)\nCapítulo 19: Amor a primera vista (Alsasua, 1964)\nCapítulo 20: Un encargo inesperado en Valladolid\nCapítulo 21: La mili (1965)\nCapítulo 22: Licenciado (el 15 de diciembre de 1967), pero…\nCapítulo 23: De Alcántara a Barcelona (1967)\nCapítulo 24: Visita a un compañero de colegio (1967)\nCapítulo 25: Tres trabajos, un pínfano y un currante nato (1969)\nCapítulo 26: Diseñando circuitos impresos y mi futuro\nCapítulo 27: Verano en Estartit\nCapítulo 28: El señor Pajarito y la caída de DIGIPLOT\nCapítulo 29: Juan Belmonte (1980)\nCapítulo 30: Historia de mi vida (Yako)\nCapítulo 31: Carta a Chencha\nCapítulo 32: Pharmispania y la piscina: últimos años de trabajo\nCapítulo 33: Ruta extremeña con mi hijo\nCapítulo 34: Pinfanada en Valladolid\nAnexos: Sobre DIGIPLOT y la herida invisible\nPostdata: Familia futbolera – Can Barça\n\n— — —\n\nAntes de empezar a contar mi vida, quiero decir algo con sinceridad: nunca he sido un hombre de leer muchos libros, y menos aún de escribirlos. Pero son tantas las cosas que quiero dejar por escrito, que sé que algunas quedarán pendientes para otra ocasión.\n\nHe decidido no hablar de vivencias relacionadas con mi mujer, Ramona –fallecida el 26 de febrero de 2024– ni con mis hijos. Ellos forman parte de mi intimidad y quiero respetar su privacidad. Lo que sí puedo asegurar es que todo lo que aquí cuento es real. Son sucesos que viví, que me marcaron y que han influido en mi forma de ser a lo largo de toda mi vida.\n\nEn 1943 se formalizó en España el Patronato de Huérfanos del Ejército. Se crearon centros de enseñanza para acoger a los hijos de militares fallecidos por cualquier circunstancia. Para las viudas o familiares que tenían a su cargo a esos niños, no suponía ningún gasto económico. Ese Patronato formó parte esencial de mi historia.\n\nEste libro va dedicado a mi madre, Francisca Domínguez Miranda, que no tuvo la suerte de disfrutar de la vida como cualquier cristiano merece. Fue una madre luchadora, que se sacrificó por sus hijos. Un derrame cerebral apagó la luz de su vida cuando por fin podía empezar a disfrutar de nosotros. Mamá: te quise mucho y te sigo queriendo. D.E.P.\n\nTambién va dedicado a mi padre, Jacinto Cava González. Se fue demasiado pronto. Yo, Pablito, tenía solo dieciocho meses y no pude conocerlo. Mi madre me habló mucho de él: que era muy bueno. A veces ser tan bueno no es bueno. Él se dejó llevar por esa bondad, aun estando delicado de salud. No le guardo rencor. Amaba su profesión y eso le hizo decir que sí cuando no debía. D.E.P.\n\nAntes de seguir, quiero presentar a mis padres con un recuerdo cariñoso.", fullUrl:"pablo-cava.html", tags:["Extremadura","traición","memoria"] },
  { id:4, name:"X. Batlle", title:"La vida escrita", born:1961, country:"España", flag:"🇪🇸", lang:"CA", profession:"filósofo", founder:false,
    preview:"Este no va a ser un relato escrito a lo largo, sino hacia el fondo de mí mismo...",
    text:"ÍNDICE:\nPresentación: De Barcelona al mundo\nÁlbum de familia: 1998\nEl nuevo mundo: 2001\nCelebración del medio siglo: 2011\nEl año de la pandemia: 2020\nRoda al món i torna al Born: 2025\nDespedida: La guinda del pastel\n\n— — —\n\nEste no va a ser un relato escrito a lo largo, sino hacia el fondo de mí mismo. Podría decirse que nací en una cuna dorada (un siglo en paz, una ciudad hermosa que bebe en las aguas del Mediterráneo, familia acomodada) y que nada me faltó, porque a mi cuerpo bien nutrido y mejor educado, mis padres y el resto de mi familia le añadieron ideas y sueños. Quizá demasiados sueños. Algo me faltó siempre.\n\nDos amigos de juventud me han acompañado toda la vida: Imanol Lizarralde, otro «espíritu contemplativo» desubicado y lletraferit como yo, y Toni Alastuey, un «hombre de acción» cuyo aprecio y fortaleza me permitieron conocer aquello que era incapaz de vislumbrar con mis propios ojos.\n\nEstudié Filosofía y mi formación me permitió trabajar en una editorial (Ronsel, fundada por Olegario Sotelo Blanco) durante quince años, publicando a Dickens, Saramago y también a autores noveles como Miguel Herráez, Miguel Catalán o Asdrúbal Hernández, que con el paso de los años se convirtieron en amigos.\n\nEn ese momento de crecimiento personal nacieron mis dos hijos (Carlos y Àlex), y comencé a sufrir las primeras orfandades, lo que anunciaba un cambio de ciclo. Poco después de cumplir los cuarenta, me divorcié y mi vida se partió en dos. Dejé entonces mi trabajo, mi ciudad, mi pasado y salté al vacío.\n\nPor desgracia, a mí nunca me cuadraron las palabras de mi abuelo paterno: «¿Y cómo queréis que me haga rico si me paso el día trabajando?». Yo me paso el día pensando, imaginando, también escribiendo, y eso no da ni para ser pobre.", fullUrl:"javier-batlle.html", tags:["Barcelona","poesía","memoria"] },
];

async function callAI(system, userMsg) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000,
      system, messages:[{role:"user",content:userMsg}] })
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.content[0].text;
}

const READ_FS_STEPS=[1.0,1.15,1.3,1.5,1.75];
function Read({auto,setView,t}) {
  const [tl,setTl]=useState("ES");const [tr,setTr]=useState("");const [doing,setDoing]=useState(false);const [copied,setCopied]=useState(false);
  const [fsStep,setFsStep]=useState(()=>{
    const saved=parseInt(localStorage.getItem("lm_read_fs"),10);
    return Number.isInteger(saved)&&saved>=0&&saved<READ_FS_STEPS.length?saved:1;
  });
  useEffect(()=>{localStorage.setItem("lm_read_fs",String(fsStep));},[fsStep]);
  if(!auto){setView("library");return null;}
  const ln=LANGS_UI.find(l=>l.code===tl)?.label||tl;
  const translate=async()=>{setDoing(true);setTr("");try{setTr(await callAI(`Eres un traductor literario. Traduce este texto autobiográfico al ${ln} preservando la voz personal. Adapta también la puntuación del diálogo y las comillas a la convención propia del ${ln} —no conserves el guion de diálogo ni las comillas angulares del original si esa no es la convención habitual en el idioma de destino—. Solo la traducción.`,auto.text));}catch(e){setTr("Error.");}setDoing(false);};
  const share=()=>{setCopied(true);setTimeout(()=>setCopied(false),2200);};
  return (
    <div className="read-wrap fu" style={{"--read-fs":`${READ_FS_STEPS[fsStep]}rem`}}>
      <button className="back" onClick={()=>setView("library")}>{t.back}</button>
      <div style={{fontSize:"1.8rem",marginBottom:"0.45rem"}}>{auto.flag}</div>
      <div className="r-orig">{auto.country} · {auto.lang}</div>
      <h1 className="r-name">{auto.title||auto.name}</h1>
      <div className="r-meta">{t.born} {auto.born||"—"} · {[...auto.tags.slice(0,2),auto.profession].filter(Boolean).join(", ")}</div>
      <div className="fs-ctrl" role="group" aria-label={t.fs_label}>
        <span className="fs-lbl">{t.fs_label}</span>
        <button type="button" className="fs-btn a-sm" onClick={()=>setFsStep(s=>Math.max(0,s-1))} disabled={fsStep===0} aria-label={t.fs_smaller}>A−</button>
        <button type="button" className="fs-btn a-md" onClick={()=>setFsStep(1)} disabled={fsStep===1} aria-label={t.fs_reset}>A</button>
        <button type="button" className="fs-btn a-lg" onClick={()=>setFsStep(s=>Math.min(READ_FS_STEPS.length-1,s+1))} disabled={fsStep===READ_FS_STEPS.length-1} aria-label={t.fs_bigger}>A+</button>
      </div>
      <div className="r-body">{auto.text.split("\n\n").map((p,i)=><p key={i}>{p}</p>)}</div>
      <div style={{marginTop:"1.8rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"0.9rem"}}>
        <div className="tags">
          {auto.tags.slice(0,2).map(tg=><span key={tg} className="tag">{tg}</span>)}
          {auto.profession&&<span className="tag">{auto.profession}</span>}
        </div>
        <button className="share-btn" onClick={share}>{copied?t.share_copied:`↗ ${t.share_btn}`}</button>
      </div>
      {auto.fullUrl&&(
        <div style={{margin:"1.8rem 0",padding:"1.2rem 1.5rem",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"3px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"1rem"}}>
          <span style={{fontFamily:"var(--body)",fontSize:"1rem",color:"var(--ink)"}}>Esta historia incluye fotos e índice de capítulos.</span>
          <a href={auto.fullUrl} target="_blank" className="read-full" style={{textDecoration:"none"}}>📖 Leer historia completa</a>
        </div>
      )}
      <div className="tr-bar">
        <div className="tr-tit">{t.read_in}</div>
        <div className="tr-row">
          <select className="sel" value={tl} onChange={e=>{setTl(e.target.value);setTr("")}}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select>
          <button className="btn-sm" onClick={translate} disabled={doing}>{doing?<span style={{display:"flex",alignItems:"center",gap:"0.4rem"}}><span className="sp"/>…</span>:t.translate}</button>
        </div>
        {tr&&<div className="tr-result">{tr}</div>}
      </div>
    </div>
  );
