function AuthGate({t,lang,onAuthenticated}) {
  // step: landing | signup | login | recover | recover_sim | recover_reset
  const [step,setStep]=useState("landing");
  const [email,setEmail]=useState("");const [pw,setPw]=useState("");const [pw2,setPw2]=useState("");
  const [legalName,setLegalName]=useState("");
  const [secQ,setSecQ]=useState(SECQ[lang==="EN"?"EN":"ES"][0]);const [secA,setSecA]=useState("");
  const [err,setErr]=useState("");
  const secList = SECQ[lang==="EN"?"EN":"ES"];
  const clean = (v) => v.trim().toLowerCase();

  const doSignup = () => {
    setErr("");
    if(!email.trim()||!pw||!pw2||!legalName.trim()||!secA.trim()){setErr(t.auth_err_fields);return;}
    if(pw!==pw2){setErr(t.auth_err_mismatch);return;}
    const authors=loadAuthors();
    const key=clean(email);
    if(authors[key]){setErr(t.auth_err_exists);return;}
    authors[key]={email:email.trim(),password:pw,legalName:legalName.trim(),secQ,secA:secA.trim()};
    saveAuthors(authors);
    setSession(key);
    onAuthenticated(key);
  };

  const doLogin = () => {
    setErr("");
    if(!email.trim()||!pw){setErr(t.auth_err_fields);return;}
    const authors=loadAuthors();
    const key=clean(email);
    const rec=authors[key];
    if(!rec||rec.password!==pw){setErr(t.auth_err_login);return;}
    setSession(key);
    onAuthenticated(key);
  };

  const doRecoverSend = () => {
    setErr("");
    const authors=loadAuthors();
    if(!authors[clean(email)]){setErr(t.auth_err_notfound);return;}
    setStep("recover_sim");
  };

  const doSetNewPassword = () => {
    setErr("");
    if(!pw||!pw2){setErr(t.auth_err_fields);return;}
    if(pw!==pw2){setErr(t.auth_err_mismatch);return;}
    const authors=loadAuthors();
    const key=clean(email);
    authors[key].password=pw;
    saveAuthors(authors);
    setSession(key);
    onAuthenticated(key);
  };

  const card = (children) => (
    <div style={{maxWidth:"420px",margin:"0 auto",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"4px",padding:"2.2rem"}}>
      {children}
    </div>
  );

  if(step==="landing") return (
    <div className="wr-wrap">
      <h2 className="wr-h" style={{textAlign:"center"}}>{t.write_h}</h2>
      <p className="wr-sub" style={{textAlign:"center",maxWidth:"420px",margin:"0 auto 1.8rem"}}>{t.write_sub}</p>
      {card(
        <div style={{display:"flex",flexDirection:"column",gap:"0.9rem"}}>
          <button className="btn-pub" onClick={()=>{setErr("");setStep("login");}}>{t.auth_have_account}</button>
          <button className="btn-out" onClick={()=>{setErr("");setStep("signup");}}>{t.auth_first_time}</button>
        </div>
      )}
    </div>
  );

  if(step==="signup") return (
    <div className="wr-wrap">
      {card(<>
        <button className="back" onClick={()=>{setErr("");setStep("landing");}}>{t.auth_back}</button>
        <h2 className="wr-h">{t.auth_signup_h}</h2>
        <p className="wr-sub">{t.auth_signup_sub}</p>
        <div className="fld"><label className="lbl">{t.auth_email}</label><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
        <div className="fld"><label className="lbl">{t.auth_legal_name}</label><input className="inp" value={legalName} onChange={e=>setLegalName(e.target.value)}/></div>
        <p style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)",marginTop:"-0.6rem",marginBottom:"1.1rem"}}>{t.auth_legal_name_note}</p>
        <div className="fld"><label className="lbl">{t.auth_password}</label><input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}/></div>
        <div className="fld"><label className="lbl">{t.auth_password_repeat}</label><input className="inp" type="password" value={pw2} onChange={e=>setPw2(e.target.value)}/></div>
        <div className="fld">
          <label className="lbl">{t.auth_security_q}</label>
          <select className="inp" value={secQ} onChange={e=>setSecQ(e.target.value)}>{secList.map(q=><option key={q} value={q}>{q}</option>)}</select>
        </div>
        <div className="fld"><label className="lbl">{t.auth_security_a}</label><input className="inp" value={secA} onChange={e=>setSecA(e.target.value)}/></div>
        <p style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)",marginTop:"-0.6rem",marginBottom:"1.1rem"}}>{t.auth_security_note}</p>
        {err&&<p style={{fontFamily:"var(--body)",fontSize:"0.86rem",color:"#b23b3b",marginBottom:"1rem"}}>{err}</p>}
        <button className="btn-pub" style={{width:"100%"}} onClick={doSignup}>{t.auth_create_account_btn}</button>
      </>)}
    </div>
  );

  if(step==="login") return (
    <div className="wr-wrap">
      {card(<>
        <button className="back" onClick={()=>{setErr("");setStep("landing");}}>{t.auth_back}</button>
        <h2 className="wr-h">{t.auth_login_h}</h2>
        <p className="wr-sub">{t.auth_login_sub}</p>
        <div className="fld"><label className="lbl">{t.auth_email}</label><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
        <div className="fld"><label className="lbl">{t.auth_password}</label><input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}/></div>
        {err&&<p style={{fontFamily:"var(--body)",fontSize:"0.86rem",color:"#b23b3b",marginBottom:"1rem"}}>{err}</p>}
        <button className="btn-pub" style={{width:"100%",marginBottom:"0.9rem"}} onClick={doLogin}>{t.auth_login_btn}</button>
        <p style={{textAlign:"center"}}><span style={{fontFamily:"var(--body)",fontSize:"0.84rem",color:"var(--gold)",textDecoration:"underline",cursor:"pointer"}} onClick={()=>{setErr("");setPw("");setStep("recover");}}>{t.auth_forgot}</span></p>
      </>)}
    </div>
  );

  if(step==="recover") return (
    <div className="wr-wrap">
      {card(<>
        <button className="back" onClick={()=>{setErr("");setStep("login");}}>{t.auth_back}</button>
        <h2 className="wr-h">{t.auth_recover_h}</h2>
        <p className="wr-sub">{t.auth_recover_sub}</p>
        <div className="fld"><label className="lbl">{t.auth_email}</label><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
        {err&&<p style={{fontFamily:"var(--body)",fontSize:"0.86rem",color:"#b23b3b",marginBottom:"1rem"}}>{err}</p>}
        <button className="btn-pub" style={{width:"100%"}} onClick={doRecoverSend}>{t.auth_recover_btn}</button>
      </>)}
    </div>
  );

  if(step==="recover_sim") return (
    <div className="wr-wrap">
      {card(<>
        <h2 className="wr-h">{t.auth_recover_sent_h}</h2>
        <p className="wr-sub">{t.auth_recover_sent_sub}</p>
        <button className="btn-pub" style={{width:"100%"}} onClick={()=>{setPw("");setPw2("");setStep("recover_reset");}}>{t.auth_recover_sim_btn}</button>
      </>)}
    </div>
  );

  if(step==="recover_reset") return (
    <div className="wr-wrap">
      {card(<>
        <h2 className="wr-h">{t.auth_set_new_password_h}</h2>
        <div className="fld"><label className="lbl">{t.auth_new_password}</label><input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)}/></div>
        <div className="fld"><label className="lbl">{t.auth_password_repeat}</label><input className="inp" type="password" value={pw2} onChange={e=>setPw2(e.target.value)}/></div>
        {err&&<p style={{fontFamily:"var(--body)",fontSize:"0.86rem",color:"#b23b3b",marginBottom:"1rem"}}>{err}</p>}
        <button className="btn-pub" style={{width:"100%"}} onClick={doSetNewPassword}>{t.auth_save_password_btn}</button>
      </>)}
    </div>
  );

  return null;
}

function Write({setView,onPublish,onUnpublish,t,lang,onLegal}) {
  const [session,setSessionState]=useState(()=>getSession());
  if(!session){
    return <AuthGate t={t} lang={lang} onAuthenticated={(email)=>setSessionState(email)}/>;
  }
  return <AuthoredWrite setView={setView} onPublish={onPublish} onUnpublish={onUnpublish} t={t} onLegal={onLegal} email={session} onLogout={()=>{setSession(null);setSessionState(null);}}/>;
}

function AuthoredWrite({setView,onPublish,onUnpublish,t,onLegal,email,onLogout}) {
  // Un único libro por Autor: se carga (si existe) o se crea vacío, siempre bajo la misma
  // clave de cuenta — nunca hay un botón para "crear otro libro".
  const [f,setF]=useState(()=>loadBook(email)||{
    name:"",born:"",country:"",lang:"ES",title:"",subtitle:"",text:"",coverImg:null,
    authorNumber:null,founder:false,blocks:[{type:"chapter",title:"",num:1}],
    assistantActive:false,assistantTuUsted:null,assistantName:"",
    photosSlots:[],wizardDone:false,published:false,publishedId:null
  });
  useEffect(()=>{ saveBook(email,f); },[f,email]);
  const up=(k,v)=>setF(p=>(({...p,[k]:v})));

  const [wStep,setWStep]=useState(f.wizardDone?"editor":"datos");

  const [ao,setAo]=useState("");const [al,setAl]=useState(false);const [am,setAm]=useState("");
  const [tl,setTl]=useState("EN");const [pub,setPub]=useState(false);
  const [showPhotosM,setShowPhotosM]=useState(false);const [showPdfM,setShowPdfM]=useState(false);
  const [photosBought,setPhotosBought]=useState(0);const [pdfBought,setPdfBought]=useState(null);
  const [showAiOverlay,setShowAiOverlay]=useState(false);
  const [aiTuUsted,setAiTuUsted]=useState(null);const [aiNameDraft,setAiNameDraft]=useState(f.name||"");
  const [showSaveExit,setShowSaveExit]=useState(false);
  const [uploadFileName,setUploadFileName]=useState("");
  const [uploadReviewState,setUploadReviewState]=useState(null); // null | "ok" | "flagged"
  const [uploadFlagged,setUploadFlagged]=useState([]); // [{excerpt, resolved}]
  const [uploadAccepted,setUploadAccepted]=useState(false);
  const MOCK_EXTRACTED_TEXT = "Nací en un pueblo pequeño del norte, en una casa con un huerto grande donde mi madre cultivaba tomates y calabazas. Recuerdo el olor de la tierra mojada después de llover, y las tardes de verano jugando con mis primos hasta que anochecía. Mi vecino Antonio Pérez Ruiz, que vivía en el número 4, tuvo problemas serios con la justicia por aquellos años, algo que toda la calle comentaba.";
  const historyRef=useRef([]);
  const taRef=useRef(null);

  const binaryLangs=["ES","CA","GL","FR","IT","PT","DE"];
  const asksTuUsted = binaryLangs.includes(f.lang);

  const run=async(mode)=>{
    if(!f.text.trim()&&mode!=="structure")return;
    setAl(true);setAm(mode);setAo("");
    const ln=LANGS_UI.find(l=>l.code===tl)?.label||tl;
    try{
      let sys="",msg="";
      if(mode==="continue"){sys="Eres un asistente de escritura autobiográfica. Continúa el texto respetando voz, idioma y estilo. Solo la continuación.";msg="Continúa:\n\n"+f.text;}
      else if(mode==="improve"){sys="Eres un editor literario. Mejora este texto haciéndolo más evocador sin cambiar la voz. Solo el texto mejorado.";msg=f.text;}
      else if(mode==="translate"){sys="Eres un traductor literario. Traduce al "+ln+" preservando la voz personal. Adapta también la puntuación del diálogo y las comillas a la convención propia de "+ln+" —no conserves el guion de diálogo ni las comillas angulares del original si esa no es la convención habitual en el idioma de destino—. Solo la traducción.";msg=f.text;}
      else if(mode==="structure"){sys="Eres un editor amable. Sugiere estructura y temas para esta autobiografía. Sé conciso.";msg=f.text||"Nombre: "+f.name+". País: "+f.country+". Año: "+f.born+".";}
      setAo(await callAI(sys,msg));
    }catch(e){setAo("Error.");}
    setAl(false);
  };
  const apply=()=>{if(am==="improve"||am==="translate")up("text",ao);else if(am==="continue")up("text",f.text+"\n\n"+ao);setAo("");};

  const publish=(alsoUpload)=>{
    if(!f.name||!f.text)return;
    if(alsoUpload){
      const pid=Date.now();
      onPublish({id:pid,name:f.name,born:parseInt(f.born)||0,country:f.country||"—",
        flag:"✍️",lang:f.lang,title:f.title||f.name,subtitle:f.subtitle||"",
        cover:f.coverImg||null,preview:f.text.slice(0,88)+"...",text:f.text,tags:["nueva historia"]});
      setF(p=>({...p,published:true,publishedId:pid}));
      setPub(true);
      setView("library");
    }
    setShowSaveExit(false);
  };

  // ---- Paso "número de Autor" — se asigna una sola vez, la primera vez que se ve el paso ----
  useEffect(()=>{
    if(wStep==="numero"&&!f.authorNumber){
      const n=assignAuthorNumber();
      setF(p=>({...p,authorNumber:n,founder:n<=100}));
    }
  },[wStep]);

  // ---- Bloques (capítulos/apartados) — organizan el índice del libro; el texto sigue siendo
  // un único campo continuo (dividir el propio contenido por bloque es trabajo de Fase B) ----
  const renumberBlocks=(blocks)=>{
    let n=0;
    return blocks.map(b=>b.type==="chapter"?{...b,num:(n=n+1)}:b);
  };
  const blockLabel=(b)=> b.type==="chapter"
    ? (t.ed_chapter_word.charAt(0).toUpperCase()+t.ed_chapter_word.slice(1))+" "+b.num+(b.title?" — "+b.title:"")
    : (t.ed_apartado_word.charAt(0).toUpperCase()+t.ed_apartado_word.slice(1))+(b.title?" — "+b.title:" — "+t.ed_untitled);
  const addBlock=(type)=> setF(p=>({...p,blocks:renumberBlocks([...p.blocks,{type,title:""}])}));
  const moveBlock=(i,dir)=> setF(p=>{
    const j=i+dir; if(j<0||j>=p.blocks.length) return p;
    const bl=[...p.blocks]; [bl[i],bl[j]]=[bl[j],bl[i]];
    return {...p,blocks:renumberBlocks(bl)};
  });
  const renameBlock=(i)=>{
    const b=f.blocks[i];
    const nt=prompt(t.ed_rename_prompt+" "+(b.type==="chapter"?t.ed_chapter_word:t.ed_apartado_word)+":", b.title||"");
    if(nt===null) return;
    setF(p=>{ const bl=[...p.blocks]; bl[i]={...bl[i],title:nt.trim()}; return {...p,blocks:renumberBlocks(bl)}; });
  };
  const deleteBlock=(i)=>{
    if(f.blocks.length===1){ alert(t.ed_need_one_block); return; }
    if(!confirm(t.ed_confirm_delete)) return;
    setF(p=>{ const bl=[...p.blocks]; bl.splice(i,1); return {...p,blocks:renumberBlocks(bl)}; });
  };

  // ---- Cursiva simple sobre el texto seleccionado (marcado _así_, compatible con el campo de
  // texto plano que también usa el Asistente) y deshacer con historial de las últimas versiones ----
  const pushHistory=()=>{ historyRef.current=[...historyRef.current.slice(-19), f.text]; };
  const onTextChange=(v)=>{ pushHistory(); up("text",v); };
  const applyItalic=()=>{
    const ta=taRef.current; if(!ta) return;
    const {selectionStart:s,selectionEnd:eIdx}=ta;
    if(s===eIdx) return;
    pushHistory();
    const nv=f.text.slice(0,s)+"_"+f.text.slice(s,eIdx)+"_"+f.text.slice(eIdx);
    up("text",nv);
  };
  const undo=()=>{
    const h=historyRef.current;
    if(h.length===0) return;
    const prev=h[h.length-1];
    historyRef.current=h.slice(0,-1);
    up("text",prev);
  };

  // ---- Fotos añadidas: se crean tantos huecos como fotos compradas; cada hueco se puede
  // subir, cambiar o quitar de forma independiente ----
  useEffect(()=>{
    if(photosBought>f.photosSlots.length){
      const extra=Array.from({length:photosBought-f.photosSlots.length},()=>({dataUrl:null,caption:""}));
      setF(p=>({...p,photosSlots:[...p.photosSlots,...extra]}));
    }
  },[photosBought]);
  const setPhotoSlot=(i,dataUrl)=> setF(p=>{ const s=[...p.photosSlots]; s[i]={...s[i],dataUrl}; return {...p,photosSlots:s}; });
  const setPhotoCaption=(i,cap)=> setF(p=>{ const s=[...p.photosSlots]; s[i]={...s[i],caption:cap}; return {...p,photosSlots:s}; });
  const removePhoto=(i)=> setF(p=>{ const s=[...p.photosSlots]; s[i]={dataUrl:null,caption:""}; return {...p,photosSlots:s}; });

  const runUploadReview=(simulateFlag)=>{
    if(simulateFlag){
      const excerpt="Mi vecino Antonio Pérez Ruiz, que vivía en el número 4, tuvo problemas serios con la justicia por aquellos años, algo que toda la calle comentaba.";
      setUploadFlagged([{excerpt,resolved:false}]);
      setUploadReviewState("flagged");
    } else {
      setUploadFlagged([]);
      setUploadReviewState("ok");
    }
  };
  const reformularPasaje=(i)=>{
    const old=uploadFlagged[i].excerpt;
    const nuevo=prompt(t.upload_reformular_prompt, old);
    if(nuevo===null) return;
    up("text", f.text.split(old).join(nuevo.trim()));
    setUploadFlagged(p=>{const a=[...p];a[i]={...a[i],resolved:true,excerpt:nuevo.trim()};return a;});
  };
  const suprimirPasaje=(i)=>{
    const old=uploadFlagged[i].excerpt;
    if(!confirm(t.upload_flag_suprimir+"?")) return;
    up("text", f.text.split(old).join("").replace(/\s{2,}/g," ").trim());
    setUploadFlagged(p=>{const a=[...p];a[i]={...a[i],resolved:true};return a;});
  };
  const allResolved = uploadFlagged.length>0 && uploadFlagged.every(x=>x.resolved);

  const [unpubStep,setUnpubStep]=useState(null); // null | "confirm" | "sent" | "done"
  const [showUndo,setShowUndo]=useState(false);
  const lastUnpublishedRef=useRef(null);
  const undoTimerRef=useRef(null);
  const doUnpublishConfirmed=()=>{
    lastUnpublishedRef.current={
      id:f.publishedId,name:f.name,born:parseInt(f.born)||0,country:f.country||"—",
      flag:"✍️",lang:f.lang,title:f.title||f.name,subtitle:f.subtitle||"",
      cover:f.coverImg||null,preview:f.text.slice(0,88)+"...",text:f.text,tags:["nueva historia"]
    };
    onUnpublish(f.publishedId);
    up("published",false);
    setUnpubStep("done");
    setShowUndo(true);
    clearTimeout(undoTimerRef.current);
    undoTimerRef.current=setTimeout(()=>setShowUndo(false),8000);
  };
  const undoUnpublish=()=>{
    if(!lastUnpublishedRef.current) return;
    onPublish(lastUnpublishedRef.current);
    up("published",true);
    setShowUndo(false);
    setUnpubStep(null);
    clearTimeout(undoTimerRef.current);
  };

  const [deletePhrase,setDeletePhrase]=useState("");
  const [deleteStep,setDeleteStep]=useState(null); // null | "sent" | "done"
  const doDeleteForever=()=>{
    if(f.published&&f.publishedId) onUnpublish(f.publishedId);
    setF(p=>({...p,text:"",title:"",subtitle:"",coverImg:null,blocks:[{type:"chapter",title:"",num:1}],
      photosSlots:[],wizardDone:false,published:false,publishedId:null,assistantActive:false}));
    setDeleteStep("done");
  };

  const topBar = (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"0.6rem",marginBottom:"1.4rem"}}>
      <button className="back" onClick={()=>setView("home")}>{t.back_home}</button>
      <span style={{fontFamily:"var(--body)",fontSize:"0.76rem",color:"var(--muted)"}}>
        {t.auth_greeting} {email} · <span style={{color:"var(--gold)",textDecoration:"underline",cursor:"pointer"}} onClick={onLogout}>{t.auth_logout}</span>
      </span>
    </div>
  );
  const narrowCard=(children)=>(
    <div style={{maxWidth:"460px",margin:"0 auto",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"4px",padding:"2.2rem"}}>
      {children}
    </div>
  );

  // ================= Paso 1 — datos del libro y Autor =================
  if(wStep==="datos") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <h2 className="wr-h">{t.write_h}</h2>
        <p className="wr-sub">{t.write_sub}</p>
        <div className="fld"><label className="lbl">{t.f_title}</label><input className="inp" placeholder={t.f_title_ph} value={f.title} onChange={e=>up("title",e.target.value)}/></div>
        <div className="fld"><label className="lbl">{t.f_subtitle}</label><input className="inp" placeholder={t.f_subtitle_ph} value={f.subtitle} onChange={e=>up("subtitle",e.target.value)}/></div>
        <div className="frow">
          <div className="fld"><label className="lbl">{t.f_name}</label><input className="inp" placeholder={t.f_name_ph} value={f.name} onChange={e=>up("name",e.target.value)}/></div>
          <div className="fld"><label className="lbl">{t.f_born}</label><input className="inp" type="number" placeholder="Ej. 1960" value={f.born} onChange={e=>up("born",e.target.value)}/></div>
        </div>
        <div className="frow">
          <div className="fld"><label className="lbl">{t.f_country}</label><input className="inp" value={f.country} onChange={e=>up("country",e.target.value)}/></div>
          <div className="fld"><label className="lbl">{t.f_lang}</label><select className="inp" value={f.lang} onChange={e=>up("lang",e.target.value)}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select></div>
        </div>
        <div className="fld">
          <label className="lbl">{t.f_cover}</label>
          <div style={{display:"flex",alignItems:"center",gap:"0.8rem",flexWrap:"wrap"}}>
            <label style={{fontFamily:"var(--body)",fontSize:"0.88rem",padding:"0.45rem 1rem",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"2px",cursor:"pointer",color:"var(--navy)"}}>
              {t.f_cover_btn}
              <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>up("coverImg",ev.target.result);r.readAsDataURL(file);}}/>
            </label>
            {f.coverImg&&<img src={f.coverImg} alt="portada" style={{height:"60px",width:"auto",borderRadius:"2px",border:"1px solid var(--border)"}}/>}
            <span style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)"}}>{t.f_cover_note}</span>
          </div>
        </div>
        <button className="btn-pub" style={{width:"100%"}} disabled={!f.name||!f.title} onClick={()=>setWStep("numero")}>{t.wiz_continue}</button>
      </>)}
    </div>
  );

  // ================= Paso 2 — número de Autor =================
  if(wStep==="numero") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <div style={{textAlign:"center",padding:"1rem 0"}}>
          <div style={{fontFamily:"var(--serif)",fontSize:"3rem",color:"var(--navy)",lineHeight:1}}>Nº {f.authorNumber||"—"}</div>
          <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",letterSpacing:"0.15em",textTransform:"uppercase",color:"var(--muted)",marginTop:"0.3rem"}}>{t.wiz_number_lbl} {f.authorNumber||"—"} {"de Locus Mundi"}</div>
          {f.founder&&<div style={{marginTop:"1rem",display:"inline-flex",alignItems:"center",gap:"0.4rem",background:"rgba(196,147,42,0.12)",border:"1px solid var(--gold)",color:"var(--gold)",fontFamily:"var(--body)",fontSize:"0.78rem",letterSpacing:"0.08em",padding:"0.4rem 0.9rem",borderRadius:"20px"}}>{t.wiz_founder}</div>}
        </div>
        <button className="btn-pub" style={{width:"100%"}} onClick={()=>setWStep("camino")}>{t.wiz_continue}</button>
      </>)}
    </div>
  );

  // ================= Paso 3 — elegir camino =================
  if(wStep==="camino") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <button className="back" onClick={()=>setWStep("numero")}>{t.auth_back}</button>
        <h2 className="wr-h">{t.wiz_camino_h}</h2>
        <button className="opt-card" onClick={()=>setWStep("upload")} style={optCardStyle}>
          <b style={optCardTitleStyle}>{t.wiz_camino_upload_t}</b><span style={optCardSubStyle}>{t.wiz_camino_upload_d}</span>
        </button>
        <button className="opt-card" onClick={()=>setWStep("condiciones")} style={optCardStyle}>
          <b style={optCardTitleStyle}>{t.wiz_camino_write_t}</b><span style={optCardSubStyle}>{t.wiz_camino_write_d}</span>
        </button>
      </>)}
    </div>
  );

  // ================= Camino A — subir archivo: paso "subir" =================
  if(wStep==="upload") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <button className="back" onClick={()=>setWStep("camino")}>{t.auth_back}</button>
        <h2 className="wr-h">{t.upload_h}</h2>
        <p className="wr-sub">{t.upload_sub}</p>
        <div style={{background:"rgba(27,58,107,0.05)",border:"1px solid rgba(27,58,107,0.18)",borderRadius:"3px",padding:"0.8rem 1rem",fontSize:"0.82rem",color:"var(--ink)",lineHeight:1.55,marginBottom:"1.2rem"}}>{t.upload_note_photos}</div>
        <label style={{display:"block",border:"2px dashed var(--border)",borderRadius:"3px",padding:"1.8rem 1rem",textAlign:"center",color:"var(--muted)",fontSize:"0.88rem",cursor:"pointer"}}>
          📄 {t.upload_btn}
          <input type="file" accept="application/pdf" style={{display:"none"}} onChange={e=>{
            const file=e.target.files[0]; if(!file) return;
            setUploadFileName(file.name);
            up("text", MOCK_EXTRACTED_TEXT);
            setWStep("upload_confirm");
          }}/>
        </label>
        <p style={{fontFamily:"var(--body)",fontSize:"0.72rem",color:"var(--muted)",marginTop:"0.6rem",fontStyle:"italic"}}>{t.upload_sim_note}</p>
      </>)}
    </div>
  );

  // ================= Camino A — confirmar texto extraído =================
  if(wStep==="upload_confirm") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <button className="back" onClick={()=>setWStep("upload")}>{t.auth_back}</button>
        <h2 className="wr-h">{t.upload_confirm_h}</h2>
        <p className="wr-sub">{t.upload_confirm_sub}</p>
        <textarea className="ta" style={{minHeight:"160px"}} value={f.text} onChange={e=>up("text",e.target.value)}/>
        <button className="btn-pub" style={{width:"100%",marginTop:"1rem"}} onClick={()=>setWStep("upload_maqueta")}>{t.upload_confirm_btn}</button>
      </>)}
    </div>
  );

  // ================= Camino A — maquetación al estilo de la colección =================
  if(wStep==="upload_maqueta") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <button className="back" onClick={()=>setWStep("upload_confirm")}>{t.auth_back}</button>
        <h2 className="wr-h">{t.upload_maqueta_h}</h2>
        <p className="wr-sub">{t.upload_maqueta_sub}</p>
        <div style={{background:"#fffdf8",border:"1px solid var(--border)",borderRadius:"3px",padding:"1.8rem 1.4rem",marginBottom:"1.2rem",boxShadow:"0 2px 10px rgba(0,0,0,0.06)"}}>
          <div style={{fontFamily:"var(--body)",fontSize:"0.7rem",letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--gold)",marginBottom:"0.3rem"}}>{t.ed_chapter_word.charAt(0).toUpperCase()+t.ed_chapter_word.slice(1)} 1</div>
          <div style={{fontFamily:"var(--serif)",fontSize:"1.4rem",color:"var(--ink)",marginBottom:"0.9rem"}}>{f.title||f.name}</div>
          <p style={{fontFamily:"var(--body)",fontSize:"0.95rem",lineHeight:1.8,color:"var(--ink)"}}>{f.text}</p>
        </div>
        <button className="btn-pub" style={{width:"100%"}} onClick={()=>{setUploadReviewState(null);setWStep("upload_review");}}>{t.upload_maqueta_btn}</button>
      </>)}
    </div>
  );

  // ================= Camino A — revisión (filtro de contenido) =================
  if(wStep==="upload_review") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <button className="back" onClick={()=>setWStep("upload_maqueta")}>{t.auth_back}</button>
        <h2 className="wr-h">{t.upload_review_h}</h2>

        {uploadReviewState===null&&(
          <div style={{display:"flex",flexDirection:"column",gap:"0.6rem",margin:"1rem 0"}}>
            <p style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--muted)",fontStyle:"italic"}}>{t.upload_sim_note}</p>
            <button className="btn-pub" onClick={()=>runUploadReview(false)}>{t.upload_review_ok_btn}</button>
            <button className="btn-out" onClick={()=>runUploadReview(true)}>{t.upload_review_flag_btn}</button>
          </div>
        )}

        {uploadReviewState==="ok"&&(<>
          <div style={{display:"flex",alignItems:"center",gap:"0.5rem",padding:"0.5rem 0",fontSize:"0.86rem"}}><span style={{color:"#2a6a2a"}}>✓</span> {t.upload_review_ok_msg}</div>
          <div className="pol-box">
            <ul className="pol-li"><li>{t.pol1}</li><li>{t.pol2}</li><li>{t.pol3}</li><li>{t.pol4}</li></ul>
            <label style={{display:"flex",alignItems:"flex-start",gap:"0.5rem",marginTop:"0.8rem",paddingTop:"0.8rem",borderTop:"1px solid var(--border)",cursor:"pointer",fontFamily:"var(--body)",fontSize:"0.8rem",color:"var(--ink)",lineHeight:1.5}}>
              <input type="checkbox" checked={uploadAccepted} onChange={e=>setUploadAccepted(e.target.checked)} style={{marginTop:"0.2rem"}}/>
              <span>{t.accept_terms_pre} <span style={{color:"var(--gold)",textDecoration:"underline",cursor:"pointer"}} onClick={(ev)=>{ev.preventDefault();onLegal();}}>{t.accept_terms_link}</span></span>
            </label>
          </div>
          <button className="btn-pub" style={{width:"100%"}} disabled={!uploadAccepted} onClick={()=>{
            const pid=Date.now();
            onPublish({id:pid,name:f.name,born:parseInt(f.born)||0,country:f.country||"—",
              flag:"✍️",lang:f.lang,title:f.title||f.name,subtitle:f.subtitle||"",
              cover:f.coverImg||null,preview:f.text.slice(0,88)+"...",text:f.text,tags:["nueva historia"]});
            setF(p=>({...p,wizardDone:true,published:true,publishedId:pid}));
            setWStep("upload_done");
          }}>{t.upload_publish_btn}</button>
        </>)}

        {uploadReviewState==="flagged"&&(<>
          {uploadFlagged.map((fl,i)=>(
            <div key={i} style={{background:fl.resolved?"rgba(42,106,42,0.08)":"rgba(178,59,59,0.06)",border:"1px solid "+(fl.resolved?"#2a6a2a":"#b23b3b"),borderRadius:"3px",padding:"0.8rem 1rem",marginBottom:"0.8rem"}}>
              <p style={{fontFamily:"var(--body)",fontSize:"0.86rem",color:"var(--ink)",fontStyle:"italic",marginBottom:"0.4rem"}}>&ldquo;{fl.excerpt}&rdquo;</p>
              {fl.resolved?
                <span style={{fontFamily:"var(--body)",fontSize:"0.8rem",color:"#2a6a2a"}}>{t.upload_flag_resolved}</span>
              :<>
                <p style={{fontFamily:"var(--body)",fontSize:"0.76rem",color:"#b23b3b",marginBottom:"0.6rem"}}>{t.upload_flag_reason}</p>
                <div style={{display:"flex",gap:"0.5rem"}}>
                  <button className="toolbar-btn" onClick={()=>reformularPasaje(i)}>{t.upload_flag_reformular}</button>
                  <button className="toolbar-btn" onClick={()=>suprimirPasaje(i)}>{t.upload_flag_suprimir}</button>
                </div>
              </>}
            </div>
          ))}
          {allResolved
            ? <button className="btn-pub" style={{width:"100%"}} onClick={()=>runUploadReview(false)}>{t.upload_recheck_btn}</button>
            : <button className="btn-out" style={{width:"100%"}} onClick={()=>{up("wizardDone",true);setWStep("editor");}}>{t.upload_continue_unresolved}</button>}
        </>)}
      </>)}
    </div>
  );

  // ================= Camino A — publicado =================
  if(wStep==="upload_done") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <h2 className="wr-h">{t.upload_done_h}</h2>
        <p className="wr-sub">{t.published_ok}</p>
        <div style={{background:"rgba(196,147,42,0.08)",border:"1px solid var(--gold)",borderRadius:"3px",padding:"0.8rem 1rem",fontSize:"0.84rem",color:"var(--ink)",lineHeight:1.55,marginBottom:"1.2rem"}}>{t.upload_done_photos_note}</div>
        <button className="btn-pub" style={{width:"100%"}} onClick={()=>setWStep("editor")}>{t.upload_done_btn}</button>
      </>)}
    </div>
  );

  // ================= Privacidad y mis datos — eliminación completa =================
  if(wStep==="privacy") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <button className="back" onClick={()=>setWStep("editor")}>{t.privacy_back_btn}</button>
        <h2 className="wr-h">{t.privacy_h}</h2>
        {deleteStep===null&&(<>
          <div style={{background:"rgba(178,59,59,0.06)",border:"1px solid #b23b3b",borderRadius:"3px",padding:"0.9rem 1rem",marginBottom:"1.1rem"}}>
            <div style={{fontFamily:"var(--serif)",fontSize:"1.1rem",color:"#b23b3b",marginBottom:"0.5rem"}}>{t.privacy_delete_h}</div>
            <p style={{fontFamily:"var(--body)",fontSize:"0.84rem",color:"var(--ink)",lineHeight:1.6}}>{t.privacy_delete_warn}</p>
          </div>
          <div className="fld">
            <label className="lbl">{t.privacy_delete_phrase_lbl}</label>
            <p style={{fontFamily:"var(--body)",fontSize:"0.8rem",color:"var(--muted)",fontStyle:"italic",marginBottom:"0.4rem"}}>&ldquo;{t.privacy_delete_phrase}&rdquo;</p>
            <input className="inp" placeholder={t.privacy_delete_input_ph} value={deletePhrase} onChange={e=>setDeletePhrase(e.target.value)}/>
          </div>
          <button className="btn-out" style={{width:"100%",borderColor:"#b23b3b",color:"#b23b3b"}}
            disabled={deletePhrase.trim().toLowerCase()!==t.privacy_delete_phrase.toLowerCase()}
            onClick={()=>setDeleteStep("sent")}>{t.privacy_delete_btn}</button>
        </>)}
        {deleteStep==="sent"&&(<>
          <p className="wr-sub">{t.privacy_delete_sent_sub}</p>
          <button className="btn-pub" style={{width:"100%"}} onClick={doDeleteForever}>{t.unpub_sim_btn}</button>
        </>)}
        {deleteStep==="done"&&(<>
          <p className="ok-msg">{t.privacy_delete_done_h}</p>
          <button className="btn-pub" style={{width:"100%",marginTop:"0.8rem"}} onClick={()=>{setDeleteStep(null);setDeletePhrase("");setWStep("datos");}}>{t.wiz_continue}</button>
        </>)}
      </>)}
    </div>
  );

  // ================= Paso 4 (solo camino "escribir") — Condiciones de Publicación =================
  if(wStep==="condiciones") return (
    <div className="wr-wrap">
      {topBar}
      {narrowCard(<>
        <button className="back" onClick={()=>setWStep("camino")}>{t.auth_back}</button>
        <div style={{fontFamily:"var(--body)",fontSize:"0.68rem",letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--gold)",marginBottom:"0.6rem"}}>{t.wiz_cond_tag}</div>
        <h2 className="wr-h">{t.wiz_cond_h}</h2>
        <p className="wr-sub">{t.wiz_cond_sub}</p>
        <div className="pol-box">
          <ul className="pol-li"><li>{t.pol1}</li><li>{t.pol2}</li><li>{t.pol3}</li><li>{t.pol4}</li></ul>
          <label style={{display:"flex",alignItems:"flex-start",gap:"0.5rem",marginTop:"0.8rem",paddingTop:"0.8rem",borderTop:"1px solid var(--border)",cursor:"pointer",fontFamily:"var(--body)",fontSize:"0.8rem",color:"var(--ink)",lineHeight:1.5}}>
            <input type="checkbox" checked={!!f.acceptedConditions} onChange={e=>up("acceptedConditions",e.target.checked)} style={{marginTop:"0.2rem"}}/>
            <span>{t.accept_terms_pre} <span style={{color:"var(--gold)",textDecoration:"underline",cursor:"pointer"}} onClick={(ev)=>{ev.preventDefault();onLegal();}}>{t.accept_terms_link}</span></span>
          </label>
        </div>
        <button className="btn-pub" style={{width:"100%"}} disabled={!f.acceptedConditions} onClick={()=>{up("wizardDone",true);setWStep("editor");}}>{t.wiz_cond_start_btn}</button>
      </>)}
    </div>
  );

  // ================= Editor =================
  return (
    <div className="wr-wrap">
      {showPhotosM&&<PhotosModal onClose={()=>setShowPhotosM(false)} onPaid={(n)=>{setPhotosBought(p=>p+n);setShowPhotosM(false);}} t={t}/>}
      {showPdfM&&<PdfModal onClose={()=>setShowPdfM(false)} onPaid={(fmt)=>{setPdfBought(fmt);setShowPdfM(false);}} t={t}/>}
      {showAiOverlay&&(
        <div className="ov">
          <div className="modal" style={{maxWidth:"380px"}}>
            <button className="modal-x" onClick={()=>setShowAiOverlay(false)}>×</button>
            {asksTuUsted?
              <>
                <div className="modal-h" style={{fontSize:"1.2rem"}}>{t.ai_ask_tuusted_h}</div>
                <div style={{display:"flex",flexDirection:"column",gap:"0.6rem",margin:"0.8rem 0"}}>
                  <button className={aiTuUsted==="tu"?"btn-pub":"btn-out"} onClick={()=>setAiTuUsted("tu")}>{t.ai_tu}</button>
                  <button className={aiTuUsted==="usted"?"btn-pub":"btn-out"} onClick={()=>setAiTuUsted("usted")}>{t.ai_usted}</button>
                </div>
              </>
            :null}
            <div className="fld"><label className="lbl">{t.ai_ask_name_h}</label><input className="inp" value={aiNameDraft} onChange={e=>setAiNameDraft(e.target.value)}/></div>
            <button className="btn-pub" style={{width:"100%"}} onClick={()=>{
              setF(p=>({...p,assistantActive:true,assistantTuUsted:asksTuUsted?aiTuUsted:null,assistantName:aiNameDraft||f.name}));
              setShowAiOverlay(false);
            }}>{t.ai_start_using}</button>
          </div>
        </div>
      )}
      {showSaveExit&&(
        <div className="ov">
          <div className="modal" style={{maxWidth:"380px"}}>
            <button className="modal-x" onClick={()=>setShowSaveExit(false)}>×</button>
            <div className="modal-h" style={{fontSize:"1.15rem"}}>{t.ed_save_exit_q}</div>
            <button className="btn-pub" style={{width:"100%",marginTop:"0.8rem"}} onClick={()=>publish(false)}>{t.ed_save_private}</button>
            <button className="btn-out" style={{width:"100%"}} disabled={!f.name||!f.text} onClick={()=>publish(true)}>{t.ed_save_upload}</button>
            {pub&&<p className="ok-msg" style={{marginTop:"0.6rem"}}>{t.published_ok}</p>}
          </div>
        </div>
      )}
      {unpubStep&&(
        <div className="ov">
          <div className="modal" style={{maxWidth:"380px"}}>
            <button className="modal-x" onClick={()=>setUnpubStep(null)}>×</button>
            {unpubStep==="confirm"&&(<>
              <div className="modal-h" style={{fontSize:"1.15rem"}}>{t.unpub_confirm_h}</div>
              <p className="modal-sub">{t.unpub_confirm_sub}</p>
              <button className="btn-pub" style={{width:"100%",marginTop:"0.8rem"}} onClick={()=>setUnpubStep("sent")}>{t.unpub_confirm_btn}</button>
              <button className="btn-out" style={{width:"100%"}} onClick={()=>setUnpubStep(null)}>{t.unpub_cancel_btn}</button>
            </>)}
            {unpubStep==="sent"&&(<>
              <div className="modal-h" style={{fontSize:"1.15rem"}}>{t.unpub_sent_h}</div>
              <p className="modal-sub">{t.unpub_sent_sub}</p>
              <button className="btn-pub" style={{width:"100%",marginTop:"0.8rem"}} onClick={doUnpublishConfirmed}>{t.unpub_sim_btn}</button>
            </>)}
            {unpubStep==="done"&&(<>
              <p className="ok-msg">{t.unpub_done_msg}</p>
              {showUndo&&<button className="btn-out" style={{width:"100%",marginTop:"0.6rem"}} onClick={undoUnpublish}>{t.unpub_undo_btn}</button>}
              <button className="btn-pub" style={{width:"100%",marginTop:"0.6rem"}} onClick={()=>setUnpubStep(null)}>OK</button>
            </>)}
          </div>
        </div>
      )}
      {topBar}
      <div className="wr-grid">
        <div>
          <div className="frow" style={{marginBottom:"0.9rem"}}>
            <div className="fld" style={{marginBottom:0}}><label className="lbl">{t.f_title}</label><input className="inp" value={f.title} onChange={e=>up("title",e.target.value)}/></div>
            <div className="fld" style={{marginBottom:0}}><label className="lbl">{t.f_subtitle}</label><input className="inp" value={f.subtitle} onChange={e=>up("subtitle",e.target.value)}/></div>
          </div>
          <div className="fld">
            <label className="lbl">{t.f_cover}</label>
            <div style={{display:"flex",alignItems:"center",gap:"0.8rem",flexWrap:"wrap"}}>
              {f.coverImg&&<img src={f.coverImg} alt="portada" style={{height:"52px",width:"38px",objectFit:"cover",borderRadius:"2px",border:"1px solid var(--border)"}}/>}
              <label style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--gold)",textDecoration:"underline",cursor:"pointer"}}>
                {t.ed_change_cover}
                <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>up("coverImg",ev.target.result);r.readAsDataURL(file);}}/>
              </label>
            </div>
          </div>

          <div style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"3px",padding:"0.9rem",margin:"1rem 0"}}>
            <div style={{fontFamily:"var(--body)",fontSize:"0.68rem",letterSpacing:"0.16em",textTransform:"uppercase",color:"var(--gold)",marginBottom:"0.7rem"}}>{t.ed_blocks_h}</div>
            {f.blocks.map((b,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:"0.4rem",padding:"0.4rem 0.5rem",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"2px",marginBottom:"0.4rem",fontSize:"0.82rem"}}>
                <span style={{flex:1,color:"var(--ink)"}}>{blockLabel(b)}</span>
                <button style={editIconStyle} title={t.ed_rename_prompt} onClick={()=>renameBlock(i)}>✎</button>
                <button style={{...editIconStyle,color:"#b23b3b"}} title="✕" onClick={()=>deleteBlock(i)}>✕</button>
                <div style={{display:"flex",flexDirection:"column"}}>
                  <button style={{...arrowStyle,opacity:i===0?0.3:1}} disabled={i===0} onClick={()=>moveBlock(i,-1)}>▲</button>
                  <button style={{...arrowStyle,opacity:i===f.blocks.length-1?0.3:1}} disabled={i===f.blocks.length-1} onClick={()=>moveBlock(i,1)}>▼</button>
                </div>
              </div>
            ))}
            <div style={{display:"flex",gap:"0.4rem",marginTop:"0.6rem",flexWrap:"wrap"}}>
              <button type="button" className="toolbar-btn" onClick={()=>addBlock("chapter")}>{t.ed_add_chapter}</button>
              <button type="button" className="toolbar-btn" onClick={()=>addBlock("apartado")}>{t.ed_add_apartado}</button>
            </div>
          </div>

          <div style={{display:"flex",gap:"0.5rem",marginBottom:"0.5rem",flexWrap:"wrap",alignItems:"center"}}>
            <button type="button" className="toolbar-btn" style={photosBought>0?{}:{opacity:0.4,cursor:"not-allowed"}}
              onClick={()=>{ if(photosBought===0){return;} document.getElementById("lm-photos-added")?.scrollIntoView({behavior:"smooth"}); }}>{t.ed_add_photo}</button>
            <button type="button" className="toolbar-btn" onClick={applyItalic}><i>{t.ed_italic}</i></button>
            <button type="button" className="toolbar-btn" onClick={undo}>{t.ed_undo}</button>
          </div>
          <textarea ref={taRef} className="ta" placeholder={t.f_text_ph} value={f.text} onChange={e=>onTextChange(e.target.value)}/>

          {f.photosSlots.length>0&&(
            <div id="lm-photos-added" style={{marginTop:"1rem"}}>
              <div className="lbl" style={{marginBottom:"0.5rem"}}>{t.ed_photos_added_h}</div>
              <div style={{display:"flex",gap:"0.8rem",flexWrap:"wrap"}}>
                {f.photosSlots.map((ph,i)=>(
                  <div key={i} style={{width:"120px",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"2px",padding:"0.5rem"}}>
                    {ph.dataUrl?
                      <img src={ph.dataUrl} alt="" style={{width:"100%",height:"90px",objectFit:"cover",borderRadius:"2px",marginBottom:"0.4rem"}}/>
                      :<div style={{width:"100%",height:"90px",background:"var(--bg2)",borderRadius:"2px",marginBottom:"0.4rem"}}/>}
                    <input className="inp" style={{fontSize:"0.7rem",padding:"0.3rem 0.4rem",marginBottom:"0.35rem"}} placeholder={t.ed_photo_caption_ph} value={ph.caption} onChange={e=>setPhotoCaption(i,e.target.value)}/>
                    <div style={{display:"flex",gap:"0.4rem",fontSize:"0.7rem"}}>
                      <label style={{color:"var(--gold)",textDecoration:"underline",cursor:"pointer"}}>
                        {ph.dataUrl?t.ed_photo_replace:t.ed_photo_upload}
                        <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>setPhotoSlot(i,ev.target.result);r.readAsDataURL(file);}}/>
                      </label>
                      {ph.dataUrl&&<span style={{color:"#b23b3b",textDecoration:"underline",cursor:"pointer"}} onClick={()=>removePhoto(i)}>{t.ed_photo_remove}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <p className="wr-sub" style={{marginTop:"0.8rem",fontSize:"0.8rem"}}>Autoguardado activo.</p>
          <div style={{marginTop:"1.2rem",paddingTop:"1rem",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"0.6rem"}}>
            <div style={{display:"flex",gap:"1rem",alignItems:"center"}}>
              {f.published&&<span style={{fontFamily:"var(--body)",fontSize:"0.72rem",color:"var(--muted)",textDecoration:"underline",cursor:"pointer"}} onClick={()=>setUnpubStep("confirm")}>{t.unpub_link}</span>}
              <span style={{fontFamily:"var(--body)",fontSize:"0.72rem",color:"var(--muted)",textDecoration:"underline",cursor:"pointer"}} onClick={()=>setWStep("privacy")}>{t.privacy_link}</span>
            </div>
            <button className="btn-out" style={{width:"auto",padding:"0.65rem 1.6rem"}} onClick={()=>setShowSaveExit(true)}>{t.ed_save_exit}</button>
          </div>
        </div>

        <div className="aip">
          <div className="pm-box">
            <div className="pm-tit">{t.pub_opts}</div>
            <div className="pm-row">
              <div className="pm-feat"><span className="pm-feat-t">{t.unlimited_text}</span><span className="badge free">{t.free}</span></div>
              <div className="pm-feat"><span className="pm-feat-t">{t.one_img}</span><span className="badge free">{t.free}</span></div>
              <div className="pm-feat"><span className="pm-feat-t">{t.permanent_archive}</span><span className="badge free">{t.free}</span></div>
            </div>
            <div style={{marginTop:"0.6rem",padding:"0.7rem 0.8rem",background:"var(--bg2)",border:"1px solid var(--navy)",borderRadius:"2px"}}>
              <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--navy)",fontWeight:"600",marginBottom:"0.2rem",textTransform:"uppercase",letterSpacing:"0.12em"}}>{t.ai_sub_label}</div>
              <div style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)",marginBottom:"0.4rem"}}>{t.ai_hours_note}</div>
              {!f.assistantActive
                ? <button className="pm-unlock" style={{borderColor:"var(--navy)",color:"var(--navy)"}} onClick={()=>{setAiTuUsted(null);setAiNameDraft(f.name||"");setShowAiOverlay(true);}}>{t.ai_activate_btn}</button>
                : <div style={{fontFamily:"var(--body)",fontSize:"0.8rem",color:"#2a6a2a"}}>{t.ai_active_msg} <b>{f.assistantName}</b></div>}
            </div>
            <div style={{marginTop:"0.6rem",padding:"0.7rem 0.8rem",background:"var(--bg2)",border:"1px solid var(--gold)",borderRadius:"2px"}}>
              <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--gold)",fontWeight:"600",marginBottom:"0.4rem",textTransform:"uppercase",letterSpacing:"0.12em"}}>{t.addon_photos_h}</div>
              <div className="pm-feat" style={{marginBottom:"0.5rem"}}><span className="pm-feat-t">{t.addon_photos_sub}</span><span className={`badge ${photosBought>0?"on":"prem"}`}>{photosBought>0?`${photosBought} ${t.photo_word}s`:`€1/${t.photo_word}`}</span></div>
              <button className="pm-unlock" onClick={()=>setShowPhotosM(true)}>{photosBought>0?t.addon_photos_add_more:t.addon_photos_btn}</button>
            </div>
            <div style={{marginTop:"0.6rem",padding:"0.7rem 0.8rem",background:"var(--bg2)",border:"1px solid var(--gold)",borderRadius:"2px"}}>
              <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--gold)",fontWeight:"600",marginBottom:"0.4rem",textTransform:"uppercase",letterSpacing:"0.12em"}}>{t.addon_pdf_h}</div>
              <div className="pm-feat" style={{marginBottom:"0.5rem"}}><span className="pm-feat-t">{t.addon_pdf_sub}</span><span className={`badge ${pdfBought?"on":"prem"}`}>{pdfBought?`DIN ${pdfBought}`:"€5"}</span></div>
              {!pdfBought&&<button className="pm-unlock" onClick={()=>setShowPdfM(true)}>{t.addon_pdf_btn}</button>}
            </div>
          </div>

          {f.assistantActive&&(<>
            <hr className="sep"/>
            <div className="aip-h"><span style={{color:"var(--gold)"}}>✦</span> {t.ai_h}</div>
            <p className="aip-sub">{t.ai_sub}</p>
            <div className="ai-btns">
              <button className="aib" disabled={al} onClick={()=>run("continue")}><span>→</span><span><b>{t.ai_continue}</b> — {t.ai_continue_d}</span></button>
              <button className="aib" disabled={al} onClick={()=>run("improve")}><span>✦</span><span><b>{t.ai_improve}</b> — {t.ai_improve_d}</span></button>
              <button className="aib" disabled={al} onClick={()=>run("structure")}><span>◈</span><span><b>{t.ai_structure}</b> — {t.ai_structure_d}</span></button>
            </div>
            <hr className="sep"/>
            <div className="tr-row2">
              <span className="tr-lbl">{t.translate_to}</span>
              <select className="sel" style={{flex:1}} value={tl} onChange={e=>setTl(e.target.value)}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select>
              <button className="btn-sm" disabled={al} onClick={()=>run("translate")}>{t.go}</button>
            </div>
            {al&&<div className="loading"><span className="sp"/>{t.ai_thinking}</div>}
            {ao&&!al&&(<div><div className="ai-out-lbl">{t.proposal}</div><div className="ai-out">{ao}</div>{(am==="continue"||am==="improve"||am==="translate")&&<button className="apply-btn" onClick={apply}>{am==="continue"?t.add_text:t.replace_text}</button>}</div>)}
          </>)}
        </div>
      </div>
    </div>
  );
}
const optCardStyle={display:"block",width:"100%",textAlign:"left",fontFamily:"var(--body)",fontSize:"0.92rem",padding:"0.9rem 1.1rem",background:"var(--bg2)",border:"1.5px solid var(--border)",borderRadius:"3px",cursor:"pointer",marginBottom:"0.7rem",color:"var(--ink)"};
const optCardTitleStyle={display:"block",fontFamily:"var(--serif)",fontSize:"1.05rem",fontWeight:500,marginBottom:"0.15rem"};
const optCardSubStyle={color:"var(--muted)",fontSize:"0.82rem"};
const editIconStyle={background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:"0.78rem",padding:"0 3px"};
const arrowStyle={background:"none",border:"none",color:"var(--navy)",cursor:"pointer",fontSize:"0.68rem",lineHeight:1,padding:"1px 4px"};

function Footer({t,onContact,onLegal,onCollab,onFaq}) {
  return (
    <footer className="foot">
      <img src={LOGO_SMALL} alt="Locus Mundi"/>
      <div className="foot-links">
        <span className="foot-lnk" onClick={onFaq}>{t.foot_faq}</span>
        <span className="foot-lnk" onClick={onCollab}>{t.foot_collab}</span>
        <span className="foot-lnk" onClick={()=>onLegal("aviso")}>{t.foot_aviso}</span>
        <span className="foot-lnk" onClick={()=>onLegal("privacidad")}>{t.foot_privacidad}</span>
        <span className="foot-lnk" onClick={()=>onLegal("cookies")}>{t.foot_cookies}</span>
        <span className="foot-lnk" onClick={()=>onLegal("condiciones")}>{t.foot_condiciones}</span>
        <span className="foot-lnk" onClick={onContact}>{t.foot_contact}</span>
      </div>
      <p style={{fontFamily:"var(--body)",fontSize:"0.8rem",color:"var(--muted)",maxWidth:"460px",lineHeight:1.6,textAlign:"center"}}>{t.foot_policy}</p>
      <div className="foot-copy">locusmundi.com · {new Date().getFullYear()}</div>
    </footer>
  );
}

function App() {
  const [lang,setLang]=useState(()=>{const bl=(navigator.language||"es").slice(0,2).toUpperCase();return bl==="EN"?"EN":"ES";});
  const t=T[lang];
  const [view,setView]=useState("home");
  const [sel,setSel]=useState(null);
  const [autos,setAutos]=useState(SAMPLE);
  const [showContact,setShowContact]=useState(false);
  const [showLegal,setShowLegal]=useState(null);
  const [showCollab,setShowCollab]=useState(false);
  const [showSponsor,setShowSponsor]=useState(false);
  const [showFaq,setShowFaq]=useState(false);
  const [cookieOk,setCookieOk]=useState(false);
  const open=(a)=>{setSel(a);setView("read");};
  return (
    <div>
      <Header view={view} setView={setView} lang={lang} setLang={setLang} t={t}/>
      {view==="home"&&<Home autos={autos} openAuto={open} setView={setView} t={t}/>}
      {view==="library"&&<Library autos={autos} openAuto={open} t={t}/>}
      {view==="read"&&<Read auto={sel} setView={setView} t={t}/>}
      {view==="write"&&<Write setView={setView} onPublish={a=>{setAutos(p=>[...p,a]);}} onUnpublish={id=>setAutos(p=>p.filter(x=>x.id!==id))} t={t} lang={lang} onLegal={()=>setShowLegal("condiciones")}/>}
      <Footer t={t} onContact={()=>setShowContact(true)} onLegal={setShowLegal} onCollab={()=>setShowCollab(true)} onFaq={()=>setShowFaq(true)}/>
      {showContact&&<ContactModal onClose={()=>setShowContact(false)} t={t}/>}
      {showLegal&&<LegalModal docKey={showLegal} onClose={()=>setShowLegal(null)} t={t} lang={lang}/>}
      {showCollab&&<CollaborateModal onClose={()=>setShowCollab(false)} t={t} lang={lang} onSponsor={()=>setShowSponsor(true)}/>}
      {showSponsor&&<SponsorModal onClose={()=>setShowSponsor(false)} t={t}/>}
      {showFaq&&<FaqModal onClose={()=>setShowFaq(false)} t={t} lang={lang}/>}
      {!cookieOk&&<div className="cookie-bar"><span className="cookie-msg">{t.cookie_msg}</span><button className="cookie-btn" onClick={()=>setCookieOk(true)}>{t.cookie_ok}</button></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
