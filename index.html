<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A6B;--gold:#C4932A;--gold2:#E8B84B;
  --bg:#EDE0C4;--bg2:#F7F0E0;--bg3:#FBF7EE;--ink:#1A0E07;
  --muted:#7A6248;--border:#C8B480;--shadow:rgba(27,58,107,0.10);
  --serif:'Cormorant Garamond',Georgia,serif;--body:'Crimson Pro',Georgia,serif;
}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;
  background-image:linear-gradient(rgba(27,58,107,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,58,107,0.04) 1px,transparent 1px);
  background-size:64px 64px}
.notice{background:var(--navy);color:rgba(255,255,255,0.9);text-align:center;
  padding:0.6rem 1.5rem;font-family:var(--serif);font-size:0.95rem;
  letter-spacing:0.22em;text-transform:uppercase}
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;
  justify-content:space-between;padding:0 2.5rem;height:70px;
  background:rgba(237,224,196,0.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:0.6rem;cursor:pointer}
.logo img{height:42px;width:auto;object-fit:contain}
.logo-name{font-family:var(--serif);font-size:1.4rem;font-weight:600;
  letter-spacing:0.14em;color:var(--ink);text-transform:uppercase}
nav{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.nl{font-family:var(--body);font-size:0.9rem;color:var(--muted);cursor:pointer;
  border:none;background:none;transition:color .2s;padding:0.2rem 0;
  border-bottom:1.5px solid transparent}
.nl:hover,.nl.on{color:var(--ink);border-bottom-color:var(--gold)}
.lang-tog{display:flex;border:1px solid var(--border);border-radius:2px;overflow:hidden}
.lang-btn{font-family:var(--body);font-size:0.76rem;padding:0.28rem 0.55rem;
  background:transparent;color:var(--muted);border:none;cursor:pointer;transition:background .15s,color .15s}
.lang-btn.on{background:var(--navy);color:#fff}
.btn-pri{font-family:var(--body);font-size:0.86rem;letter-spacing:0.05em;
  padding:0.48rem 1.1rem;color:#fff;border:none;cursor:pointer;border-radius:2px;transition:background .2s}
.btn-navy{background:var(--navy)}.btn-navy:hover{background:var(--gold)}
.btn-gold-c{background:var(--gold)}.btn-gold-c:hover{background:#9a7219}
.hero{min-height:78vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:4rem 2rem 3.5rem}
.hero-logo{width:min(320px,68vw);height:auto;margin-bottom:1.5rem;
  filter:drop-shadow(0 4px 16px rgba(27,58,107,0.12))}
.hero-slogan{font-family:var(--serif);font-size:clamp(1rem,2.4vw,1.45rem);
  font-weight:400;font-style:italic;color:var(--navy);margin-bottom:1.4rem;letter-spacing:0.05em}
.hero-sub{font-family:var(--body);font-size:1.08rem;font-weight:300;
  color:var(--muted);max-width:420px;line-height:1.75;margin:0 auto 2.4rem}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-gold{font-family:var(--body);font-size:1rem;letter-spacing:0.06em;
  padding:0.75rem 2rem;background:var(--gold);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:background .2s,transform .15s}
.btn-gold:hover{background:#9a7219;transform:translateY(-1px)}
.btn-out{font-family:var(--body);font-size:1rem;letter-spacing:0.06em;
  padding:0.75rem 2rem;background:transparent;color:var(--ink);
  border:1.5px solid var(--border);cursor:pointer;border-radius:2px;
  transition:border-color .2s,color .2s,transform .15s}
.btn-out:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.stats{display:flex;gap:2.5rem;justify-content:center;padding:2.2rem 0;
  flex-wrap:wrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  margin-bottom:3rem}
.stat-n{font-family:var(--serif);font-size:2.2rem;font-weight:300;color:var(--navy);display:block}
.stat-l{font-family:var(--body);font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold)}
.sec{padding:3.5rem 2.5rem;max-width:1240px;margin:0 auto}
.sec-lbl{font-family:var(--body);font-size:0.68rem;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem}
.sec-h{font-family:var(--serif);font-size:2rem;font-weight:400;color:var(--ink);
  margin-bottom:2.2rem;border-bottom:1px solid var(--border);padding-bottom:0.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.4rem}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:1.4rem;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px var(--shadow)}
.card-cover{width:100%;height:140px;object-fit:cover;border-radius:2px;
  margin-bottom:0.8rem;border:1px solid var(--border)}
.c-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem}
.c-orig{font-family:var(--body);font-size:0.74rem;color:var(--muted)}
.c-name{font-family:var(--serif);font-size:1.35rem;font-weight:500;color:var(--ink);
  margin-bottom:0.3rem;line-height:1.2}
.c-year{font-family:var(--body);font-size:0.78rem;color:var(--gold);margin-bottom:0.8rem}
.c-prev{font-family:var(--body);font-size:0.96rem;line-height:1.62;color:var(--muted);flex:1;font-style:italic}
.c-foot{margin-top:1.1rem;padding-top:0.75rem;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.tags{display:flex;gap:0.38rem;flex-wrap:wrap}
.tag{font-size:0.64rem;letter-spacing:0.08em;text-transform:lowercase;
  background:var(--bg);border:1px solid var(--border);color:var(--muted);
  padding:0.1rem 0.42rem;border-radius:1px}
.rlink{font-family:var(--body);font-size:0.78rem;color:var(--navy);
  border:none;background:none;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;transition:color .2s}
.rlink:hover{color:var(--gold)}
.read-full{font-family:var(--body);font-size:0.78rem;letter-spacing:0.08em;
  display:inline-block;margin-top:0.8rem;padding:0.35rem 0.8rem;
  background:var(--navy);color:#fff;border-radius:2px;text-decoration:none;
  transition:background .2s}
.read-full:hover{background:var(--gold)}
.sw{position:relative;max-width:440px;margin-bottom:1.8rem}
.si{width:100%;font-family:var(--body);font-size:0.98rem;
  padding:0.62rem 1rem 0.62rem 2.6rem;background:var(--bg3);
  border:1px solid var(--border);border-radius:2px;color:var(--ink);
  outline:none;transition:border-color .2s}
.si:focus{border-color:var(--gold)}
.sico{position:absolute;left:0.78rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.faq-sec{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.faq-item{border-bottom:1px solid var(--border)}
.faq-item:last-child{border-bottom:none}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:1.1rem 0;background:none;border:none;cursor:pointer;
  font-family:var(--serif);font-size:1.15rem;font-weight:500;color:var(--ink);
  text-align:left;transition:color .2s}
.faq-q:hover{color:var(--gold)}
.faq-icon{font-size:1.3rem;color:var(--gold);flex-shrink:0}
.faq-a{font-family:var(--body);font-size:1rem;line-height:1.75;
  color:var(--muted);padding-bottom:1.2rem;max-width:660px}
.cta{background:var(--navy);color:var(--bg2);padding:4.5rem 2.5rem;text-align:center}
.cta-h1{font-family:var(--serif);font-size:clamp(1.9rem,4.5vw,3rem);font-weight:300;color:#fff;line-height:1.15}
.cta-h2{font-family:var(--serif);font-size:clamp(1.9rem,4.5vw,3rem);font-weight:300;
  font-style:italic;color:var(--gold2);line-height:1.15;margin-bottom:1.8rem}

forme a la normativa de protección de consumidores y usuarios, en su caso."}, {"t": "p", "x": "En caso de que alguna de las disposiciones de este aviso legal sea declarada nula o inaplicable, las demás disposiciones permanecerán en vigor."}]}, "privacidad": {"title": "Política de Privacidad", "blocks": [{"t": "meta", "x": "Última actualización: 3 de agosto de 2026"}, {"t": "h2", "x": "INFORMACIÓN AL USUARIO"}, {"t": "p", "x": "Javier Batlle Vilaseca, como Responsable del Tratamiento, informa que, según lo dispuesto en el Reglamento (UE) 2016/679, de 27 de abril (RGPD), y en la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos y Garantía de los Derechos Digitales (LOPDGDD), tratará sus datos tal y como se refleja en la presente Política de Privacidad."}, {"t": "p", "x": "Esta Política se aplica al tratamiento de datos personales recogidos por Javier Batlle Vilaseca a través de la plataforma Locus Mundi."}, {"t": "h2", "x": "CONTACTO"}, {"t": "ul", "x": ["Titular: Javier Batlle Vilaseca", "NIF: 46117172X", "Correo electrónico: contactlocusmundi@gmail.com", "Domicilio a efectos de notificación: C/ dels Safareigs 7, 08003 Barcelona"]}, {"t": "h2", "x": "PRINCIPIOS APLICADOS AL TRATAMIENTO DE DATOS"}, {"t": "ul", "x": ["Legalidad: solo recopilamos datos personales para fines específicos, explícitos y legítimos.", "Minimización de datos: limitamos la recogida a lo estrictamente necesario para prestar el servicio.", "Limitación de la finalidad: solo tratamos los datos para los fines declarados.", "Precisión: mantenemos los datos exactos y actualizados.", "Seguridad: aplicamos medidas técnicas y organizativas razonables para proteger los datos.", "Acceso y rectificación: el usuario puede acceder o rectificar sus datos en cualquier momento.", "Conservación: los datos se conservan solo mientras sea necesario para los fines para los que se recogieron, salvo las historias autobiográficas publicadas, cuya conservación permanente se rige por las Condiciones de Publicación para Autores.", "Transferencias internacionales: ver apartado específico más abajo."]}, {"t": "h2", "x": "QUÉ DATOS RECOGEMOS"}, {"t": "ul", "x": ["Datos identificativos: nombre, correo electrónico, país, y los datos que el Autor decida incluir voluntariamente en su historia (fecha de nacimiento, lugar de origen, etc.).", "Contenido autobiográfico: el texto, título, subtítulo y fotografías que el Autor decide publicar.", "Datos de navegación: los descritos en la Política de Cookies.", "Datos de pago: gestionados directamente por la pasarela de pago (Stripe), sin que Locus Mundi almacene datos de tarjetas."]}, {"t": "h2", "x": "CON QUÉ FINALIDAD TRATAMOS SUS DATOS"}, {"t": "ul", "x": ["Permitir la creación, publicación y conservación de historias autobiográficas en la plataforma.", "Prestar el servicio de asistencia editorial mediante inteligencia artificial, cuando el usuario active esta función.", "Gestionar el contacto y responder a solicitudes.", "Gestionar los pagos correspondientes a las opciones de pago de la plataforma."]}, {"t": "p", "x": "No utilizamos sus datos para elaborar perfiles ni para fines publicitarios no solicitados."}, {"t": "h2", "x": "TRANSFERENCIAS INTERNACIONALES Y TERCEROS"}, {"t": "p", "x": "Para prestar el servicio, Locus Mundi puede compartir datos con los siguientes encargados del tratamiento:"}, {"t": "ul", "x": ["Vercel Inc. (alojamiento web de la plataforma)", "Supabase (base de datos)", "Anthropic PBC (proveedor de la inteligencia artificial que presta el servicio de asistencia editorial, cuando el Autor activa esta función). Este proveedor tiene su sede en Estados Unidos, por lo que el texto enviado a la IA supone una transferencia internacional de datos. Locus Mundi solo envía a este servicio el texto que el Autor decide someter voluntariamente a revisión o mejora editorial, nunca de forma automática ni sin acción expresa del usuario.", "Stripe (procesador de pagos)"]}, {"t": "p", "x": "No se realizan cesiones de datos a terceros distintas de las aquí descritas, salvo obligación legal."}, {"t": "h2", "x": "LEGITIMACIÓN DEL TRATAMIENTO"}, {"t": "ul", "x": ["Consentimiento del usuario, que puede retirarse en cualquier momento.", "Ejecución de una relación contractual (prestación del servicio de publicación).", "Cumplimiento de una obligación legal."]}, {"t": "h2", "x": "SUS DERECHOS"}, {"t": "p", "x": "Puede ejercer los siguientes derechos en relación con el tratamiento de sus datos personales:"}, {"t": "ul", "x": ["Acceso: obtener confirmación sobre si tratamos sus datos y acceder a ellos.", "Rectificación: corregir datos inexactos o incompletos.", "Supresión: solicitar la eliminación de sus datos cuando ya no sean necesarios para los fines recogidos. *(Para las historias publicadas por Autores, este derecho se ejerce conforme a lo dispuesto en las Condiciones de Publicación para Autores, dado el carácter permanente de la publicación aceptado expresamente al publicar.)*", "Limitación del tratamiento.", "Portabilidad: recibir sus datos en un formato estructurado.", "Oposición."]}, {"t": "p", "x": "Puede ejercer estos derechos escribiendo a contactlocusmundi@gmail.com. También tiene derecho a presentar una reclamación ante la Agencia Española de Protección de Datos (www.aepd.es) si considera que el tratamiento no se ajusta a la normativa vigente."}, {"t": "h2", "x": "MENORES DE EDAD"}, {"t": "p", "x": "Locus Mundi no está dirigido a menores de 14 años. Si un Autor incluye en su historia información o imágenes de menores de edad (por ejemplo, familiares), es responsabilidad del Autor contar con el consentimiento necesario para ello, conforme a lo dispuesto en las Condiciones de Publicación para Autores."}, {"t": "h2", "x": "INFORMACIÓN LEGAL"}, {"t": "p", "x": "Los requisitos de esta Política complementan y no reemplazan cualquier otro requisito existente bajo la legislación de protección de datos aplicable. Esta Política puede ser revisada periódicamente; cualquier cambio relevante se notificará a través del sitio web."}]}, "cookies": {"title": "Política de Cookies", "blocks": [{"t": "meta", "x": "Última actualización: 3 de agosto de 2026"}, {"t": "h2", "x": "DEFINICIÓN DE COOKIE"}, {"t": "p", "x": "Una «cookie» es un pequeño fragmento de texto que los sitios web envían al navegador y que se almacena en el terminal del usuario (ordenador o dispositivo móvil). Permite almacenar y recuperar información sobre la navegación del usuario con el objetivo de mejorar su experiencia en el sitio web."}, {"t": "h2", "x": "COOKIES QUE UTILIZA ACTUALMENTE LOCUS MUNDI"}, {"t": "p", "x": "En este momento, Locus Mundi utiliza únicamente cookies propias de carácter técnico, estrictamente necesarias para el funcionamiento del sitio web (por ejemplo, para recordar que ha aceptado este aviso de cookies). Estas cookies no requieren consentimiento previo conforme a la normativa vigente, al ser imprescindibles para la prestación del servicio."}, {"t": "p", "x": "Locus Mundi no utiliza cookies de terceros con fines publicitarios ni de seguimiento comercial. Si en el futuro se incorpora alguna herramienta de análisis de terceros (por ejemplo, Google Analytics), esta Política se actualizará antes de su activación y se solicitará el consentimiento correspondiente al usuario, tal como exige la normativa."}, {"t": "p", "x": "Estadísticas internas de la plataforma: Locus Mundi podrá mostrar información agregada de interés general, como el número de historias publicadas o su distribución geográfica (por ejemplo, en forma de mapa). Cuando esta información se obtiene mediante contadores agregados y anónimos gestionados directamente en el servidor de Locus Mundi —sin compartirse con terceros ni utilizarse para elaborar perfiles individuales—, puede acogerse a la excepción de informar sin necesidad de solicitar consentimiento previo, conforme a la guía de cookies de la Agencia Española de Protección de Datos (AEPD). Si en algún momento este tipo de estadística se implementa mediante cookies propias con esta finalidad exclusivamente interna, se informará de ello en esta Política."}, {"t": "h2", "x": "CONSENTIMIENTO Y GESTIÓN DE COOKIES"}, {"t": "p", "x": "Al navegar y continuar en el sitio web, el usuario acepta el uso de las cookies técnicas descritas en esta Política."}, {"t": "p", "x": "El usuario puede eliminar las cookies almacenadas en su dispositivo en cualquier momento a través de la configuración de su navegador. Puede consultar cómo hacerlo en los siguientes enlaces:"}, {"t": "ul", "x": ["Chrome: https://support.google.com/chrome/answer/95647?hl=es", "Firefox: https://support.mozilla.org/es/kb/clear-cookies-and-site-data-firefox", "Safari (Mac): https://support.apple.com/es-es/guide/safari/manage-cookies-and-website-data-sfri11471/mac", "Safari (iPhone/iPad): https://support.apple.com/es-es/HT201265", "Edge: https://support.microsoft.com/es-es/help/4468242/microsoft-edge-browsing-data-and-privacy-microsoft-privacy"]}, {"t": "h2", "x": "ACTUALIZACIÓN DE ESTA POLÍTICA"}, {"t": "p", "x": "Javier Batlle Vilaseca se reserva el derecho de modificar esta Política de Cookies para adaptarla a novedades legislativas o a cambios en el funcionamiento del sitio web. Se recomienda revisarla periódicamente."}, {"t": "h2", "x": "CONTACTO"}, {"t": "p", "x": "contactlocusmundi@gmail.com"}]}, "condiciones": {"title": "Condiciones de Publicación para Autores", "blocks": [{"t": "meta", "x": "Última actualización: 3 de agosto de 2026"}, {"t": "p", "x": "Este documento se aplica específicamente a quienes publican una historia autobiográfica en Locus Mundi (en adelante, el «Autor»), y complementa —sin sustituir— el Aviso Legal y la Política de Privacidad generales del sitio. Al abrir un nuevo archivo en la sección \"Escribe tu historia\", el Autor deberá aceptar expresamente estas condiciones antes de poder redactar o publicar contenido, mediante un paso explícito de aceptación (no basta con la navegación general por el sitio, a diferencia del aviso de cookies)."}, {"t": "h2", "x": "1. QUÉ ES LOCUS MUNDI"}, {"t": "p", "x": "Locus Mundi es, básicamente, una plataforma de generación, preservación y publicación de la memoria generacional a nivel global, abierta a las principales lenguas del mundo. A diferencia de una red social o un blog convencional, su propósito no es la publicación temporal o efímera, sino la preservación permanente de las historias familiares y personales que sus Autores decidan confiar a la plataforma."}, {"t": "h2", "x": "2. PERMANENCIA DE LAS HISTORIAS PUBLICADAS"}, {"t": "p", "x": "Toda historia publicada en Locus Mundi permanece publicada de forma permanente por defecto, siendo legible de forma gratuita por cualquier usuario del sitio web. Esta permanencia es un principio central de la plataforma, no una característica accesoria."}, {"t": "p", "x": "Solo el Autor puede contratar la opción de recibir un archivo debidamente formateado para poder imprimir su autobiografía, conforme a las condiciones económicas de la Opción Ilustrada. Esta posibilidad de impresión no altera en ningún caso la disponibilidad gratuita y permanente de la historia en el sitio web."}, {"t": "ul", "x": ["Solo el Autor, debidamente autenticado con su contraseña (y, en su caso, refuerzo mediante pregunta de seguridad), puede solicitar la eliminación de su propia historia.", "Ni los herederos del Autor ni Locus Mundi pueden eliminar una historia por defecto. Esta restricción se ampara en el artículo 96 de la Ley Orgánica 3/2018 (LOPDGDD), que reconoce el derecho de toda persona a dejar instrucciones expresas, en vida, sobre el destino de su contenido digital, restringiendo el acceso o las facultades que de otro modo corresponderían a sus herederos. Al publicar, el Autor deja constancia expresa de su voluntad de que su historia permanezca disponible de forma permanente salvo que él mismo decida lo contrario.", "Excepcionalmente, Locus Mundi podrá retirar contenido sin solicitud del Autor únicamente por causa legal grave y documentada (por ejemplo, contenido ilegal o resolución judicial firme que lo ordene)."]}, {"t": "h2", "x": "3. PROPIEDAD DEL CONTENIDO"}, {"t": "p", "x": "El Autor conserva en todo momento la propiedad intelectual de su historia, textos y fotografías. Al publicar, el Autor concede a Locus Mundi una licencia no exclusiva para alojar, mostrar y conservar dicho contenido en la plataforma, con la finalidad de cumplir el propósito de conservación descrito en este documento. Esta licencia no transfiere la propiedad del contenido a Locus Mundi."}, {"t": "h2", "x": "4. RESPONSABILIDAD SOBRE EL CONTENIDO Y TERCEROS MENCIONADOS"}, {"t": "p", "x": "El Autor es responsable del contenido que publica, y en particular se compromete a:"}, {"t": "ul", "x": ["No publicar información privada de terceros (incluidos familiares vivos) sin su consentimiento.", "Prestar especial atención cuando la historia mencione o incluya cualquier información o imagen de menores de edad, sea o no de naturaleza privada. El Autor declara contar con el consentimiento necesario de quien ejerza la patria potestad o tutela en esos casos.", "Extremar la cautela con las categorías especiales de datos (salud, origen étnico, orientación sexual, creencias religiosas u otra información sensible conforme al art. 9 del RGPD) de cualquier tercero mencionado, que en ningún caso deben publicarse sin el consentimiento explícito de la persona afectada.", "No publicar contenido difamatorio, ilegal o que vulnere derechos de terceros."]}, {"t": "p", "x": "Locus Mundi podrá revisar el contenido antes o después de su publicación para verificar el cumplimiento de estas condiciones, y podrá contactar al Autor si detecta un posible incumplimiento."}, {"t": "h2", "x": "5. CUENTA, AUTENTICACIÓN Y BORRADO"}, {"t": "ul", "x": ["El acceso para redactar, modificar o eliminar una historia se realiza mediante la contraseña personal del Autor, con refuerzo opcional de pregunta de seguridad.", "El Autor es responsable de custodiar sus credenciales de acceso. Locus Mundi dispondrá de un procedimiento de recuperación de acceso para casos de pérdida de contraseña, verificando razonablemente la identidad del solicitante.", "El borrado de una historia por parte del Autor es una acción irreversible."]}, {"t": "h2", "x": "6. NIVELES DE SERVICIO Y ASISTENCIA IA"}, {"t": "ul", "x": ["El Autor puede publicar de forma gratuita (nivel Base) o contratar opciones de pago (Opción Ilustrada, Asistente Editorial). Las condiciones económicas específicas de cada opción se detallarán en el momento de su contratación.", "Si el Autor activa el Asistente Editorial (IA), acepta que el texto que someta voluntariamente a esa función se envíe a un proveedor externo de procesamiento de lenguaje (ver Política de Privacidad), únicamente con la finalidad de recibir sugerencias de mejora, estructura o corrección. El Autor mantiene en todo momento el control final sobre su texto."]}, {"t": "h2", "x": "7. LEGADO DIGITAL"}, {"t": "p", "x": "Locus Mundi reconoce que la naturaleza de este servicio implica pensar en el largo plazo. Mientras el Autor viva, es la única persona con capacidad de modificar o eliminar su historia. Tras su fallecimiento, la historia permanece publicada conforme al principio de permanencia descrito en el apartado 2, salvo que el propio Autor haya dejado instrucciones distintas por escrito y comunicadas a Locus Mundi con anterioridad."}, {"t": "h2", "x": "8. MODIFICACIÓN DE ESTAS CONDICIONES"}, {"t": "p", "x": "Locus Mundi podrá actualizar estas condiciones para adaptarlas a cambios normativos o del propio servicio. Los cambios que afecten a la esencia del principio de permanencia (apartado 2) no se aplicarán retroactivamente a las historias ya publicadas sin el consentimiento expreso del Autor afectado."}, {"t": "h2", "x": "CONTACTO"}, {"t": "p", "x": "contactlocusmundi@gmail.com"}]}, "contacto": {"title": "Contacto", "blocks": [{"t": "p", "x": "Locus Mundi Plataforma de generación, preservación y publicación de la memoria generacional a nivel global"}, {"t": "p", "x": "Web: locusmundi.com Correo electrónico: contactlocusmundi@gmail.com"}, {"t": "p", "x": "Titular: Javier Batlle Vilaseca NIF: 46117172X Domicilio a efectos de notificación: C/ dels Safareigs 7, 08003 Barcelona"}, {"t": "p", "x": "Para cualquier consulta, sugerencia, incidencia técnica o ejercicio de sus derechos en materia de protección de datos, puede escribirnos al correo electrónico indicado. Intentaremos responder a la mayor brevedad posible."}]}};

  { id:1, name:"Irene Vilaseca Fructuoso", title:"Recuerdos de mi familia", born:1932, country:"España", flag:"🇪🇸", lang:"ES",
    preview:"Hoy he dormido en Sant Feliu de Codines porque quería celebrar mis 70 años aquí...",
    text:"ÍNDICE:\nI: Unas cuantas bombas para romper el hielo\nII: Comienza la historia familiar\nIII: Joan Vilaseca y los diarios de la familia\nIV: Los Segalés, otra familia que viene de antiguo\nV: Mis abuelos\nVI: Hacia Santa Coloma\nVII: Recuerdos del tío José\nVIII: Continúa el avi el relato de su vida\nIX: La salud de mi padre y otras batallas\nX: La nueva familia se abre camino\nXI: Los últimos años\nXII: La familia de mi madre: los Fructuoso\napendice: ¿Y qué fue de la vida de Irene?\n\n— — —\n\nHoy he dormido en Sant Feliu de Codines porque quería celebrar mis 70 años aquí. En la mañana del 25 de octubre, mi aniversario, me he asomado al balcón de casa para disfrutar una vez más del espléndido paisaje que se aprecia desde esta altura. Hay un extenso valle por el que serpentea un riachuelo junto a una montaña basáltica a la que llamamos «la roca pelada». Se puede divisar abajo y tranquilo el pueblo de Riells del Fai. Y al otro lado del valle, frente a mí, hay una antigua masía llamada El Villar. No muy lejos de allí se encuentra una pequeña ermita en cuyo altar la Virgen amamanta al niño, por eso se la llama «La Virgen de la Leche».\n\nA esta roca había ido de niña muchas veces de excursión, y de mayor, con grupos de amigos, en noches de luna llena, íbamos a comer allí sandías. Este es el paisaje que me ha acompañado en los largos veranos de tres meses a lo largo de mi vida.\n\nMuchos recuerdos afloran en mi mente. Parece que fue ayer cuando un día, al volver del colegio, le dije a mi madre que estaba harta de hacer cada día lo mismo. Debía yo tener entonces unos 14 años. Mi madre me miró sonriente y me contestó, sin inmutarse, que la niñez también pasa y cuando fuera mayor y tuviera mi propia familia, me daría cuenta de la velocidad con la que pasan los años.\n\nSi la tuviese ahora delante, le diría cuánta razón tenía; que, sin darme cuenta, apenas un respiro, he llegado a este punto, algo que entonces me parecía inimaginable. Es tiempo pues de poner en claro los recuerdos y contaros mi historia. Bueno, nuestra historia: la historia de la familia.", fullUrl:"irene-vilaseca.html", tags:["Barcelona","historia familiar","memoria"] },
  { id:2, name:"Olegario Sotelo Blanco", title:"O neno pastor que venceu o lobo", born:1938, country:"España", flag:"🇪🇸", lang:"GL",
    preview:"Érguete, neno. Xa fun á fonte por un cántaro de auga...",
    text:"ÍNDICE:\ncap-I: Un pastor de Quintela\ncap-II: Primeiros traballos en Barcelona e o servizo militar\ncap-III: Regreso a Barcelona\ncap-IV: Unha afronta xudicial\ncap-V: Sotelo Blanco Edicións\ncap-VI: O cancro\ncap-VII: Escritos\ncap-VIII: Tempo de lecer e viaxar\ncap-IX: O Centro Galego de Barcelona\ncap-X: Outros emprendementos\ncap-XI: «Amigos, coñecidos e saudados»\ncap-XII: Diario de pandemia\ncap-XIII: Álbum de familia\ncap-XIV: Co país ao lombo\ncap-XV: Unha vida na maleta\n\n— — —\n\n–Érguete, neno. Xa fun á fonte por un cántaro de auga. Hoxe hai que lavarse porque vai ser o teu primeiro día de escola e a señorita mestra dixo que tiñas que ir ben limpo –dime a miña nai ben cedo un día de outono.\n\nA auga na cunca estaba fría, pero o aseo facíao só porque xa tiña cinco anos, así que me lavei ben rápido. Cun pantalón curto, a camisa de estrea que me fixera a costureira Jovita e unhas galochas novas que me mordían os dedos dos pés, corrín cara á cociña para almorzar.\n\nToño, que era un ano máis vello e xa ía á escola, explicoume que debía poñer na galocha dereita tres cravos na punta. Así, se algún rapaz se metía comigo, podía bourarlle na canela con esa galocha.\n\n–Por que teño que ir á escola? Non me sorprendeu ver a Jovita sentada á mesa. De cando en vez viña coa súa máquina de coser ao lombo e pasaba unsdías na casa remendando e facendo roupa para a familia. As teas xa as mercara a miña nai no comercio do Xosé María no Castro, que lle fiaba porque se coñecían dende nenos.\n\nJovita dicíame que os nenos debían de ir á escola para aprender moitas cousas e facer amigos. E faloume de rapaces que xa coñecía da misa. Lembrei cando ás noites, a carón do lume da lareira, os pais falaban dos veciños das cinco aldeas da parroquia: cantos fillos tiña cada matrimonio, se eran ricos ou pobres… E despois de facer os meus primeiros cálculos, malia non saber aritmética, decidín poñer catro cravos na miña galocha.\n\nA miña nai levoume ese primeiro día á escola e presentoume á señorita mestra, que só falaba castelán. Sentín moita estrañeza, porque eu unicamente coñecía a lingua dos meus pais. De que xeito podería aprender «moitas cousas» se non entendía o que falaban?", fullUrl:"olegario-sotelo.html", tags:["Galicia","emigración","memoria"] },
  { id:3, name:"Pablo Cava Domínguez", title:"Historia de mi vida", born:1944, country:"España", flag:"🇪🇸", lang:"ES",
    preview:"Antes de empezar a contar mi vida, quiero decir algo con sinceridad...",
    text:"ÍNDICE:\nIntroducción: El porqué de estas páginas\nCapítulo 1: Nacimiento de Pablito\nCapítulo 2: Un pínfano llamado Pablo Cava Domínguez\nCapítulo 3: Mi padre Jacinto\nCapítulo 4: La familia de mi padre\nCapítulo 5: Navidades de 1951\nCapítulo 6: Segovia: 1954\nCapítulo 7: Años 1954–1955\nCapítulo 8: Hemos llegado a Murcia: 1955\nCapítulo 9: Manuel Cava, mi tutor: 1962\nCapítulo 10: Verano de 1964\nCapítulo 11: Años 1960–1962\nCapítulo 12: La muerte de mi madre\nCapítulo 13: Campeonato Nacional de Atletismo (1958)\nCapítulo 14: El destino (1959)\nCapítulo 15: Navidades de 1963\nCapítulo 16: Los señores Remigio (1963–1964)\nCapítulo 17: Visita a mi tía Rosa en Barcelona (1964)\nCapítulo 18: Alsasua, Navarra (1964)\nCapítulo 19: Amor a primera vista (Alsasua, 1964)\nCapítulo 20: Un encargo inesperado en Valladolid\nCapítulo 21: La mili (1965)\nCapítulo 22: Licenciado (el 15 de diciembre de 1967), pero…\nCapítulo 23: De Alcántara a Barcelona (1967)\nCapítulo 24: Visita a un compañero de colegio (1967)\nCapítulo 25: Tres trabajos, un pínfano y un currante nato (1969)\nCapítulo 26: Diseñando circuitos impresos y mi futuro\nCapítulo 27: Verano en Estartit\nCapítulo 28: El señor Pajarito y la caída de DIGIPLOT\nCapítulo 29: Juan Belmonte (1980)\nCapítulo 30: Historia de mi vida (Yako)\nCapítulo 31: Carta a Chencha\nCapítulo 32: Pharmispania y la piscina: últimos años de trabajo\nCapítulo 33: Ruta extremeña con mi hijo\nCapítulo 34: Pinfanada en Valladolid\nAnexos: Sobre DIGIPLOT y la herida invisible\nPostdata: Familia futbolera – Can Barça\n\n— — —\n\nAntes de empezar a contar mi vida, quiero decir algo con sinceridad: nunca he sido un hombre de leer muchos libros, y menos aún de escribirlos. Pero son tantas las cosas que quiero dejar por escrito, que sé que algunas quedarán pendientes para otra ocasión.\n\nHe decidido no hablar de vivencias relacionadas con mi mujer, Ramona –fallecida el 26 de febrero de 2024– ni con mis hijos. Ellos forman parte de mi intimidad y quiero respetar su privacidad. Lo que sí puedo asegurar es que todo lo que aquí cuento es real. Son sucesos que viví, que me marcaron y que han influido en mi forma de ser a lo largo de toda mi vida.\n\nEn 1943 se formalizó en España el Patronato de Huérfanos del Ejército. Se crearon centros de enseñanza para acoger a los hijos de militares fallecidos por cualquier circunstancia. Para las viudas o familiares que tenían a su cargo a esos niños, no suponía ningún gasto económico. Ese Patronato formó parte esencial de mi historia.\n\nEste libro va dedicado a mi madre, Francisca Domínguez Miranda, que no tuvo la suerte de disfrutar de la vida como cualquier cristiano merece. Fue una madre luchadora, que se sacrificó por sus hijos. Un derrame cerebral apagó la luz de su vida cuando por fin podía empezar a disfrutar de nosotros. Mamá: te quise mucho y te sigo queriendo. D.E.P.\n\nTambién va dedicado a mi padre, Jacinto Cava González. Se fue demasiado pronto. Yo, Pablito, tenía solo dieciocho meses y no pude conocerlo. Mi madre me habló mucho de él: que era muy bueno. A veces ser tan bueno no es bueno. Él se dejó llevar por esa bondad, aun estando delicado de salud. No le guardo rencor. Amaba su profesión y eso le hizo decir que sí cuando no debía. D.E.P.\n\nAntes de seguir, quiero presentar a mis padres con un recuerdo cariñoso.", fullUrl:"pablo-cava.html", tags:["Extremadura","traición","memoria"] },
  { id:4, name:"X. Batlle", title:"La vida escrita", born:1961, country:"España", flag:"🇪🇸", lang:"CA",
    preview:"Este no va a ser un relato escrito a lo largo, sino hacia el fondo de mí mismo...",
    text:"ÍNDICE:\nPresentación: De Barcelona al mundo\nÁlbum de familia: 1998\nEl nuevo mundo: 2001\nCelebración del medio siglo: 2011\nEl año de la pandemia: 2020\nRoda al món i torna al Born: 2025\nDespedida: La guinda del pastel\n\n— — —\n\nEste no va a ser un relato escrito a lo largo, sino hacia el fondo de mí mismo. Podría decirse que nací en una cuna dorada (un siglo en paz, una ciudad hermosa que bebe en las aguas del Mediterráneo, familia acomodada) y que nada me faltó, porque a mi cuerpo bien nutrido y mejor educado, mis padres y el resto de mi familia le añadieron ideas y sueños. Quizá demasiados sueños. Algo me faltó siempre.\n\nDos amigos de juventud me han acompañado toda la vida: Imanol Lizarralde, otro «espíritu contemplativo» desubicado y lletraferit como yo, y Toni Alastuey, un «hombre de acción» cuyo aprecio y fortaleza me permitieron conocer aquello que era incapaz de vislumbrar con mis propios ojos.\n\nEstudié Filosofía y mi formación me permitió trabajar en una editorial (Ronsel, fundada por Olegario Sotelo Blanco) durante quince años, publicando a Dickens, Saramago y también a autores noveles como Miguel Herráez, Miguel Catalán o Asdrúbal Hernández, que con el paso de los años se convirtieron en amigos.\n\nEn ese momento de crecimiento personal nacieron mis dos hijos (Carlos y Àlex), y comencé a sufrir las primeras orfandades, lo que anunciaba un cambio de ciclo. Poco después de cumplir los cuarenta, me divorcié y mi vida se partió en dos. Dejé entonces mi trabajo, mi ciudad, mi pasado y salté al vacío.\n\nPor desgracia, a mí nunca me cuadraron las palabras de mi abuelo paterno: «¿Y cómo queréis que me haga rico si me paso el día trabajando?». Yo me paso el día pensando, imaginando, también escribiendo, y eso no da ni para ser pobre.", fullUrl:"javier-batlle.html", tags:["Barcelona","poesía","memoria"] },
];

async function callAI(system, userMsg) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000,
      system, messages:[{role:"user",content:userMsg}] })
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.content[0].text;
}

function FaqItem({q,a}) {
  const [open,setOpen]=useState(false);
  return (
    <div className="faq-item">
      <button className="faq-q" onClick={()=>setOpen(o=>!o)}>
        <span>{q}</span><span className="faq-icon">{open?"−":"+"}</span>
      </button>
      {open&&<div className="faq-a">{a}</div>}
    </div>
  );
}

function AutoCard({a,onClick,t}) {
  return (
    <div className="card fu" onClick={onClick}>
      {a.cover&&<img src={a.cover} className="card-cover" alt={a.title||a.name}/>}
      <div className="c-meta"><span className="c-orig">{a.flag} {a.country}</span></div>
      <div className="c-name">{a.title||a.name}</div>
      {a.title&&<div style={{fontFamily:"var(--body)",fontSize:"0.92rem",fontWeight:"700",color:"var(--ink)",marginTop:"-0.2rem",marginBottom:"0.3rem"}}>{a.name}</div>}

function Write({setView,onPublish,t,onLegal}) {
  const [f,setF]=useState({name:"",born:"",country:"",lang:"ES",title:"",subtitle:"",text:"",coverImg:null});
  const [ao,setAo]=useState("");const [al,setAl]=useState(false);const [am,setAm]=useState("");
  const [tl,setTl]=useState("EN");const [pub,setPub]=useState(false);
  const [showPM,setShowPM]=useState(false);const [isPrem,setIsPrem]=useState(false);
  const [acceptTerms,setAcceptTerms]=useState(false);
  const up=(k,v)=>setF(p=>(({...p,[k]:v})));
  const run=async(mode)=>{
    if(!f.text.trim()&&mode!=="structure")return;
    setAl(true);setAm(mode);setAo("");
    const ln=LANGS_UI.find(l=>l.code===tl)?.label||tl;
    try{
      let sys="",msg="";
      if(mode==="continue"){sys="Eres un asistente de escritura autobiográfica. Continúa el texto respetando voz, idioma y estilo. Solo la continuación.";msg="Continúa:\n\n"+f.text;}
      else if(mode==="improve"){sys="Eres un editor literario. Mejora este texto haciéndolo más evocador sin cambiar la voz. Solo el texto mejorado.";msg=f.text;}
      else if(mode==="translate"){sys="Eres un traductor literario. Traduce al "+ln+" preservando la voz personal. Solo la traducción.";msg=f.text;}
      else if(mode==="structure"){sys="Eres un editor amable. Sugiere estructura y temas para esta autobiografía. Sé conciso.";msg=f.text||"Nombre: "+f.name+". País: "+f.country+". Año: "+f.born+".";}
      setAo(await callAI(sys,msg));
    }catch(e){setAo("Error.");}
    setAl(false);
  };
  const apply=()=>{if(am==="improve"||am==="translate")up("text",ao);else if(am==="continue")up("text",f.text+"\n\n"+ao);setAo("");};
  const publish=()=>{
    if(!f.name||!f.text)return;
    onPublish({id:Date.now(),name:f.name,born:parseInt(f.born)||0,country:f.country||"—",
      flag:"✍️",lang:f.lang,title:f.title||f.name,subtitle:f.subtitle||"",
      cover:f.coverImg||null,preview:f.text.slice(0,88)+"...",text:f.text,tags:["nueva historia"]});
    setPub(true);
  };
  return (
    <div className="wr-wrap">
      {showPM&&<PremiumModal onClose={()=>setShowPM(false)} onPaid={()=>{setIsPrem(true);setShowPM(false);}} t={t}/>}
      <button className="back" onClick={()=>setView("home")}>{t.back_home}</button>
      <div className="wr-grid">
        <div>
          <h2 className="wr-h">{t.write_h}</h2>
          <p className="wr-sub">{t.write_sub}</p>
          <div className="fld"><label className="lbl">{t.f_title}</label><input className="inp" placeholder={t.f_title_ph} value={f.title} onChange={e=>up("title",e.target.value)}/></div>
          <div className="fld"><label className="lbl">{t.f_subtitle}</label><input className="inp" placeholder={t.f_subtitle_ph} value={f.subtitle} onChange={e=>up("subtitle",e.target.value)}/></div>
          <div className="pol-box">
            <div className="pol-tit">{t.policy_tit}</div>
            <ul className="pol-li"><li>{t.pol1}</li><li>{t.pol2}</li><li>{t.pol3}</li><li>{t.pol4}</li></ul>
            <label style={{display:"flex",alignItems:"flex-start",gap:"0.5rem",marginTop:"0.8rem",paddingTop:"0.8rem",borderTop:"1px solid var(--border)",cursor:"pointer",fontFamily:"var(--body)",fontSize:"0.8rem",color:"var(--ink)",lineHeight:1.5}}>
              <input type="checkbox" checked={acceptTerms} onChange={e=>setAcceptTerms(e.target.checked)} style={{marginTop:"0.2rem"}}/>
              <span>{t.accept_terms_pre} <span style={{color:"var(--gold)",textDecoration:"underline",cursor:"pointer"}} onClick={(e)=>{e.preventDefault();onLegal();}}>{t.accept_terms_link}</span></span>
            </label>
          </div>
          <div className="frow">
            <div className="fld"><label className="lbl">{t.f_name}</label><input className="inp" placeholder={t.f_name_ph} value={f.name} onChange={e=>up("name",e.target.value)}/></div>
            <div className="fld"><label className="lbl">{t.f_born}</label><input className="inp" type="number" placeholder="Ej. 1960" value={f.born} onChange={e=>up("born",e.target.value)}/></div>
          </div>
          <div className="frow">
            <div className="fld"><label className="lbl">{t.f_country}</label><input className="inp" value={f.country} onChange={e=>up("country",e.target.value)}/></div>
            <div className="fld"><label className="lbl">{t.f_lang}</label><select className="inp" value={f.lang} onChange={e=>up("lang",e.target.value)}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select></div>
          </div>
          <div className="fld">
            <label className="lbl">{t.f_cover}</label>
            <div style={{display:"flex",alignItems:"center",gap:"0.8rem",flexWrap:"wrap"}}>
              <label style={{fontFamily:"var(--body)",fontSize:"0.88rem",padding:"0.45rem 1rem",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"2px",cursor:"pointer",color:"var(--navy)"}}>
                {t.f_cover_btn}
                <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>up("coverImg",ev.target.result);r.readAsDataURL(file);}}/>
              </label>
              {f.coverImg&&<img src={f.coverImg} alt="portada" style={{height:"60px",width:"auto",borderRadius:"2px",border:"1px solid var(--border)"}}/>}
              <span style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)"}}>{t.f_cover_note}</span>
            </div>
          </div>
          <div className="fld">
            <label className="lbl">{t.f_text}</label>
            <div style={{display:"flex",gap:"0.5rem",marginBottom:"0.5rem",flexWrap:"wrap",alignItems:"center"}}>
              <button type="button" className="toolbar-btn" onClick={()=>up("text",f.text+"\n\n[Capítulo] Título del capítulo\n\n")}>+ Capítulo</button>
              <span style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)"}}>Gratuito</span>
            </div>
            <textarea className="ta" placeholder={t.f_text_ph} value={f.text} onChange={e=>up("text",e.target.value)}/>
          </div>
          <div className="pub-row">
            <button className="btn-pub" onClick={publish} disabled={!f.name||!f.text||!acceptTerms}>{t.publish}</button>
            <button className="btn-out" onClick={()=>!isPrem?setShowPM(true):null}>📄 PDF {isPrem?"":"✦"}</button>
            {pub&&<span className="ok-msg">{t.published_ok}</span>}
          </div>
        </div>
        <div className="aip">
          <div className="aip-h"><span style={{color:"var(--gold)"}}>✦</span> {t.ai_h}</div>
          <p className="aip-sub">{t.ai_sub}</p>
          <div className="ai-btns">
            <button className="aib" disabled={al} onClick={()=>run("continue")}><span>→</span><span><b>{t.ai_continue}</b> — {t.ai_continue_d}</span></button>
            <button className="aib" disabled={al} onClick={()=>run("improve")}><span>✦</span><span><b>{t.ai_improve}</b> — {t.ai_improve_d}</span></button>
            <button className="aib" disabled={al} onClick={()=>run("structure")}><span>◈</span><span><b>{t.ai_structure}</b> — {t.ai_structure_d}</span></button>
          </div>
          <hr className="sep"/>
          <div className="tr-row2">
            <span className="tr-lbl">{t.translate_to}</span>
            <select className="sel" style={{flex:1}} value={tl} onChange={e=>setTl(e.target.value)}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select>
            <button className="btn-sm" disabled={al} onClick={()=>run("translate")}>{t.go}</button>
          </div>
          {al&&<div className="loading"><span className="sp"/>{t.ai_thinking}</div>}
          {ao&&!al&&(<div><div className="ai-out-lbl">{t.proposal}</div><div className="ai-out">{ao}</div>{(am==="continue"||am==="improve"||am==="translate")&&<button className="apply-btn" onClick={apply}>{am==="continue"?t.add_text:t.replace_text}</button>}</div>)}
          <div className="pm-box">
            <div className="pm-tit">{t.pub_opts}</div>
            <div className="pm-row">
              <div className="pm-feat"><span className="pm-feat-t">{t.unlimited_text}</span><span className="badge free">{t.free}</span></div>
              <div className="pm-feat"><span className="pm-feat-t">{t.one_img}</span><span className="badge free">{t.free}</span></div>
            </div>
            <div style={{marginTop:"0.6rem",padding:"0.7rem 0.8rem",background:"var(--bg2)",border:"1px solid var(--gold)",borderRadius:"2px"}}>
              <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--gold)",fontWeight:"600",marginBottom:"0.4rem",textTransform:"uppercase",letterSpacing:"0.12em"}}>Opción Ilustrada</div>
              <div className="pm-row">
                <div className="pm-feat"><span className="pm-feat-t">{t.ten_img}</span><span className={`badge ${isPrem?"on":"prem"}`}>{isPrem?t.active:t.premium}</span></div>
                <div className="pm-feat"><span className="pm-feat-t">{t.pdf_dl}</span><span className={`badge ${isPrem?"on":"prem"}`}>{isPrem?t.active:t.premium}</span></div>
              </div>
              {!isPrem&&<button className="pm-unlock" onClick={()=>setShowPM(true)}>{t.unlock}</button>}
            </div>
            <div style={{marginTop:"0.6rem",padding:"0.7rem 0.8rem",background:"var(--bg2)",border:"1px solid var(--navy)",borderRadius:"2px"}}>
              <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--navy)",fontWeight:"600",marginBottom:"0.2rem",textTransform:"uppercase",letterSpacing:"0.12em"}}>{t.ai_sub_label}</div>
              <div style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)",marginBottom:"0.4rem"}}>{t.ai_sub_note}</div>
              <button className="pm-unlock" style={{borderColor:"var(--navy)",color:"var(--navy)"}} onClick={()=>alert("Próximamente · Coming soon")}>€4,99/mes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Footer({t,onContact,onLegal,onCollab}) {
  return (
    <footer className="foot">
      <img src={LOGO_SMALL} alt="Locus Mundi"/>
      <div className="foot-links">
        <span className="foot-lnk" onClick={onCollab}>{t.foot_collab}</span>
        <span className="foot-lnk" onClick={()=>onLegal("aviso")}>{t.foot_aviso}</span>
        <span className="foot-lnk" onClick={()=>onLegal("privacidad")}>{t.foot_privacidad}</span>
        <span className="foot-lnk" onClick={()=>onLegal("cookies")}>{t.foot_cookies}</span>
        <span className="foot-lnk" onClick={()=>onLegal("condiciones")}>{t.foot_condiciones}</span>
        <span className="foot-lnk" onClick={onContact}>{t.foot_contact}</span>
      </div>
      <p style={{fontFamily:"var(--body)",fontSize:"0.8rem",color:"var(--muted)",maxWidth:"460px",lineHeight:1.6,textAlign:"center"}}>{t.foot_policy}</p>
      <div className="foot-copy">locusmundi.com · {new Date().getFullYear()}</div>
    </footer>
  );
}

function App() {
  const [lang,setLang]=useState(()=>{const bl=(navigator.language||"es").slice(0,2).toUpperCase();return bl==="EN"?"EN":"ES";});
  const t=T[lang];
  const [view,setView]=useState("home");
  const [sel,setSel]=useState(null);
  const [autos,setAutos]=useState(SAMPLE);
  const [showContact,setShowContact]=useState(false);
  const [showLegal,setShowLegal]=useState(null);
  const [showCollab,setShowCollab]=useState(false);
  const [cookieOk,setCookieOk]=useState(false);
  const open=(a)=>{setSel(a);setView("read");};
  return (
    <div>
      <Header view={view} setView={setView} lang={lang} setLang={setLang} t={t}/>
      {view==="home"&&<Home autos={autos} openAuto={open} setView={setView} t={t}/>}
      {view==="library"&&<Library autos={autos} openAuto={open} t={t}/>}
      {view==="read"&&<Read auto={sel} setView={setView} t={t}/>}
      {view==="write"&&<Write setView={setView} onPublish={a=>{setAutos(p=>[...p,a]);setView("library");}} t={t} onLegal={()=>setShowLegal("condiciones")}/>}
      <Footer t={t} onContact={()=>setShowContact(true)} onLegal={setShowLegal} onCollab={()=>setShowCollab(true)}/>
      {showContact&&<ContactModal onClose={()=>setShowContact(false)} t={t}/>}
      {showLegal&&<LegalModal docKey={showLegal} onClose={()=>setShowLegal(null)} t={t} lang={lang}/>}
      {showCollab&&<CollaborateModal onClose={()=>setShowCollab(false)} t={t} lang={lang}/>}
      {!cookieOk&&<div className="cookie-bar"><span className="cookie-msg">{t.cookie_msg}</span><button className="cookie-btn" onClick={()=>setCookieOk(true)}>{t.cookie_ok}</button></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
