<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Locus Mundi — Archivo vivo de la humanidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A6B;--gold:#C4932A;--gold2:#E8B84B;
  --bg:#EDE0C4;--bg2:#F7F0E0;--bg3:#FBF7EE;--ink:#1A0E07;
  --muted:#7A6248;--border:#C8B480;--shadow:rgba(27,58,107,0.10);
  --serif:'Cormorant Garamond',Georgia,serif;--body:'Crimson Pro',Georgia,serif;
}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;
  background-image:linear-gradient(rgba(27,58,107,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,58,107,0.04) 1px,transparent 1px);
  background-size:64px 64px}
.notice{background:var(--navy);color:rgba(255,255,255,0.9);text-align:center;
  padding:0.6rem 1.5rem;font-family:var(--serif);font-size:0.95rem;
  letter-spacing:0.22em;text-transform:uppercase}
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;
  justify-content:space-between;padding:0 2.5rem;height:70px;
  background:rgba(237,224,196,0.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border)}
.logo-name{font-family:var(--serif);font-size:1.4rem;font-weight:600;
  letter-spacing:0.14em;color:var(--ink);text-transform:uppercase;cursor:pointer}
nav{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.nl{font-family:var(--body);font-size:0.9rem;color:var(--muted);cursor:pointer;
  border:none;background:none;transition:color .2s;padding:0.2rem 0;
  border-bottom:1.5px solid transparent}
.nl:hover,.nl.on{color:var(--ink);border-bottom-color:var(--gold)}
.lang-tog{display:flex;border:1px solid var(--border);border-radius:2px;overflow:hidden}
.lang-btn{font-family:var(--body);font-size:0.76rem;padding:0.28rem 0.55rem;
  background:transparent;color:var(--muted);border:none;cursor:pointer;transition:background .15s,color .15s}
.lang-btn.on{background:var(--navy);color:#fff}
.btn-pri{font-family:var(--body);font-size:0.86rem;letter-spacing:0.05em;
  padding:0.48rem 1.1rem;color:#fff;border:none;cursor:pointer;border-radius:2px;transition:background .2s}
.btn-navy{background:var(--navy)}.btn-navy:hover{background:var(--gold)}
.btn-gold-c{background:var(--gold)}.btn-gold-c:hover{background:#9a7219}
.hero{min-height:78vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:4rem 2rem 3.5rem}
.hero-logo{width:min(320px,68vw);height:auto;margin-bottom:1.5rem;
  filter:drop-shadow(0 4px 16px rgba(27,58,107,0.12))}
.hero-slogan{font-family:var(--serif);font-size:clamp(1rem,2.4vw,1.45rem);
  font-weight:400;font-style:italic;color:var(--navy);margin-bottom:1.4rem;letter-spacing:0.05em}
.hero-sub{font-family:var(--body);font-size:1.08rem;font-weight:300;
  color:var(--muted);max-width:420px;line-height:1.75;margin:0 auto 2.4rem}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-gold{font-family:var(--body);font-size:1rem;letter-spacing:0.06em;
  padding:0.75rem 2rem;background:var(--gold);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:background .2s,transform .15s}
.btn-gold:hover{background:#9a7219;transform:translateY(-1px)}
.btn-out{font-family:var(--body);font-size:1rem;letter-spacing:0.06em;
  padding:0.75rem 2rem;background:transparent;color:var(--ink);
  border:1.5px solid var(--border);cursor:pointer;border-radius:2px;
  transition:border-color .2s,color .2s,transform .15s}
.btn-out:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.stats{display:flex;gap:2.5rem;justify-content:center;padding:2.2rem 0;
  flex-wrap:wrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  margin-bottom:3rem}
.stat-n{font-family:var(--serif);font-size:2.2rem;font-weight:300;color:var(--navy);display:block}
.stat-l{font-family:var(--body);font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold)}
.sec{padding:3.5rem 2.5rem;max-width:1240px;margin:0 auto}
.sec-lbl{font-family:var(--body);font-size:0.68rem;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem}
.sec-h{font-family:var(--serif);font-size:2rem;font-weight:400;color:var(--ink);
  margin-bottom:2.2rem;border-bottom:1px solid var(--border);padding-bottom:0.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.4rem}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:1.4rem;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px var(--shadow)}
.card-cover{width:100%;height:160px;object-fit:cover;border-radius:2px;margin-bottom:1rem;border:1px solid var(--border)}
.read-full{font-family:var(--body);font-size:0.78rem;letter-spacing:0.08em;
  display:inline-block;margin-top:0.8rem;padding:0.35rem 0.8rem;
  background:var(--navy);color:#fff;border-radius:2px;text-decoration:none;
  transition:background .2s}
.read-full:hover{background:var(--gold)}
.c-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem}
.c-orig{font-family:var(--body);font-size:0.74rem;color:var(--muted)}
.c-lang{font-family:var(--body);font-size:0.62rem;letter-spacing:0.12em;
  background:var(--bg);border:1px solid var(--border);color:var(--muted);
  padding:0.1rem 0.38rem;border-radius:2px}
.c-name{font-family:var(--serif);font-size:1.35rem;font-weight:500;color:var(--ink);
  margin-bottom:0.3rem;line-height:1.2}
.c-year{font-family:var(--body);font-size:0.78rem;color:var(--gold);margin-bottom:0.8rem}
.c-prev{font-family:var(--body);font-size:0.96rem;line-height:1.62;color:var(--muted);flex:1;font-style:italic}
.c-foot{margin-top:1.1rem;padding-top:0.75rem;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.tags{display:flex;gap:0.38rem;flex-wrap:wrap}
.tag{font-size:0.64rem;letter-spacing:0.08em;text-transform:lowercase;
  background:var(--bg);border:1px solid var(--border);color:var(--muted);
  padding:0.1rem 0.42rem;border-radius:1px}
.rlink{font-family:var(--body);font-size:0.78rem;color:var(--navy);
  border:none;background:none;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;transition:color .2s}
.rlink:hover{color:var(--gold)}
.sw{position:relative;max-width:440px;margin-bottom:1.8rem}
.si{width:100%;font-family:var(--body);font-size:0.98rem;
  padding:0.62rem 1rem 0.62rem 2.6rem;background:var(--bg3);
  border:1px solid var(--border);border-radius:2px;color:var(--ink);
  outline:none;transition:border-color .2s}
.si:focus{border-color:var(--gold)}
.sico{position:absolute;left:0.78rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.faq-sec{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.faq-item{border-bottom:1px solid var(--border)}
.faq-item:last-child{border-bottom:none}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:1.1rem 0;background:none;border:none;cursor:pointer;
  font-family:var(--serif);font-size:1.15rem;font-weight:500;color:var(--ink);
  text-align:left;transition:color .2s}
.faq-q:hover{color:var(--gold)}
.faq-icon{font-size:1.3rem;color:var(--gold);flex-shrink:0}
.faq-a{font-family:var(--body);font-size:1rem;line-height:1.75;
  color:var(--muted);padding-bottom:1.2rem;max-width:660px}
.cta{background:var(--navy);color:var(--bg2);padding:4.5rem 2.5rem;text-align:center}
.cta-ol{font-family:var(--body);font-size:0.75rem;letter-spacing:0.28em;
  text-transform:uppercase;color:var(--gold2);margin-bottom:1.1rem}
.cta-h1{font-family:var(--serif);font-size:clamp(1.9rem,4.5vw,3rem);font-weight:300;color:#fff;line-height:1.15}
.cta-h2{font-family:var(--serif);font-size:clamp(1.9rem,4.5vw,3rem);font-weight:300;
  font-style:italic;color:var(--gold2);line-height:1.15;margin-bottom:1.8rem}
.cta-p{font-family:var(--body);font-size:1.1rem;color:rgba(247,240,224,0.78);
  margin-bottom:2.2rem;line-height:1.78;max-width:540px;margin-left:auto;margin-right:auto}
.read-wrap{max-width:680px;margin:0 auto;padding:3.5rem 2rem}
.back{font-family:var(--body);font-size:0.84rem;letter-spacing:0.1em;
  color:var(--muted);border:none;background:none;cursor:pointer;
  display:flex;align-items:center;gap:0.4rem;margin-bottom:2.5rem;transition:color .2s}
.back:hover{color:var(--gold)}
.r-orig{font-family:var(--body);font-size:0.76rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.65rem}
.r-name{font-family:var(--serif);font-size:clamp(1.8rem,4.5vw,2.8rem);
  font-weight:400;line-height:1.1;color:var(--ink);margin-bottom:0.45rem}
.r-meta{font-family:var(--body);font-size:0.86rem;color:var(--muted);
  margin-bottom:2.2rem;padding-bottom:1.8rem;border-bottom:1px solid var(--border)}
.r-body{font-family:var(--body);font-size:1.15rem;line-height:1.82;color:var(--ink)}
.r-body p{margin-bottom:1.3em}
.tr-bar{margin-top:2.5rem;padding:1.4rem;background:var(--bg3);
  border:1px solid var(--border);border-radius:3px}
.tr-tit{font-family:var(--body);font-size:0.74rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem}
.tr-row{display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap}
.sel{font-family:var(--body);font-size:0.9rem;padding:0.45rem 0.72rem;
  border:1px solid var(--border);background:var(--bg2);color:var(--ink);
  border-radius:2px;outline:none;cursor:pointer}
.btn-sm{font-family:var(--body);font-size:0.83rem;letter-spacing:0.05em;
  padding:0.42rem 0.95rem;background:var(--navy);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:background .2s;white-space:nowrap}
.btn-sm:hover{background:var(--gold)}
.btn-sm:disabled{background:var(--muted);cursor:not-allowed}
.tr-result{margin-top:1.1rem;padding:1.1rem;background:var(--bg2);
  border:1px solid var(--border);border-radius:2px;
  font-family:var(--body);font-size:1rem;line-height:1.72;color:var(--ink);white-space:pre-wrap}
.share-btn{font-family:var(--body);font-size:0.83rem;letter-spacing:0.08em;
  padding:0.38rem 0.95rem;background:transparent;color:var(--navy);
  border:1.5px solid var(--navy);border-radius:2px;cursor:pointer;transition:background .2s,color .2s}
.share-btn:hover{background:var(--navy);color:#fff}
.wr-wrap{max-width:1160px;margin:0 auto;padding:2.8rem 2rem 3.5rem}
.wr-grid{display:grid;grid-template-columns:1fr 360px;gap:2.2rem;align-items:start}
@media(max-width:840px){.wr-grid{grid-template-columns:1fr}}
.wr-h{font-family:var(--serif);font-size:1.85rem;font-weight:400;color:var(--ink);margin-bottom:0.4rem}
.wr-sub{font-family:var(--body);font-size:0.96rem;color:var(--muted);margin-bottom:1.6rem;line-height:1.6}
.fld{margin-bottom:1.1rem}
.lbl{display:block;font-family:var(--body);font-size:0.72rem;letter-spacing:0.15em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.36rem}
.inp{width:100%;font-family:var(--body);font-size:0.96rem;padding:0.55rem 0.75rem;
  background:var(--bg3);border:1px solid var(--border);border-radius:2px;
  color:var(--ink);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--gold)}
.ta{width:100%;min-height:280px;resize:vertical;font-family:var(--body);
  font-size:1.05rem;line-height:1.78;padding:0.95rem;background:var(--bg3);
  border:1px solid var(--border);border-radius:2px;color:var(--ink);
  outline:none;transition:border-color .2s}
.ta:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0.95rem}
.pol-box{margin-bottom:1.4rem;padding:0.95rem 1.1rem;
  background:rgba(27,58,107,0.05);border:1px solid rgba(27,58,107,0.18);border-radius:3px}
.pol-tit{font-family:var(--body);font-size:0.71rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--navy);margin-bottom:0.38rem}
.pol-li{font-family:var(--body);font-size:0.86rem;color:var(--muted);line-height:1.6;list-style:none}
.pol-li li{padding:0.12rem 0;display:flex;gap:0.45rem}
.pol-li li::before{content:"—";color:var(--gold);flex-shrink:0}
.pub-row{margin-top:1.3rem;display:flex;align-items:center;gap:0.9rem;flex-wrap:wrap}
.btn-pub{font-family:var(--body);font-size:0.96rem;letter-spacing:0.06em;
  padding:0.65rem 1.7rem;background:var(--navy);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:background .2s}
.btn-pub:hover{background:var(--gold)}
.btn-pub:disabled{background:var(--muted);cursor:not-allowed}
.ok-msg{font-family:var(--body);font-size:0.9rem;color:#2a6a2a;
  padding:0.42rem 0.85rem;background:#e8f5e8;border:1px solid #a8d8a8;border-radius:2px}
.aip{background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:1.4rem;position:sticky;top:84px}
.aip-h{font-family:var(--serif);font-size:1.12rem;font-weight:500;color:var(--ink);
  margin-bottom:0.28rem;display:flex;align-items:center;gap:0.45rem}
.aip-sub{font-family:var(--body);font-size:0.84rem;color:var(--muted);margin-bottom:1.3rem;line-height:1.5}
.ai-btns{display:flex;flex-direction:column;gap:0.52rem;margin-bottom:1rem}
.aib{width:100%;font-family:var(--body);font-size:0.86rem;padding:0.55rem 0.85rem;
  text-align:left;background:var(--bg2);color:var(--ink);
  border:1px solid var(--border);border-radius:2px;cursor:pointer;
  transition:border-color .2s,background .2s;display:flex;align-items:center;gap:0.55rem}
.aib:hover:not(:disabled){border-color:var(--navy);background:var(--bg)}
.aib:disabled{opacity:0.5;cursor:not-allowed}
.sep{border:none;border-top:1px solid var(--border);margin:0.85rem 0}
.tr-row2{display:flex;gap:0.52rem;align-items:center;margin-bottom:0.85rem}
.tr-lbl{font-family:var(--body);font-size:0.72rem;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--gold);white-space:nowrap}
.ai-out-lbl{font-family:var(--body);font-size:0.68rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:0.42rem}
.ai-out{background:var(--bg2);border:1px solid var(--border);border-radius:2px;
  padding:0.85rem;font-family:var(--body);font-size:0.9rem;line-height:1.7;
  color:var(--ink);min-height:65px;white-space:pre-wrap;font-style:italic;
  max-height:220px;overflow-y:auto}
.apply-btn{margin-top:0.65rem;width:100%;font-family:var(--body);font-size:0.81rem;
  padding:0.45rem;background:var(--navy);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:background .2s}
.apply-btn:hover{background:var(--gold)}
.pm-box{margin-top:1.4rem;padding:1rem;
  background:linear-gradient(135deg,rgba(27,58,107,0.05),rgba(196,147,42,0.05));
  border:1px solid var(--border);border-radius:3px}
.pm-tit{font-family:var(--body);font-size:0.7rem;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--navy);margin-bottom:0.75rem}
.pm-row{display:flex;flex-direction:column;gap:0.45rem}
.pm-feat{display:flex;align-items:center;justify-content:space-between;
  padding:0.45rem 0.65rem;background:var(--bg3);border:1px solid var(--border);border-radius:2px}
.pm-feat-t{font-family:var(--body);font-size:0.86rem;color:var(--ink)}
.badge{font-family:var(--body);font-size:0.6rem;letter-spacing:0.12em;
  text-transform:uppercase;padding:0.1rem 0.42rem;border-radius:1px;color:#fff}
.badge.free{background:var(--navy)}.badge.prem{background:var(--gold)}.badge.on{background:#2a6a2a}
.pm-unlock{margin-top:0.75rem;width:100%;font-family:var(--body);font-size:0.86rem;
  letter-spacing:0.05em;padding:0.5rem;background:transparent;color:var(--gold);
  border:1.5px solid var(--gold);cursor:pointer;border-radius:2px;transition:background .2s,color .2s}
.pm-unlock:hover{background:var(--gold);color:#fff}
.ov{position:fixed;inset:0;background:rgba(26,14,7,0.65);
  display:flex;align-items:center;justify-content:center;z-index:300;padding:1.4rem}
.modal{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  max-width:560px;width:100%;padding:2.2rem;position:relative;max-height:90vh;overflow-y:auto}
.modal-x{position:absolute;top:0.9rem;right:1.1rem;font-size:1.15rem;cursor:pointer;
  color:var(--muted);background:none;border:none;transition:color .2s}
.modal-x:hover{color:var(--ink)}
.modal-h{font-family:var(--serif);font-size:1.65rem;font-weight:400;color:var(--ink);margin-bottom:0.45rem}
.modal-sub{font-family:var(--body);font-size:0.95rem;color:var(--muted);margin-bottom:1.6rem;line-height:1.6}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;margin-bottom:1.6rem}
@media(max-width:460px){.plans{grid-template-columns:1fr}}
.plan{padding:1.3rem;border:1.5px solid var(--border);border-radius:3px;background:var(--bg2)}
.plan.feat{border-color:var(--gold);background:rgba(196,147,42,0.05)}
.plan-n{font-family:var(--body);font-size:0.7rem;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--muted);margin-bottom:0.42rem}
.plan.feat .plan-n{color:var(--gold)}
.plan-p{font-family:var(--serif);font-size:2rem;font-weight:300;color:var(--ink);margin-bottom:0.18rem}
.plan-per{font-family:var(--body);font-size:0.76rem;color:var(--muted)}
.plan-ul{margin-top:0.85rem;list-style:none}
.plan-ul li{font-family:var(--body);font-size:0.86rem;color:var(--ink);
  padding:0.2rem 0;display:flex;align-items:center;gap:0.42rem}
.plan-ul li::before{content:"✓";color:var(--gold);font-weight:700;flex-shrink:0}
.plan-ul li.dim{color:var(--muted)}
.plan-ul li.dim::before{content:"–";color:var(--border)}
.stripe-sec{border-top:1px solid var(--border);padding-top:1.3rem}
.stripe-lbl{font-family:var(--body);font-size:0.72rem;letter-spacing:0.15em;
  text-transform:uppercase;color:var(--muted);margin-bottom:0.65rem}
.s-row{display:grid;grid-template-columns:1fr auto;gap:0.65rem;margin-bottom:0.65rem}
.s-inp{font-family:var(--body);font-size:0.9rem;padding:0.52rem 0.72rem;
  border:1px solid var(--border);background:var(--bg3);border-radius:2px;
  color:var(--ink);outline:none;width:100%}
.s-cvc{width:75px}
.s-lock{font-family:var(--body);font-size:0.72rem;color:var(--muted);
  display:flex;align-items:center;gap:0.36rem;margin-bottom:0.85rem}
.s-pay{width:100%;font-family:var(--body);font-size:0.95rem;letter-spacing:0.06em;
  padding:0.72rem;background:var(--navy);color:#fff;border:none;cursor:pointer;
  border-radius:2px;transition:background .2s}
.s-pay:hover{background:var(--gold)}
.s-note{font-family:var(--body);font-size:0.73rem;color:var(--muted);
  text-align:center;margin-top:0.65rem;line-height:1.5}
.cookie-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--ink);color:rgba(255,255,255,0.85);
  display:flex;align-items:center;justify-content:space-between;
  padding:0.95rem 2rem;gap:1.4rem;flex-wrap:wrap}
.cookie-msg{font-family:var(--body);font-size:0.86rem;line-height:1.5}
.cookie-btn{font-family:var(--body);font-size:0.83rem;letter-spacing:0.08em;
  padding:0.38rem 1.1rem;background:var(--gold);color:#fff;
  border:none;cursor:pointer;border-radius:2px;white-space:nowrap;transition:background .2s;flex-shrink:0}
.cookie-btn:hover{background:#9a7219}
.foot{border-top:1px solid var(--border);padding:2.2rem;
  display:flex;flex-direction:column;align-items:center;gap:1.1rem;text-align:center}
.foot img{height:60px;width:auto;object-fit:contain;opacity:0.85}
.foot-links{display:flex;gap:1.6rem;font-family:var(--body);font-size:0.8rem;
  color:var(--muted);flex-wrap:wrap;justify-content:center}
.foot-links span{cursor:pointer;transition:color .2s}
.foot-links span:hover{color:var(--gold)}
.foot-copy{font-family:var(--body);font-size:0.72rem;color:var(--muted);opacity:0.7}
.loading{display:flex;align-items:center;gap:0.45rem;font-family:var(--body);
  font-size:0.86rem;color:var(--muted);font-style:italic;padding:0.9rem 0}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);
  border-top-color:var(--gold);animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
@keyframes fu{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
.fu{animation:fu 0.4s ease forwards}
.loading-screen{display:flex;align-items:center;justify-content:center;
  min-height:60vh;flex-direction:column;gap:1rem}
.loading-screen p{font-family:var(--body);color:var(--muted);font-size:1rem}
</style>
</head>

    text:"ÍNDICE DE CAPÍTULOS:\nI. Unas cuantas bombas para romper el hielo\nII. Comienza la historia familiar\nIII. Joan Vilaseca y los diarios de la familia\nIV. Los Segalés, otra familia que viene de antiguo\nV. Mis abuelos\nVI. Hacia Santa Coloma\nVII. Recuerdos del tío José\nVIII. Continúa el avi el relato de su vida\nIX. La salud de mi padre y otras batallas\nX. La nueva familia se abre camino\nXI. Los últimos años\nXII. La familia de mi madre: los Fructuoso\nApéndice: ¿Y qué fue de la vida de Irene?\n\n— — —\n\nHoy he dormido en Sant Feliu de Codines porque quería celebrar mis 70 años aquí. En la mañana del 25 de octubre, mi aniversario, me he asomado al balcón de casa para disfrutar una vez más del espléndido paisaje que se aprecia desde esta altura. Hay un extenso valle por el que serpentea un riachuelo junto a una montaña basáltica a la que llamamos «la roca pelada». Se puede divisar abajo y tranquilo el pueblo de Riells del Fai. Y al otro lado del valle, frente a mí, hay una antigua masía llamada El Villar. No muy lejos de allí se encuentra una pequeña ermita en cuyo altar la Virgen amamanta al niño, por eso se la llama «La Virgen de la Leche».\n\nA esta roca había ido de niña muchas veces de excursión, y de mayor, con grupos de amigos, en noches de luna llena, íbamos a comer allí sandías. Este es el paisaje que me ha acompañado en los largos veranos de tres meses a lo largo de mi vida.\n\nMuchos recuerdos afloran en mi mente. Parece que fue ayer cuando un día, al volver del colegio, le dije a mi madre que estaba harta de hacer cada día lo mismo. Debía yo tener entonces unos 14 años. Mi madre me miró sonriente y me contestó, sin inmutarse, que la niñez también pasa y cuando fuera mayor y tuviera mi propia familia, me daría cuenta de la velocidad con la que pasan los años.\n\nSi la tuviese ahora delante, le diría cuánta razón tenía; que, sin darme cuenta, apenas un respiro, he llegado a este punto, algo que entonces me parecía inimaginable. Es tiempo pues de poner en claro los recuerdos y contaros mi historia. Bueno, nuestra historia: la historia de la familia.",
    fullUrl:"irene-vilaseca.html",
    tags:["Barcelona","historia familiar","memoria"] },
  { id:2, name:"Olegario Sotelo Blanco", born:1938, country:"Galicia, España", flag:"🇪🇸", lang:"GL",
    cover:null,
    preview:"Érguete, neno. Xa fun á fonte por un cántaro de auga. Hoxe hai que lavarse porque vai ser o teu primeiro día de escola...",
    text:"ÍNDICE DE CAPÍTULOS:\nI. Un pastor de Quintela\nII. Primeiros traballos en Barcelona e o servizo militar\nIII. Regreso a Barcelona\nIV. Unha afronta xudicial\nV. Sotelo Blanco Edicións\nVI. O cancro\nVII. Escritos\nVIII. Tempo de lecer e viaxar\nIX. O Centro Galego de Barcelona\nX. Outros emprendementos\nXI. «Amigos, coñecidos e saudados»\nXII. Diario de pandemia\nXIII. Álbum de familia\nXIV. Co país ao lombo\nXV. Unha vida na maleta\n\n— — —\n\n–Érguete, neno. Xa fun á fonte por un cántaro de auga. Hoxe hai que lavarse porque vai ser o teu primeiro día de escola e a señorita mestra dixo que tiñas que ir ben limpo –dime a miña nai ben cedo un día de outono.\n\nA auga na cunca estaba fría, pero o aseo facíao só porque xa tiña cinco anos, así que me lavei ben rápido. Cun pantalón curto, a camisa de estrea que me fixera a costureira Jovita e unhas galochas novas que me mordían os dedos dos pés, corrín cara á cociña para almorzar.\n\nToño, que era un ano máis vello e xa ía á escola, explicoume que debía poñer na galocha dereita tres cravos na punta. Así, se algún rapaz se metía comigo, podía bourarlle na canela con esa galocha.\n\n–Por que teño que ir á escola? Non me sorprendeu ver a Jovita sentada á mesa. De cando en vez viña coa súa máquina de coser ao lombo e pasaba unsdías na casa remendando e facendo roupa para a familia. As teas xa as mercara a miña nai no comercio do Xosé María no Castro, que lle fiaba porque se coñecían dende nenos.\n\nJovita dicíame que os nenos debían de ir á escola para aprender moitas cousas e facer amigos. E faloume de rapaces que xa coñecía da misa. Lembrei cando ás noites, a carón do lume da lareira, os pais falaban dos veciños das cinco aldeas da parroquia: cantos fillos tiña cada matrimonio, se eran ricos ou pobres… E despois de facer os meus primeiros cálculos, malia non saber aritmética, decidín poñer catro cravos na miña galocha.\n\nA miña nai levoume ese primeiro día á escola e presentoume á señorita mestra, que só falaba castelán. Sentín moita estrañeza, porque eu unicamente coñecía a lingua dos meus pais. De que xeito podería aprender «moitas cousas» se non entendía o que falaban?",
    fullUrl:"olegario-sotelo.html",
    tags:["Galicia","emigración","editorial"] },
  { id:3, name:"Pablo Cava Domínguez", born:1944, country:"Extremadura, España", flag:"🇪🇸", lang:"ES",
    cover:null,
    preview:"Antes de empezar a contar mi vida, quiero decir algo con sinceridad: nunca he sido un hombre de leer muchos libros, y menos aún de escribirlos...",
    text:"ÍNDICE DE CAPÍTULOS:\nIntroducción: El porqué de estas páginas\nCapítulo 1: Nacimiento de Pablito\nCapítulo 2: Un pínfano llamado Pablo Cava Domínguez\nCapítulo 3: Mi padre Jacinto\nCapítulo 4: La familia de mi padre\nCapítulo 5: Navidades de 1951\nCapítulo 6: Segovia: 1954\nCapítulo 7: Años 1954–1955\nCapítulo 8: Hemos llegado a Murcia: 1955\nCapítulo 9: Manuel Cava, mi tutor: 1962\nCapítulo 10: Verano de 1964\nCapítulo 11: Años 1960–1962\nCapítulo 12: La muerte de mi madre\nCapítulo 13: Campeonato Nacional de Atletismo (1958)\nCapítulo 14: El destino (1959)\nCapítulo 15: Navidades de 1963\nCapítulo 16: Los señores Remigio (1963–1964)\nCapítulo 17: Visita a mi tía Rosa en Barcelona (1964)\nCapítulo 18: Alsasua, Navarra (1964)\nCapítulo 19: Amor a primera vista (Alsasua, 1964)\nCapítulo 20: Un encargo inesperado en Valladolid\nCapítulo 21: La mili (1965)\nCapítulo 22: Licenciado (el 15 de diciembre de 1967), pero…\nCapítulo 23: De Alcántara a Barcelona (1967)\nCapítulo 24: Visita a un compañero de colegio (1967)\nCapítulo 25: Tres trabajos, un pínfano y un currante nato (1969)\nCapítulo 26: Diseñando circuitos impresos y mi futuro\nCapítulo 27: Verano en Estartit\nCapítulo 28: El señor Pajarito y la caída de DIGIPLOT\nCapítulo 29: Juan Belmonte (1980)\nCapítulo 30: Historia de mi vida (Yako)\nCapítulo 31: Carta a Chencha\nCapítulo 32: Pharmispania y la piscina: últimos años de trabajo\nCapítulo 33: Ruta extremeña con mi hijo\nCapítulo 34: Pinfanada en Valladolid\nAnexos: Sobre DIGIPLOT y la herida invisible\nPostdata: Familia futbolera – Can Barça\n\n— — —\n\nAntes de empezar a contar mi vida, quiero decir algo con sinceridad: nunca he sido un hombre de leer muchos libros, y menos aún de escribirlos. Pero son tantas las cosas que quiero dejar por escrito, que sé que algunas quedarán pendientes para otra ocasión.\n\nHe decidido no hablar de vivencias relacionadas con mi mujer, Ramona –fallecida el 26 de febrero de 2024– ni con mis hijos. Ellos forman parte de mi intimidad y quiero respetar su privacidad. Lo que sí puedo asegurar es que todo lo que aquí cuento es real. Son sucesos que viví, que me marcaron y que han influido en mi forma de ser a lo largo de toda mi vida.\n\nEn 1943 se formalizó en España el Patronato de Huérfanos del Ejército. Se crearon centros de enseñanza para acoger a los hijos de militares fallecidos por cualquier circunstancia. Para las viudas o familiares que tenían a su cargo a esos niños, no suponía ningún gasto económico. Ese Patronato formó parte esencial de mi historia.\n\nEste libro va dedicado a mi madre, Francisca Domínguez Miranda, que no tuvo la suerte de disfrutar de la vida como cualquier cristiano merece. Fue una madre luchadora, que se sacrificó por sus hijos. Un derrame cerebral apagó la luz de su vida cuando por fin podía empezar a disfrutar de nosotros. Mamá: te quise mucho y te sigo queriendo. D.E.P.\n\nTambién va dedicado a mi padre, Jacinto Cava González. Se fue demasiado pronto. Yo, Pablito, tenía solo dieciocho meses y no pude conocerlo. Mi madre me habló mucho de él: que era muy bueno. A veces ser tan bueno no es bueno. Él se dejó llevar por esa bondad, aun estando delicado de salud. No le guardo rencor. Amaba su profesión y eso le hizo decir que sí cuando no debía. D.E.P.\n\nAntes de seguir, quiero presentar a mis padres con un recuerdo cariñoso.",
    fullUrl:"pablo-cava.html",
    tags:["Extremadura","traición","memoria"] },
  { id:4, name:"X. Batlle", born:1961, country:"España", flag:"🇪🇸", lang:"CA",
    cover:null,
    preview:"Este no va a ser un relato escrito a lo largo, sino hacia el fondo de mí mismo...",
    text:"ÍNDICE DE CAPÍTULOS:\nPresentación: De Barcelona al mundo\nÁlbum de familia: 1998\nEl nuevo mundo: 2001\nCelebración del medio siglo: 2011\nEl año de la pandemia: 2020\nRoda al món i torna al Born: 2025\nDespedida: La guinda del pastel\n\n— — —\n\nEste no va a ser un relato escrito a lo largo, sino hacia el fondo de mí mismo. Podría decirse que nací en una cuna dorada (un siglo en paz, una ciudad hermosa que bebe en las aguas del Mediterráneo, familia acomodada) y que nada me faltó, porque a mi cuerpo bien nutrido y mejor educado, mis padres y el resto de mi familia le añadieron ideas y sueños. Quizá demasiados sueños. Algo me faltó siempre.\n\nDos amigos de juventud me han acompañado toda la vida: Imanol Lizarralde, otro «espíritu contemplativo» desubicado y lletraferit como yo, y Toni Alastuey, un «hombre de acción» cuyo aprecio y fortaleza me permitieron conocer aquello que era incapaz de vislumbrar con mis propios ojos.\n\nEstudié Filosofía y mi formación me permitió trabajar en una editorial (Ronsel, fundada por Olegario Sotelo Blanco) durante quince años, publicando a Dickens, Saramago y también a autores noveles como Miguel Herráez, Miguel Catalán o Asdrúbal Hernández, que con el paso de los años se convirtieron en amigos.\n\nEn ese momento de crecimiento personal nacieron mis dos hijos (Carlos y Àlex), y comencé a sufrir las primeras orfandades, lo que anunciaba un cambio de ciclo. Poco después de cumplir los cuarenta, me divorcié y mi vida se partió en dos. Dejé entonces mi trabajo, mi ciudad, mi pasado y salté al vacío.\n\nPor desgracia, a mí nunca me cuadraron las palabras de mi abuelo paterno: «¿Y cómo queréis que me haga rico si me paso el día trabajando?». Yo me paso el día pensando, imaginando, también escribiendo, y eso no da ni para ser pobre.",
    fullUrl:"javier-batlle.html",
    tags:["Barcelona","poesía","memoria"] },
];

async function callAI(system, userMsg) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000,
      system, messages:[{role:"user",content:userMsg}] })
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.content[0].text;
}

function FaqItem({q,a}) {

  return (
    <div className="faq-item">

        <span>{q}</span><span className="faq-icon">{open?"−":"+"}</span>
      </button>
      {open&&<div className="faq-a">{a}</div>}
    </div>
  );
}

function AutoCard({a,onClick}) {
  return (
    <div className="card fu" onClick={onClick}>
      {a.cover&&<img src={a.cover} alt={a.title||a.name} style={{width:"100%",height:"140px",objectFit:"cover",borderRadius:"2px",marginBottom:"0.8rem",border:"1px solid var(--border)"}}/>}

      <div className="c-prev">"{a.preview}"</div>
      <div className="c-foot">
        <div className="tags">{a.tags.slice(0,2).map(t=><span key={t} className="tag">{t}</span>)}</div>
        {a.fullUrl

    </div>
  );
}

          <button className={`nl ${view==="home"?"on":""}`} onClick={()=>setView("home")}>{t.nav_home}</button>
          <div className="lang-tog">
            <button className={`lang-btn ${lang==="ES"?"on":""}`} onClick={()=>setLang("ES")}>ES</button>
            <button className={`lang-btn ${lang==="EN"?"on":""}`} onClick={()=>setLang("EN")}>EN</button>
          </div>
          <button className="btn-pri btn-navy" onClick={()=>setView("library")}>{t.nav_lib}</button>
          <button className="btn-pri btn-gold-c" onClick={()=>setView("write")}>{t.nav_write}</button>
        </nav>
      </header>
    </>
  );
}

function Home({autos,openAuto,setView,t}) {
  return (
    <div>
      <section className="hero">
        <img src={LOGO_FIG} alt="Locus Mundi — comunidad global" className="hero-logo"/>
        <div className="hero-slogan">{t.slogan}</div>
        <p className="hero-sub">{t.hero_sub}</p>
        <div className="hero-btns">
          <button className="btn-gold" onClick={()=>setView("write")}>{t.btn_write}</button>
          <button className="btn-out" onClick={()=>setView("library")}>{t.btn_explore}</button>
        </div>
      </section>
      <div className="sec" style={{paddingTop:0,paddingBottom:0}}>
        <div className="stats">
          <div><span className="stat-n">{autos.length}</span><span className="stat-l">{t.stories}</span></div>
          <div><span className="stat-n">{[...new Set(autos.map(a=>a.country))].length}</span><span className="stat-l">{t.countries}</span></div>
          <div><span className="stat-n">{[...new Set(autos.map(a=>a.lang))].length}</span><span className="stat-l">{t.languages}</span></div>
          <div><span className="stat-n">∞</span><span className="stat-l">{t.lives}</span></div>
        </div>
      </div>
      <section className="sec">
        <div className="sec-lbl">{t.recent_lbl}</div>
        <div className="sec-h">{t.recent_h}</div>
        <div className="grid">{[...autos].sort((a,b)=>a.id-b.id).map(a=><AutoCard key={a.id} a={a} onClick={()=>openAuto(a)}/>)}</div>
        {autos.length>6&&<div style={{marginTop:"2rem",textAlign:"center"}}><button className="btn-out" onClick={()=>setView("library")}>{t.see_all}</button></div>}
      </section>
      <section className="sec faq-sec">
        <div className="sec-lbl">{t.faq_lbl}</div>
        <div className="sec-h">{t.faq_h}</div>
        {[[t.faq_q1,t.faq_a1],[t.faq_q2,t.faq_a2],[t.faq_q3,t.faq_a3],[t.faq_q4,t.faq_a4]].map(([q,a],i)=><FaqItem key={i} q={q} a={a}/>)}
      </section>
      <section className="cta">
        <img src={LOGO_FIG} alt="Locus Mundi" style={{height:"140px",width:"auto",objectFit:"contain",marginBottom:"1.5rem"}}/>
        <div className="cta-h1">{t.cta_h1}</div>
        <div className="cta-h2">{t.cta_h2}</div>
        <p className="cta-p">{t.cta_body}</p>
        <button className="btn-gold" onClick={()=>setView("write")}>{t.cta_btn}</button>
        <div style={{marginTop:"2rem",fontSize:"0.82rem",color:"rgba(247,240,224,0.6)",letterSpacing:"0.08em"}}>
          <a href="mailto:contactlocusmundi@gmail.com" style={{color:"var(--gold2)",textDecoration:"none"}}>contactlocusmundi@gmail.com</a>
        </div>
      </section>
    </div>
  );
}

function Library({autos,openAuto,t}) {
  const [q,setQ]=useState("");
  const filt=autos.filter(a=>{const s=q.toLowerCase();return !s||a.name.toLowerCase().includes(s)||a.country.toLowerCase().includes(s)||a.text.toLowerCase().includes(s)||a.tags.some(tg=>tg.toLowerCase().includes(s));});
  return (
    <section className="sec">
      <div className="sec-lbl">Archivo global</div>
      <div className="sec-h">{t.recent_h}</div>
      <div className="sw"><span className="sico">🔍</span><input className="si" placeholder={t.search_ph} value={q} onChange={e=>setQ(e.target.value)}/></div>
      {filt.length===0?<p style={{fontFamily:"var(--body)",color:"var(--muted)",fontStyle:"italic"}}>{t.no_results}</p>:<div className="grid">{[...filt].sort((a,b)=>a.id-b.id).map(a=><AutoCard key={a.id} a={a} onClick={()=>openAuto(a)}/>)}</div>}
    </section>
  );
}

function Read({auto,setView,t}) {
  const [tl,setTl]=useState("ES");const [tr,setTr]=useState("");const [doing,setDoing]=useState(false);const [copied,setCopied]=useState(false);
  if(!auto){setView("library");return null;}
  const ln=LANGS_UI.find(l=>l.code===tl)?.label||tl;
  const translate=async()=>{setDoing(true);setTr("");try{setTr(await callAI(`Eres un traductor literario. Traduce este fragmento autobiográfico al ${ln} preservando la voz personal. Solo la traducción.`,auto.text));}catch(e){setTr("Error.");}setDoing(false);};
  const share=()=>{setCopied(true);setTimeout(()=>setCopied(false),2200);};
  return (
    <div className="read-wrap fu">
      <button className="back" onClick={()=>setView("library")}>{t.back}</button>
      <div style={{fontSize:"1.8rem",marginBottom:"0.45rem"}}>{auto.flag}</div>
      <div className="r-orig">{auto.country} · {auto.lang}</div>
      <h1 className="r-name">{auto.name}</h1>
      <div className="r-meta">{t.born} {auto.born||"—"} · {auto.tags.join(", ")}</div>
      <div className="r-body">{auto.text.split("\n\n").map((p,i)=><p key={i}>{p}</p>)}</div>
      <div style={{marginTop:"1.8rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"0.9rem"}}>
        <div className="tags">{auto.tags.map(tg=><span key={tg} className="tag">{tg}</span>)}</div>
        <button className="share-btn" onClick={share}>{copied?t.share_copied:`↗ ${t.share_btn}`}</button>
      </div>
      {auto.fullUrl && (
        <div style={{margin:"1.8rem 0",padding:"1.2rem 1.5rem",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"3px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"1rem"}}>
          <span style={{fontFamily:"var(--body)",fontSize:"1rem",color:"var(--ink)"}}>Esta historia incluye fotos e índice de capítulos.</span>
          <a href={auto.fullUrl} target="_blank" className="read-full" style={{textDecoration:"none"}}>📖 Leer historia completa</a>
        </div>
      )}
      <div className="tr-bar">
        <div className="tr-tit">{t.read_in}</div>
        <div className="tr-row">
          <select className="sel" value={tl} onChange={e=>{setTl(e.target.value);setTr("")}}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select>
          <button className="btn-sm" onClick={translate} disabled={doing}>{doing?<span style={{display:"flex",alignItems:"center",gap:"0.38rem"}}><span className="sp"/>…</span>:t.translate}</button>
        </div>
        {tr&&<div className="tr-result">{tr}</div>}
      </div>
    </div>
  );
}

function PremiumModal({onClose,onPaid,t}) {
  const [paying,setPaying]=useState(false);const [done,setDone]=useState(false);
  const pay=()=>{setPaying(true);setTimeout(()=>{setDone(true);setPaying(false);onPaid();},1800);};
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-x" onClick={onClose}>✕</button>
        {done?(<div style={{textAlign:"center",padding:"1.8rem 0"}}><div style={{fontSize:"2.2rem",color:"var(--gold)",marginBottom:"0.9rem"}}>✦</div><div className="modal-h" style={{textAlign:"center"}}>{t.prem_activated}</div><p style={{fontFamily:"var(--body)",color:"var(--muted)",marginTop:"0.75rem"}}>{t.prem_activated_sub}</p></div>):(
          <>
            <div className="modal-h">{t.prem_h}</div>
            <p className="modal-sub">{t.prem_sub}</p>
            <div className="plans">
              <div className="plan"><div className="plan-n">{t.free_plan}</div><div className="plan-p">€0</div><div className="plan-per">{t.forever}</div><ul className="plan-ul"><li>{t.unlimited_text}</li><li>IA</li><li>{t.one_img}</li><li className="dim">{t.ten_img}</li><li className="dim">{t.pdf_dl}</li></ul></div>
              <div className="plan feat"><div className="plan-n">{t.prem_plan}</div><div className="plan-p">€9<span style={{fontSize:"0.95rem"}}>.99</span></div><div className="plan-per">{t.per_story}</div><ul className="plan-ul"><li>{t.unlimited_text}</li><li>IA</li><li>{t.one_img}</li><li>{t.ten_img}</li><li>{t.pdf_dl}</li></ul></div>
            </div>
            <div className="stripe-sec">
              <div className="stripe-lbl">Stripe</div>
              <div className="s-row"><input className="s-inp" placeholder="•••• •••• •••• ••••"/></div>
              <div className="s-row"><input className="s-inp" placeholder="MM/AA"/><input className="s-inp s-cvc" placeholder="CVC"/></div>
              <div className="s-lock">🔒 {t.prem_note}</div>
              <button className="s-pay" onClick={pay} disabled={paying}>{paying?<span style={{display:"flex",alignItems:"center",gap:"0.45rem",justifyContent:"center"}}><span className="sp"/>{t.processing}</span>:t.pay}</button>
              <p className="s-note">{t.prem_note}</p>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ContactModal({onClose,t}) {
  const [f,setF]=useState({name:"",email:"",msg:""});const [sent,setSent]=useState(false);
  const up=(k,v)=>setF(p=>({...p,[k]:v}));
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-x" onClick={onClose}>✕</button>
        {sent?(<div style={{textAlign:"center",padding:"1.8rem 0"}}><div style={{fontSize:"2rem",color:"var(--gold)",marginBottom:"0.9rem"}}>✦</div><p style={{fontFamily:"var(--body)",color:"var(--muted)"}}>{t.contact_sent}</p></div>):(
          <>
            <div className="modal-h">{t.contact_h}</div>
            <p className="modal-sub">{t.contact_sub}</p>
            <div className="fld"><label className="lbl">{t.contact_name}</label><input className="inp" value={f.name} onChange={e=>up("name",e.target.value)}/></div>
            <div className="fld"><label className="lbl">{t.contact_email}</label><input className="inp" type="email" value={f.email} onChange={e=>up("email",e.target.value)}/></div>
            <div className="fld"><label className="lbl">{t.contact_msg}</label><textarea className="ta" style={{minHeight:"130px"}} value={f.msg} onChange={e=>up("msg",e.target.value)}/></div>
            <button className="btn-pub" onClick={()=>setSent(true)} disabled={!f.name||!f.email||!f.msg}>{t.contact_send}</button>
          </>
        )}
      </div>
    </div>
  );
}

function Write({setView,onPublish,t}) {
  const [f,setF]=useState({name:"",born:"",country:"",lang:"ES",title:"",subtitle:"",text:"",coverImg:null});
  const [ao,setAo]=useState("");const [al,setAl]=useState(false);const [am,setAm]=useState("");
  const [tl,setTl]=useState("EN");const [pub,setPub]=useState(false);
  const [showPM,setShowPM]=useState(false);const [isPrem,setIsPrem]=useState(false);
  const up=(k,v)=>setF(p=>({...p,[k]:v}));
  const run=async(mode)=>{
    if(!f.text.trim()&&mode!=="structure")return;
    setAl(true);setAm(mode);setAo("");
    const ln=LANGS_UI.find(l=>l.code===tl)?.label||tl;
    try{
      let sys="",msg="";
      if(mode==="continue"){sys="Eres un asistente de escritura autobiográfica. Continúa el texto respetando voz, idioma y estilo. Solo la continuación.";msg="Continúa:\n\n"+f.text;}
      else if(mode==="improve"){sys="Eres un editor literario. Mejora este texto haciéndolo más evocador sin cambiar la voz. Solo el texto mejorado.";msg=f.text;}
      else if(mode==="translate"){sys="Eres un traductor literario. Traduce al "+ln+" preservando la voz personal. Solo la traducción.";msg=f.text;}
      else if(mode==="structure"){sys="Eres un editor amable. Sugiere estructura y temas para esta autobiografía.";msg=f.text||"Nombre: "+f.name+". País: "+f.country+". Año: "+f.born+".";}
      setAo(await callAI(sys,msg));
    }catch(e){setAo("Error.");}
    setAl(false);
  };
  const apply=()=>{if(am==="improve"||am==="translate")up("text",ao);else if(am==="continue")up("text",f.text+"\n\n"+ao);setAo("");};
  const publish=()=>{if(!f.name||!f.text)return;onPublish({id:Date.now(),name:f.name,born:parseInt(f.born)||0,country:f.country||"—",flag:"✍️",lang:f.lang,title:f.title||f.name,subtitle:f.subtitle||"",cover:f.coverImg||null,preview:f.text.slice(0,88)+"...",text:f.text,tags:["nueva historia"]});setPub(true);};
  return (
    <div className="wr-wrap">
      {showPM&&<PremiumModal onClose={()=>setShowPM(false)} onPaid={()=>{setIsPrem(true);setShowPM(false);}} t={t}/>}
      <button className="back" onClick={()=>setView("home")}>{t.back_home}</button>
      <div className="wr-grid">
        <div>
          <h2 className="wr-h">{t.write_h}</h2>
          <p className="wr-sub">{t.write_sub}</p>
          <div className="fld">
            <label className="lbl">{t.f_title}</label>
            <input className="inp" placeholder={t.f_title_ph} value={f.title||""} onChange={e=>up("title",e.target.value)}/>
          </div>
          <div className="fld">
            <label className="lbl">{t.f_subtitle}</label>
            <input className="inp" placeholder={t.f_subtitle_ph} value={f.subtitle||""} onChange={e=>up("subtitle",e.target.value)}/>
          </div>
          <div className="pol-box">
            <div className="pol-tit">{t.policy_tit}</div>
            <ul className="pol-li"><li>{t.pol1}</li><li>{t.pol2}</li><li>{t.pol3}</li><li>{t.pol4}</li></ul>
          </div>
          <div className="frow">
            <div className="fld"><label className="lbl">{t.f_name}</label><input className="inp" placeholder={t.f_name_ph} value={f.name} onChange={e=>up("name",e.target.value)}/></div>
            <div className="fld"><label className="lbl">{t.f_born}</label><input className="inp" type="number" placeholder="Ej. 1960" value={f.born} onChange={e=>up("born",e.target.value)}/></div>
          </div>
          <div className="frow">
            <div className="fld"><label className="lbl">{t.f_country}</label><input className="inp" value={f.country} onChange={e=>up("country",e.target.value)}/></div>
            <div className="fld"><label className="lbl">{t.f_lang}</label><select className="inp sel" value={f.lang} onChange={e=>up("lang",e.target.value)}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select></div>
          </div>
          <div className="fld">
            <label className="lbl">{t.f_text}</label>
            <div style={{display:"flex",gap:"0.5rem",marginBottom:"0.5rem",flexWrap:"wrap"}}>
              <button type="button" className="toolbar-btn" onClick={()=>{up("text",f.text+"

[Capítulo] Título del capítulo

")}}>+ Capítulo</button>
              <span style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)",alignSelf:"center"}}>Gratuito · Free</span>
            </div>
            <textarea className="ta" placeholder={t.f_text_ph} value={f.text} onChange={e=>up("text",e.target.value)}/>
          </div>
          <div className="fld">
            <label className="lbl">📷 {t.f_cover}</label>
            <div style={{display:"flex",alignItems:"center",gap:"0.8rem",flexWrap:"wrap"}}>
              <label style={{fontFamily:"var(--body)",fontSize:"0.88rem",padding:"0.45rem 1rem",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"2px",cursor:"pointer",color:"var(--navy)"}}>
                {t.f_cover_btn}
                <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>up("coverImg",ev.target.result);r.readAsDataURL(file);}}/>
              </label>
              {f.coverImg && <img src={f.coverImg} alt="portada" style={{height:"60px",width:"auto",borderRadius:"2px",border:"1px solid var(--border)"}}/>}
              <span style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)"}}>{t.f_cover_note}</span>
            </div>
          </div>
          <div className="pub-row">
            <button className="btn-pub" onClick={publish} disabled={!f.name||!f.text}>{t.publish}</button>
            <button className="btn-out" onClick={()=>!isPrem?setShowPM(true):null}>📄 PDF {isPrem?"":"✦"}</button>
            {pub&&<span className="ok-msg">{t.published_ok}</span>}
          </div>
        </div>
        <div className="aip">
          <div className="aip-h"><span style={{color:"var(--gold)"}}>✦</span> {t.ai_h}</div>
          <p className="aip-sub">{t.ai_sub}</p>
          <div className="ai-btns">
            <button className="aib" disabled={al} onClick={()=>run("continue")}><span>→</span><span><b>{t.ai_continue}</b> — {t.ai_continue_d}</span></button>
            <button className="aib" disabled={al} onClick={()=>run("improve")}><span>✦</span><span><b>{t.ai_improve}</b> — {t.ai_improve_d}</span></button>
            <button className="aib" disabled={al} onClick={()=>run("structure")}><span>◈</span><span><b>{t.ai_structure}</b> — {t.ai_structure_d}</span></button>
          </div>
          <hr className="sep"/>
          <div className="tr-row2">
            <span className="tr-lbl">{t.translate_to}</span>
            <select className="sel" style={{flex:1}} value={tl} onChange={e=>setTl(e.target.value)}>{LANGS_UI.map(l=><option key={l.code} value={l.code}>{l.label}</option>)}</select>
            <button className="btn-sm" disabled={al} onClick={()=>run("translate")}>{t.go}</button>
          </div>
          {al&&<div className="loading"><span className="sp"/>{t.ai_thinking}</div>}
          {ao&&!al&&(<div><div className="ai-out-lbl">{t.proposal}</div><div className="ai-out">{ao}</div>{(am==="continue"||am==="improve"||am==="translate")&&<button className="apply-btn" onClick={apply}>{am==="continue"?t.add_text:t.replace_text}</button>}</div>)}
          <div className="pm-box">
            <div className="pm-tit">{t.pub_opts}</div>
            <div className="pm-row">
              <div className="pm-feat"><span className="pm-feat-t">{t.unlimited_text}</span><span className="badge free">{t.free}</span></div>
              <div className="pm-feat"><span className="pm-feat-t">{t.one_img}</span><span className="badge free">{t.free}</span></div>
            </div>
            <div style={{marginTop:"0.6rem",padding:"0.7rem 0.8rem",background:"var(--bg2)",border:"1px solid var(--gold)",borderRadius:"2px"}}>
              <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--gold)",fontWeight:"600",marginBottom:"0.4rem",textTransform:"uppercase",letterSpacing:"0.12em"}}>Opción Ilustrada</div>
              <div className="pm-row">
                <div className="pm-feat"><span className="pm-feat-t">{t.ten_img}</span><span className={"badge "+(isPrem?"on":"prem")}>{isPrem?t.active:t.premium}</span></div>
                <div className="pm-feat"><span className="pm-feat-t">{t.pdf_dl}</span><span className={"badge "+(isPrem?"on":"prem")}>{isPrem?t.active:t.premium}</span></div>
              </div>
              {!isPrem&&<button className="pm-unlock" onClick={()=>setShowPM(true)}>{t.unlock}</button>}
            </div>
            <div style={{marginTop:"0.6rem",padding:"0.7rem 0.8rem",background:"var(--bg2)",border:"1px solid var(--navy)",borderRadius:"2px"}}>
              <div style={{fontFamily:"var(--body)",fontSize:"0.78rem",color:"var(--navy)",fontWeight:"600",marginBottom:"0.2rem",textTransform:"uppercase",letterSpacing:"0.12em"}}>{t.ai_sub}</div>
              <div style={{fontFamily:"var(--body)",fontSize:"0.74rem",color:"var(--muted)",marginBottom:"0.4rem"}}>{t.ai_sub_note}</div>
              <button className="pm-unlock" style={{borderColor:"var(--navy)",color:"var(--navy)"}} onClick={()=>alert("Próximamente · Coming soon")}>€4,99/mes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Footer({t,onContact}) {
  return (
    <footer className="foot">
      <img src={LOGO_SRC} alt="Locus Mundi"/>
      <div className="foot-links">
        <span>{t.foot_policy_lnk}</span>
        <a href="mailto:contactlocusmundi@gmail.com" style={{color:"var(--gold)",cursor:"pointer",textDecoration:"none"}}>{t.foot_contact}</a>
      </div>
      <p style={{fontFamily:"var(--body)",fontSize:"0.8rem",color:"var(--muted)",maxWidth:"460px",lineHeight:1.6,textAlign:"center"}}>{t.foot_policy}</p>
      <div className="foot-copy">locusmundi.com · {new Date().getFullYear()}</div>
    </footer>
  );
}

function App() {
  const [lang,setLang]=useState(()=>{const bl=(navigator.language||"es").slice(0,2).toUpperCase();return bl==="EN"?"EN":"ES";});
  const t=T[lang];
  const [view,setView]=useState("home");
  const [sel,setSel]=useState(null);
  const [autos,setAutos]=useState(SAMPLE);
  const [showContact,setShowContact]=useState(false);
  const [cookieOk,setCookieOk]=useState(false);
  const open=(a)=>{setSel(a);setView("read");};
  return (
    <div>
      <Header view={view} setView={setView} lang={lang} setLang={setLang} t={t}/>
      {view==="home"&&<Home autos={autos} openAuto={open} setView={setView} t={t}/>}
      {view==="library"&&<Library autos={autos} openAuto={open} t={t}/>}
      {view==="read"&&<Read auto={sel} setView={setView} t={t}/>}
      {view==="write"&&<Write setView={setView} onPublish={a=>{setAutos(p=>[...p,a]);setView("library");}} t={t}/>}
      <Footer t={t} onContact={()=>setShowContact(true)}/>
      {showContact&&<ContactModal onClose={()=>setShowContact(false)} t={t}/>}
      {!cookieOk&&<div className="cookie-bar"><span className="cookie-msg">{t.cookie_msg}</span><button className="cookie-btn" onClick={()=>setCookieOk(true)}>{t.cookie_ok}</button></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
